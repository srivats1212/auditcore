ympus Medical Systems Corporation","fei":"3002807795","date":"2026-10-07","n":3,"cfr":"21 CFR 820.75","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/olympus-medical-systems-corporation-729208-10072026","t":"820.75(a). For example, d. At the Shirakawa facility, your firm did not adequately validate the testing process used in the production of UHI-4 Insufflation Unit where the results could not be fully verified by subsequent inspection and testing. For example, the software-driven functional testing process used to evaluate device performance was not adequately validated to ensure that it consistently produced devices meeting specifications in that it did not include appropriate test cases to demonstrate user requirements met acceptance criteria.\n\nThe adequacy of your firm's response cannot be determined. Your response states that process validation deficiencies are being addressed through ongoing remediation activities and global CAPA efforts, and that validation activities are planned or underway to ensure processes consistently produce conforming devices. You have not provided objective ","a":true,"b":true,"h":[[259,548]],"id":26},{"y":2026,"k":0,"fac":"Linemaster Switch Corporation","fei":null,"date":"2026-05-27","n":5,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/linemaster-switch-corporation-730215-05272026","t":"Failure to document procedures for the validation of the application of computer software used for the monitoring and measurement of requirements, as required by ISO 13485:2016, Clause 7.6\n\nSpecifically, a. Your firm's Monitor Program (b)(4) software, used in calibration procedure TM-118 Rev C and quality test procedure QTP (b)(4) Rev G for calibration and testing of (b)(4) , foot pedal accessory devices, was not adequately validated. For example, the validation, TM-117 Rev A, September 26, 2013, did not include:\n\nRaw data from validation testing\n\nPass/fail criteria or results\n\nStatistical analysis or sample size rationale\n\nVerification that the software accurately measures output values and reliably detects nonconforming devices\n\nDuring FDA's inspection our Investigator observed the testing setup of (b)(4) . He observed there were multiple software COM port errors in both in-process ass","a":false,"b":true,"h":[[452,583]],"id":222},{"y":2025,"k":0,"fac":"Uriel Pharmacy, Inc.","fei":"3003813327","date":"2025-10-21","n":3,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/uriel-pharmacy-inc-709977-10212025","t":"with \"higher water activity\" for Burkholderia cepacia , and will perform AET if needed. Your response is inadequate because it lacks adequate scientific justification, and your interim plans remain unclear. For example, the (b)(4) Microbiology System validation report is incomplete and was not reviewed and approved by your firm. You only evaluated (b)(4) of your approximate (b)(4) products, which contain differing components and preservatives. In addition, your plans do not include testing of all aqueous dugs for Burkholderia cepacia or testing of all drugs for preservative effectiveness. Your response also did not consider a retrospective evaluation of impact to product on the market.\n\nIn response to this letter, provide a comprehensive assessment of your laboratory practices, procedures, methods, equipment, documentation, and analyst competencies. Based on this review, provide a detail","a":true,"b":true,"h":[[251,282]],"id":642},{"y":2024,"k":0,"fac":"Xoran Technologies, LLC","fei":null,"date":"2024-12-09","n":2,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/xoran-technologies-llc-694229-12092024","t":"(e.g., 64-bit Region of Interest (ROI) tool, which \"[did] not work properly\"). However, the test cases and results indicate that the software was validated at the software system level, utilizing only functional testing (i.e., black-box) techniques. The validation documentation does not include component testing and integration testing. Since January 2020, your firm has logged approximately 460 complaints which include \"Software Issue > XoranCAT\" in the complaint categorization code. These complaints allege problems such as freezing/crashing software, image reconstruction issues, and corrupted files.\n\nWe reviewed your firm's responses dated July 29, 2024, August 30, 2024, and September 30, 2024, and conclude that they are not adequate. Your firm's responses state (b)(4) . However, your responses do not yet include the documentation for our evaluation. Furthermore, your responses do not i","a":true,"b":true,"h":[[250,337]],"id":1303},{"y":2023,"k":0,"fac":"Caltag Medsystems Ltd","fei":null,"date":"2023-08-31","n":5,"cfr":"21 CFR 820.72","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/caltag-medsystems-ltd-662115-08312023","t":"dated Feb 2020, describes procedures to validate the (b)(4) Flow Cytometer for use the Quality Control testing of CE/IVD TVTs and FDA-cleared TVTs. However, your firm has not adequately documented, reviewed and approved the procedures. Specifically, your firm's Installation Qualification (IQ) phase of Flow Cytometer was not adequately reviewed and approved. During the inspection, validation records were requested, and the records showed that the \"Reviewer/Approver\" signatures had not been signed. Further, on May 8, 2014 (b)(4) performed onsite maintenance of instrument and reported to your firm that the instrument is run in a room with \"no or little air conditioning\" which may affect the instrument.","a":true,"b":false,"h":[[250,500]],"id":2100},{"y":2023,"k":0,"fac":"Ming Fai Industrial Co LTD","fei":null,"date":"2023-06-01","n":1,"cfr":"21 CFR 820.75","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ming-fai-industrial-co-ltd-660075-06012023","t":"\"validation of formulation systems.\" The procedure documents how an Installation Qualification (IQ), Operational Qualification (OQ), and Performance Qualification (PQ) should be performed. However, the response is inadequate because of the following: - There is no specific documentation of the IQ/OQ/PQ protocol and report related to the formulation of the ultrasound gel that include acceptance criteria. - No CAPA to track and evaluate effectiveness of corrective actions - No documentation of training on the new procedure d. Your firm states that their cleaning validation incorrectly did not list the mixing tank used in the manufacture of ultrasound gel. In your response, your firm provided an equipment list that only lists the mixing tank used for the ultrasound gel manufacturing process. Your firm states that the assigned QA engineer is responsible to review and check the mixer code for","a":true,"b":true,"h":[[253,405]],"id":1992}],"CS-AUD-002":[{"y":2026,"k":0,"fac":"SnugZ USA, Inc.","fei":"3009188709","date":"2026-09-28","n":4,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/snugz-usa-inc-735284-09282026","t":"211.22(d)).\n\nAdequate validation of cleaning procedures (21 CFR 211.67(b)).\n\nPerformance of periodic (i.e. at least annual) product quality reviews (21 CFR 211.180(e)).\n\nAdequate documentation of each significant step in batch production records (21 CFR 211.188(b)).\n\nAdequate review of all production and test records, including deviations, OOS results, and audit trails, prior to releasing drug product to the market (21 CFR 211.192).\n\nSignificant findings in this letter demonstrate that your firm does not operate an effective quality system in accord with CGMP. In addition to the lack of effective management oversight of your production and laboratory operations, we found your QU is not enabled to exercise proper authority and/or has insufficiently implemented its responsibilities. Executive management should immediately and comprehensively assess your company's global manufacturing opera","a":true,"b":true,"h":[[268,435]],"id":9},{"y":2026,"k":0,"fac":"Curia New York, Inc.","fei":"1310298","date":"2026-09-18","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/curia-new-york-inc-728790-09182026","t":"Failure to have laboratory control records that include complete data derived from all laboratory tests conducted to ensure your API and intermediates comply with established specifications and standards.\n\nNot all electronic test results are included in your review to determine conformance of your API products.\n\nYour laboratory analysts routinely conducted unexplained injections in high-performance liquid chromatography (HPLC) and ultra-performance liquid chromatography (UPLC) without adequate documentation or supervision to ensure that product samples were not being tested. Your laboratory used Empower and TotalChrom software for chromatographic data processing and analysis. Your laboratory analysts performed thousands of unexplained injections using Empower over the last 30 months, and over 70 trial injections using TotalChrom in October 2025 alone. The injections that utilized the Emp","a":false,"b":true,"h":[[206,311]],"id":114},{"y":2026,"k":0,"fac":"Shimoga Chemicals","fei":"3033881432","date":"2026-07-13","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/shimoga-chemicals-727904-07132026","t":"clomiphene citrate USP batch CC/005/24-25 had an unreported injection with an out-of-specification (OOS) assay result of (b)(4) % (specification: (b)(4) %); however, the reported injection result of (b)(4) % was documented in the batch record. Additionally, because your firm lacked procedures for electronic data review and your quality unit (QU) did not review the electronic data, this batch was subsequently released and distributed to the U.S. market.\n\nWithout reliable analytical data, there is no assurance that distributed API batches meet identity, strength, quality, or purity specifications.\n\nYour response is inadequate. In your response, you acknowledge undocumented trial injections, unreported analytical data, discarded printouts, and inadequate review of electronic laboratory records. You also commit to a retrospective review of all U.S. batches, including electronic data and docu","a":true,"b":true,"h":[[258,455]],"id":224},{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"processed in the chromatographic system. For example, electronic records stored in a folder titled \" (b)(4) \" indicate that approximately (b)(4) sample injections were performed. However, results were generated only for approximately (b)(4) injections. Your firm lacked evidence to demonstrate your laboratory manager and quality unit (QU) reviewed the raw data for these injections. Furthermore, HPLC audit trails revealed the (b)(4) suppositories batch # (b)(4) three-month stability sample was injected on September 25, 2023, but results were neither processed in your HPLC system nor documented in your laboratory notebook. In addition, the (b)(4) suppositories batch # (b)(4) 24-month stability sample was initially injected on April 29, 2025, with no reported results, then re-injected later that same day, with passing results subsequently reported.\n\nAll laboratory records must be complete, a","a":true,"b":true,"h":[[253,382]],"id":569},{"y":2025,"k":1,"fac":"TAILSTORM HEALTH INC","fei":"3022483154","date":"2025-11-14","n":2,"cfr":"","url":"https://www.fda.gov/media/190200/download","t":"Laboratory records ai·e deficient in that they do not include a complete record of all data obtained during testing. Specifically, Your firm does not have an established procedure for the review of audit trails to ensure the reliability of your analytical testing data. Your Quality unit did not review audit trails. Your batch record checklist does not include confinnatory documentation that audit trails in your analytical instruments and software were reviewed and evaluated as part of batch release. I Your firm utilizes the[(6) (-4) Paiticle Count {JPC) to test for paiticulate matter for your finished sterile drug products. Since October 2024, your Quality unit released at leastL _ (6) (-4) I batches of bevacizumab (Avastin) pre-filled syringes, tirzapetide pre-filled syringes, and semaglutide pre-filled syrmges.\nFACILITIES AND EQUIPMENT SYSTEM","a":false,"b":false,"h":[[288,315]],"id":3327},{"y":2025,"k":0,"fac":"Persōn & Covey, Inc.","fei":"2011222","date":"2025-09-23","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/person-covey-inc-711191-09232025","t":"disregarded and not investigated by your QU.\n\nThe inspection documented that \"System Administrator\" was the only user type attributable in the (b)(4) Software and laboratory personnel shared a common password for the Windows and (b)(4) software systems. Also, audit trails are not independently reviewed after analysis or at an established frequency; and there is no review of the electronic raw data or printed hard copy data.\n\nIn your response, you indicate that \" There was never a formal procedure for Data Integrity \" and you commit to developing one. Your response is inadequate. Your response did not include an assessment or commitment to determine the extent of documentation deficiencies throughout your firm and impact to the safety, effectiveness, and quality of the drug products you continue to manufacture.\n\nYour quality system does not adequately ensure the accuracy and integrity of ","a":true,"b":true,"h":[[260,349]],"id":773},{"y":2024,"k":0,"fac":"Indoco Remedies Limited","fei":"3005124189","date":"2024-12-16","n":5,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/indoco-remedies-limited-691594-12162024","t":"Your firm failed to establish an adequate quality unit and the responsibilities and procedures applicable to the quality control unit are not in writing and fully followed (21 CFR 211.22(a) and 211.22(d)).\n\nWarning and error messages in the Empower Message Center included in your chromatography data software are not reviewed. For example, during the 20-day period between December 26, 2023, and January 15, 2024, the following error messages were registered in the Empower Message Center: B. Approximately 60 instances of \"User Abort\"","a":false,"b":false,"h":[[207,326]],"id":1335},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"Your firm failed to establish laboratory controls that include scientifically sound and appropriate specifications, standards, sampling plans, and test procedures designed to assure that components, drug product containers, closures, in-process materials, labeling, and drug products conform to appropriate standards of identity, strength, quality, and purity (21 CFR 211.160(b)).\n\nYour firm did not have adequate procedures governing the collection, review, and integration of data generated through electronic systems. For example, your procedures did not require evaluation of electronic data which included reprocessed sample integration, aborted runs, single injection data, and electronic audit trails (when available). Accordingly, your QU failed to review this data. Further, manual integration is performed without a governing procedure.\n\nAdditionally, analysts routinely perform (b)(4) syst","a":false,"b":true,"h":[[534,773]],"id":1760},{"y":2023,"k":1,"fac":"Daizo Corporation","fei":"3008470621","date":"2023-11-06","n":2,"cfr":"","url":"https://www.fda.gov/media/185522/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in master production and control records or other records are instituted only by authorized personnel. Specifically, there are no written procedures to describe the review of audit trails associated with your (b) (4) gas chromatography software used to analyze products manufactured, including for the US market, to ensure this data has not been changed or deleted. According to interviews with the Quality Control personnel, audit trails are not reviewed.","a":false,"b":false,"h":[[522,551]],"id":4312},{"y":2023,"k":1,"fac":"Oishi Koseido Co., Ltd.","fei":"3010166685","date":"2023-09-01","n":2,"cfr":"","url":"https://www.fda.gov/media/185549/download","t":"there we remarks as to the reason why they were deleted. The QC Supervisor noted that when the sequences are deletedprior to the acquisition of data no remark orjustification is required, however these instmctions are not specified in an SOP. I also noted SOP DM4710I used for review of audit trails is not comprehensive and does not include instmctions on how to perform audit trail reviews for the different electronic systems such as Empower, Lab Solutions, and TrapeziumX. e) On 8/29/23, during the walkthrough of your QC laboratory, I observed that the analyst who 4 performed the identity test for raw materialE ) control numberr> (4 ) :repeated the test three times without justification ana approval. I asked the QC Manager Y.T. if she performed reviewed ofaudit trails for the FTIR data and the answer was no. 6 4 f) SOP PZTL9021 , effective 12/24/21 used for the operation off >< > IGPD700 ","a":true,"b":true,"h":[[250,299]],"id":4449},{"y":2023,"k":1,"fac":"Amman Pharmaceutical Industries","fei":"3013501887","date":"2023-08-15","n":3,"cfr":"","url":"https://www.fda.gov/media/185523/download","t":"reviewed electronically within the ChromNav system and not re lated information for the chromatographic run, including unreJJOrted samplt!s, aborted runs, and adequate integration. In addition, SOPQC234 and SOPRD068, \"Operation of,(bf(..f)J PLC System\", does not explain how to specifically review the audit trails within the chromatography system. C. The chromacography data previously processed within the ChromNav system is not retained or reyjewed. The data processed is overwritten when changes are saved by the analyst within the system. and only th (b) (..f) processed result is available and reviewed as art of data review. During the review of the assay results related to the 18-month stab ii ity time point forl(t>f< 4 ) ,---,_......Lot (bfC4 manual integration of the chromatogram for th l(b) C4) sample was conducted. This chromatogram could not be retrieved within the c romatograp 1y s","a":true,"b":true,"h":[[254,314]],"id":5752},{"y":2022,"k":0,"fac":"Green Wave Analytical, LLC","fei":"3016367069","date":"2022-08-19","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/green-wave-analytical-llc-630965-08192022","t":"activated audit trail to record information about each analytical test, such as:\n\n• Type of injection • Date and time • Identity of analyst • Nature of action taken and reason You also stated that data from the HPLC was not securely backed up and you did not review the HPLC audit trail data. In addition, you failed to validate electronic signatures used to approve analytical testing records for release testing of drugs performed from at least January 2020, to September 2021.\n\nYour customers rely on the integrity of your laboratory data to make decisions regarding drug quality. It is important to maintain strict control over electronic data to ensure that all laboratory data is retained and that any additions or modifications of information in your electronic records are authorized and appropriately documented.","a":true,"b":false,"h":[[251,286]],"id":2567}],"CS-LAB-005":[{"y":2026,"k":0,"fac":"SnugZ USA, Inc.","fei":"3009188709","date":"2026-09-28","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/snugz-usa-inc-735284-09282026","t":"further action is needed.\n\nAdditionally, your (b)(4) Microbial Testing SOP allows retesting following an initial failure. Also, your SOP says that if the retest fails, your analysts are to use the (b)(4) , a second microbiological testing instrument. You routinely invalidated failing batch release results from the (b)(4) system and used the passing (b)(4) results to release product to the market without scientific justification. You could not provide any data to support this tiered testing approach or the validation of one method as superior to the other.\n\nIn your response, you commit to implementing an interim requirement to open an OOS investigation for all initial failing results. You also commit to revising your OOS procedure to define when repeat testing, re-injection, re-vialing, etc. are allowed, when Quality Assurance authorization is required, and to require scientific justifica","a":true,"b":true,"h":[[251,431]],"id":6},{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"integrity.\n\nOur investigators also noted multiple high-performance liquid chromatography (HPLC) injections were not adequately processed in the chromatographic system. For example, electronic records stored in a folder titled \" (b)(4) \" indicate that approximately (b)(4) sample injections were performed. However, results were generated only for approximately (b)(4) injections. Your firm lacked evidence to demonstrate your laboratory manager and quality unit (QU) reviewed the raw data for these injections. Furthermore, HPLC audit trails revealed the (b)(4) suppositories batch # (b)(4) three-month stability sample was injected on September 25, 2023, but results were neither processed in your HPLC system nor documented in your laboratory notebook. In addition, the (b)(4) suppositories batch # (b)(4) 24-month stability sample was initially injected on April 29, 2025, with no reported results","a":true,"b":true,"h":[[251,378]],"id":569},{"y":2025,"k":0,"fac":"Aspen Pharmacare Holdings Limited","fei":"3007490529","date":"2025-02-24","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/aspen-pharmacare-holdings-limited-701671-02242025","t":"(b)(4) . The four tests included three failing results and the final passing result. Your operators only reported the passing result.\n\nOn July 25, 2024, two operators performed nine filter integrity tests associated with (b)(4) , bulk batch (b)(4) . The nine tests included five failing results, three aborted tests, and the final passing result. Your operators only reported the passing result.\n\nIn your response, you acknowledge the deficiency and commit to perform a full audit trail review of your production equipment. You also indicate that you are completing the investigations into anomalous filter integrity tests.\n\nYour response is inadequate as you do not provide details of the investigation outcome or explain whether effective corrective actions and preventive actions (CAPAs) have been implemented. Further, you do not provide the scope and time period of the retrospective review to e","a":true,"b":true,"h":[[250,345]],"id":1206},{"y":2024,"k":0,"fac":"Viatris, Inc.","fei":"3010453141","date":"2024-12-19","n":2,"cfr":"21 CFR 211.192","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/viatris-inc-690897-12192024","t":"Your firm failed to thoroughly investigate any unexplained discrepancy or failure of a batch or any of its components to meet any of its specifications, whether or not the batch has already been distributed (21 CFR 211.192).\n\nYour investigations into discrepancies and out-of-specification (OOS) results lacked adequate scientific rationale to support root cause determinations. Specifically,\n\nA. (b)(4) mg tablets, batches (b)(4) and (b)(4) , exhibited OOS and out-of-trend (OOT) results during the dissolution test by high-performance liquid chromatography (HPLC) at the 18-month and 3-month long-term stability timepoints, respectively. The analyst, after consulting their supervisor, aborted the HPLC sample set sequence without providing adequate justification. You also lacked evidence to substantiate the root cause of improper (b)(4) of (b)(4) . B. You invalidated OOT assay results and durin","a":false,"b":true,"h":[[640,765]],"id":1346},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"the laboratory investigation, which was approved by QA, did not discuss why other samples in the same analysis of lots, from the same material, prepared by the same analyst, under the same test conditions, were not affected by such contamination.\n\n2. You aborted hundreds of chromatographic sequences in your QC laboratories between January 2020 to November 2022. Each of the incidents were investigated by the quality control laboratory; however, you lacked adequate trending and CAPA systems to evaluate and identify recurring issues that should be targeted for laboratory improvements.\n\nIn your response, you acknowledge the need to enhance your processes and practices for investigating laboratory deviations, applying CAPAs, and checking their effectiveness. In addition, you acknowledge the current trending procedures lack systematic tools for conducting evaluations and implementing effective","a":true,"b":true,"h":[[251,362]],"id":2143},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYou failed to ensure reliability of data relating to the quality of medicines produced at your facility. Our inspection revealed serious deviations, including but not limited to, inadequate oversight of original CGMP documents, deficient controls over computerized systems, insufficient laboratory investigations, and aborted chromatographic sequences.\n\nSenior facility managers failed to exercise their authority and responsibility to ensure reliable data, leading to severe data integrity deficiencies in your production and laboratory departments. These findings also indicate that your quality assurance function is not exercising its responsibilities, includin","a":false,"b":true,"h":[[553,586]],"id":2140}],"CS-ACC-004":[{"y":2026,"k":0,"fac":"Curia New York, Inc.","fei":"1310298","date":"2026-09-18","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/curia-new-york-inc-728790-09182026","t":"Failure to exercise sufficient controls over computerized systems to prevent unauthorized access or changes to data.\n\nOur investigators observed significant data-integrity violations at your facility involving the sharing of usernames and passwords that are used to gain access to your electronic computerized system for GMP analysis. For example, your electronic computerized system, (b)(4) , interfaces with laboratory equipment (b)(4) and restricts access through individual, unique usernames and passwords. Despite this control, your laboratory analyst used another analyst's login credentials to conduct (b)(4) calibrations and to perform (b)(4) -sample testing.\n\nThe sharing of credentials constitutes a serious violation of data-integrity principles and is inconsistent with GMP requirements. Your quality system failed to detect and prevent repeated occurrences of this practice.\n\nYour respon","a":false,"b":true,"h":[[77,115]],"id":117},{"y":2026,"k":1,"fac":"Shilpa Medicare Limited","fei":"3018694237","date":"2026-05-29","n":4,"cfr":"","url":"https://www.fda.gov/media/195303/download","t":"Production records do not contain complete information relating to the production and control of each batch.\nDATE ISSUED SEE REVERSE 05/29/2026\nOF THIS PAGE\n\nYou failed to document in your batch packing record (BPR # for (b) (4) (b) (4) (b) (4) the total number of rejects (b) (4) collected from the system and checkweigher rejected , and the number of rejects actually (b) (4) (b) (4) displayed from the system and the checkweigher display for reconciliation. In addition, when (b) (4) collected rejects from the checkweigher, you do not perform a physical count of each rejected of (b) (4) for under count and over count. (b) (4) There are no controls in place to prevent unauthorized access to rejected for system and (b) (4) (b) (4) checkweigher. Although these rejected are locked, rejected can be physically removed (b) (4) (b) (4) without unlocking the (b) (4)","a":false,"b":false,"h":[[674,716]],"id":3090},{"y":2026,"k":0,"fac":"Par Health USA, LLC & Endo USA, Inc.","fei":"1818977","date":"2026-04-15","n":1,"cfr":"21 CFR 211.42","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/par-health-usa-llc-endo-usa-inc-722121-04152026","t":"Your firm failed to perform operations within specifically defined areas of adequate size and to have separate or defined areas or such other control systems necessary to prevent contamination or mix-ups in aseptic processing areas (21 CFR 211.42(c)(10)).\n\nInadequate Design of Facility and Equipment\n\nYour firm is a contract manufacturer of sterile injectable drug products produced primarily through aseptic processing including, but not limited to, products for (b)(4) use. (b)(4) of your aseptic processing lines are described as \" (b)(4) restricted access barrier systems.\" However, (b)(4) of these processing lines (b)(4) are not restricted access barrier systems (RABS). They lacked fundamental RABS design elements, such as (b)(4) , that are essential for reducing or eliminating direct gowned personnel intervention into the critical (ISO 5) area during batch manufacturing.\n\n(b)(4) are (b)(","a":false,"b":true,"h":[[632,668]],"id":391},{"y":2025,"k":0,"fac":"Center for Instrumental Analysis of China Pharmaceutical University","fei":"3005037448","date":"2025-01-23","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/center-instrumental-analysis-china-pharmaceutical-university-696906-01232025","t":"limited data after the inspection.\n\nAdditionally, your firm failed to ensure that your computerized systems, such as the computers used to control to the NMR equipment, and to store raw data files or process data, have adequate controls in place to prevent unauthorized access or changes to data. The NMR equipment was also used for academic teaching and research, and it appears that various users shared one login ID with full administrative access.\n\nIn your response, you acknowledge your failure to keep adequa for your (b)(4) software. There were no restrictions on deleting or modifying data for this user role. (b)(4) was used for assay and identity testing of finished thyroid, USP API from March 2021 to November 2021.\n\nOur investigator observed numerous deviations to original peak area results for HPLC assays of finished thyroid, USP API validation lots. There was no documentation of these alterations, but your quality unit personnel stated this may have been due to","a":false,"b":true,"h":[[77,115]],"id":2660},{"y":2021,"k":0,"fac":"Sanitor Corporation","fei":"3005871025","date":"2021-11-29","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/sanitor-corporation-616232-11292021","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour (b)(4) Fourier Transform Infrared (FTIR) Spectroscopy computerized system did not have appropriate controls in place to prevent deletion of raw laboratory data. Specifically, this data is used to create an internal certificate of analysis to release drug components for drug product manufacturing. Further, you did not have appropriate password protection of your software to prevent unauthorized access to data.\n\nIn your response, you stated that you have password-protected the software for the FTIR system and only the chemist has access to the data. You also stated that the FTIR data is backed up (b)(4) to an external hard drive and a copy is printed and included as ","a":false,"b":true,"h":[[611,638]],"id":2804}],"CS-ACC-001":[{"y":2026,"k":0,"fac":"Curia New York, Inc.","fei":"1310298","date":"2026-09-18","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/curia-new-york-inc-728790-09182026","t":"Failure to exercise sufficient controls over computerized systems to prevent unauthorized access or changes to data.\n\nOur investigators observed significant data-integrity violations at your facility involving the sharing of usernames and passwords that are used to gain access to your electronic computerized system for GMP analysis. For example, your electronic computerized system, (b)(4) , interfaces with laboratory equipment (b)(4) and restricts access through individual, unique usernames and passwords. Despite this control, your laboratory analyst used another analyst's login credentials to conduct (b)(4) calibrations and to perform (b)(4) -sample testing.\n\nThe sharing of credentials constitutes a serious violation of data-integrity principles and is inconsistent with GMP requirements. Your quality system failed to detect and prevent repeated occurrences of this practice.\n\nYour respon","a":false,"b":true,"h":[[533,666]],"id":117},{"y":2026,"k":0,"fac":"GC America, Inc.","fei":"1410097","date":"2026-05-14","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gc-america-inc-727602-05142026","t":"previous inspection in 2018. Furthermore, no written procedures for this requirement were available (21 CFR 211.180(e)).\n\nIn your response, you acknowledge you did not exercise appropriate controls to ensure authorized access to electronic records. Also, you commit to removing shared passwords, creating a data integrity policy, and implementing an annual product review procedure.\n\nYour response is inadequate. You do not provide updated procedures and training records to demonstrate you have corrected your data control deficiencies. You also lack product quality assessments.\n\nYour quality system does not adequately ensure the accuracy and integrity of data to support the safety, effectiveness, and quality of the drugs you manufacture. See FDA's guidance document Data Integrity and Compliance with Dru -international-679066-06122024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour stand-alone gas chromatogram (GC) computer system lacked appropriate controls, such as an audit trail and individual log-in access to prevent the deletion of data. For example, investigators found numerous analysis reports, test methods, raw data calibration, and system directories in the GC computer's recycling bin. Additionally, your laboratory personnel used a shared password, located in an unsecured drawer, to access the GC software.\n\nIn your response, you state \"21 CFR 211.68 was not fully understood,\" that you will conduct training, and conduct a retrospective review of deleted files and records. You will also contact the supplier of the software to upgrade, ","a":false,"b":true,"h":[[560,667]],"id":1689},{"y":2024,"k":0,"fac":"Westwood Laboratories LLC","fei":"2020372","date":"2024-04-17","n":3,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/westwood-laboratories-llc-674728-04172024","t":"Your firm failed to establish laboratory controls that include scientifically sound and appropriate specifications, standards, sampling plans, and test procedures designed to assure that components, drug product containers, closures, in-process materials, labeling, and drug products conform to appropriate standards of identity, strength, quality, and purity (21 CFR 211.160(b)).\n\nAppropriate Control over Laboratory\n\nYou failed to exercise appropriate controls over your high-performance liquid chromatography (HPLC) software system, such as requiring employee-specific logins, appropriate assignment of administrative privileges, and ensuring the audit trails are enabled. Furthermore, you could not locate the system's validation documentation during the inspection.\n\nYour response states that the validation documentation is available on your HPLC software system, but that you require the assis","a":false,"b":true,"h":[[423,578]],"id":1775},{"y":2023,"k":0,"fac":"Medgel Private Limited","fei":"3010165392","date":"2023-07-20","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/medgel-private-limited-654085-07202023","t":"laboratory data that would support batch release (e.g., you had destroyed microbiological plates before recording the data).\n\nAppropriate data integrity controls (e.g., your QU failed to adequately restrict access to analytical instruments; you used shared usernames and passwords).\n\nProcedures for review of raw data and audit trails.\n\nIn your response, you state that you revised your procedures with additional instructions for issuing and disposing CGMP documents. You attribute the root cause of the non-contemporaneous documentation to human error and instituted a second person check for microbiological testing and data recording. You also commit to reviewing audit trails and retraining your analysts.\n\nYour response was inadequate because it lacked details on how your QU would oversee the implementation of the CAPAs and check their effectiveness. Furthermore, the CAPAs were specific to t","a":true,"b":true,"h":[[250,266]],"id":2157},{"y":2022,"k":1,"fac":"Cipla Limited","fei":"3004081307","date":"2022-08-26","n":4,"cfr":"","url":"https://www.fda.gov/media/161742/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in master production and control records or other records are instituted only by authorized personnel. lItiH •> I\n1. The Human Machine futerface (HMI) for the filling machines use a shared password, do not have audit trails, and do not allow for the printing or transfer ofelectronic data. Controls have not been establish For example, our inspection documented serious quality assurance (QA) deficiencies, such as discarded original CGMP records found stacked in a bag underneath a vehicle and in a nearby trash can, as well as your production manager's unrestricted access to blank production batch records and other CGMP documents without QA issuance. Your QA department was not exercising its basic responsibilities for the oversight and control over the adequacy and reliability of all CGMP data at your facility. In addi","a":false,"b":true,"h":[[489,520]],"id":1647},{"y":2024,"k":1,"fac":"Jiangsu Hengrui Pharmaceuticals Co., Ltd.","fei":"3007373503","date":"2024-01-16","n":4,"cfr":"","url":"https://www.fda.gov/media/179134/download","t":"The quality control unit lacks responsibility to approve all procedures or specifications impacting on the identity, strength, quality and purity ofdrug products. Specifically, A) The Quality Unit lacks adequate control over the issuance ofcontrolled documents, such as production batch records, validation protocols and reports, change controls, and standard operating procedures. During the walkthrough of our inspection on 01/08/2024, we observed original executed pages of batch records, validation reports, change controls which had been discarded in a waste bin. When lhese original records found in the waste bin were compared to the archived official records, the information, such as production data did not always match. B) The Quality Unit lacks adequate control over the issuance of master production batch records purported to be controlled under your procedures PR-416 titled \"Preparati","a":false,"b":true,"h":[[589,615]],"id":4236},{"y":2023,"k":1,"fac":"Central Admixture Pharmacy Services Inc","fei":"3014307835","date":"2023-07-31","n":1,"cfr":"","url":"https://www.fda.gov/media/173408/download","t":"The responsibilities and procedures applicable to the quality control unit are not in writing and fully followed. Specifically, for example, but not limited to: A.Your Quality Unit failed to: 1.Initiate a Notice of Quality Event (NQE) or conduct an investigation evaluating drug product impact or identify a root cause. For example, but not limited to: i.Your firm's Director of Pharmacy was aware of at least 27 instances of data integrity concerns identified at your firm from May 25, 2023 - June 15, 2023, by your thirdparty consultants. For example, but not limited to, shredding of GMP documents, lack of contemporaneous record keeping, and back-dating. B.Your Quality Unit failed to ensure comprehensive procedures for quality review of audit trails and electronic data review have not been established. - For example, but not limited to, your firm's Supervising Chemist, stated Rocuronium is c","a":false,"b":true,"h":[[574,600]],"id":4479},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"An analyst weighed out the same samples of amitriptyline hydrochloride tablets USP 100 mg batches multiple times for (b)(4) by (b)(4) test. The analyst stated to our investigator that he did not report all the test results, further stating that in some instances balance printouts were discarded in the trash. In addition, the time stamp on each of the analytical balance and (b)(4) printouts did not match your Laboratory Information Management System (LIMS) records.\n\nIn your response, you commit to working with a qualified consultant to perform an overall baseline assessment of data integrity and governance controls, and to establish a remediation plan.\n\nYour response is inadequate in that it did not fully evaluate the scope of this deficiency and the impact to product quality. You did not adequately address the major failure of laboratory, operations, and quality assurance management to c","a":false,"b":true,"h":[[271,308]],"id":2142},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"oversight and control over the adequacy and reliability of CGMP data used throughout your operation. A. You failed to assure integrity of analytical testing data. Some examples include:\n\n1. Our investigators observed plastic bags filled with torn and discarded original CGMP documents in your quality control (QC) scrap area under a stairwell, in your general parenteral scrap room, and on a truck outside your facility. Among these CGMP documents were engineering checklists associated with the Environmental Monitoring System (EMS), torn Karl Fischer (KF) analytical test reports, auto titration curves, and analytical balance weight slips for finished drug products.","a":true,"b":false,"h":[[251,284]],"id":2140},{"y":2022,"k":0,"fac":"Centrient Pharmaceuticals India Private Limited","fei":"3004497364","date":"2022-12-07","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/centrient-pharmaceuticals-india-private-limited-640196-12072022","t":"Failure of your quality unit to exercise its responsibility to ensure the API manufactured at your facility are in compliance with CGMP.\n\nYour quality unit (QU) failed to ensure adequate document control over paper and electronic records. For example, our investigators observed numerous logbooks, forms, and partially completed \"Sample Request For Analysis (Other Than SAP)\" in an uncontrolled temporary storage room near your microbiology laboratory. Our investigators also observed in your document center, a document shredder labeled for \"emergency use\" containing shredded documents. Your document control personnel were unable to identify the documents in the shredder that were observed to contain information for relative humidity, temperature, and data recorded in writing.\n\nYou also failed to have adequate controls for your computerized systems. For example, multiple usernames and passwor","a":false,"b":true,"h":[[649,674]],"id":2467},{"y":2022,"k":1,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2022-12-02","n":3,"cfr":"","url":"https://www.fda.gov/media/164602/download","t":"The responsibilities and procedures applicable to the quality control unit are not fully followed. Specifically, There is a cascade of failure in your Quality Unit's lack of oversight on the control and management of GMP documents that are critical in ensuring the drng products manufactured and tested at your site are safe and effective. For example, I.On 22-Nov-2022, we observed your Quality Control (QC) Laboratory, Production and Engineering department employees destroyed GMP documents periaining to original records and raw data by tearing it into pieces and disposed inside your QC laboratory and General Parenteral Scrap areas. These areas suppori the manufacturing and testing activities for the drng products sold in the USA market. Additionally, we found a trnck full of transparent plastic bags containing shredded documents and black plastic bags mostly containing documents tom random","a":false,"b":true,"h":[[469,523]],"id":4736}],"CS-LAB-001":[{"y":2026,"k":0,"fac":"Curia New York, Inc.","fei":"1310298","date":"2026-09-18","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/curia-new-york-inc-728790-09182026","t":"Failure to have laboratory control records that include complete data derived from all laboratory tests conducted to ensure your API and intermediates comply with established specifications and standards.\n\nNot all electronic test results are included in your review to determine conformance of your API products.\n\nYour laboratory analysts routinely conducted unexplained injections in high-performance liquid chromatography (HPLC) and ultra-performance liquid chromatography (UPLC) without adequate documentation or supervision to ensure that product samples were not being tested. Your laboratory used Empower and TotalChrom software for chromatographic data processing and analysis. Your laboratory analysts performed thousands of unexplained injections using Empower over the last 30 months, and over 70 trial injections using TotalChrom in October 2025 alone. The injections that utilized the Emp","a":false,"b":true,"h":[[314,580]],"id":114},{"y":2026,"k":0,"fac":"Shimoga Chemicals","fei":"3033881432","date":"2026-07-13","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/shimoga-chemicals-727904-07132026","t":"from the foundational 2015 study or your failure to place commercial batches on stability annually, as required by your own procedure.\n\nCGMP Training Concerns\n\nYour QU failed to ensure that manufacturing personnel were adequately trained. For example, an analyst who performed unreported injections lacked documented laboratory training and CGMP training. Additionally, no training records were available for a production operator who performed (b)(4) operations on a batch in U.S. distribution.\n\nUsing untrained personnel may create a systemic risk, potentially resulting in quality failures.\n\nYour response is inadequate. You acknowledge the use of untrained or insufficiently trained personnel, but you provide only a general commitment to retraining. This commitment lacks a specific, documented training matrix, a training schedule, or qualification criteria for affected personnel.\n\nIn response","a":true,"b":true,"h":[[252,354]],"id":226},{"y":2026,"k":0,"fac":"Shimoga Chemicals","fei":"3033881432","date":"2026-07-13","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/shimoga-chemicals-727904-07132026","t":"Failure to ensure that all specifications, sampling plans, test procedures are scientifically sound and appropriate to ensure that your API conform to established standards of quality and purity.\n\nYour firm manufactures the API, clomiphene citrate USP for U.S. distribution, intended for pharmacy compounding.\n\nData Integrity Concerns\n\nYour firm failed to establish adequate controls over analytical testing data. Multiple instances of unreported sample injections for related substances and assay testing by high performance liquid chromatography (HPLC) were not documented in laboratory batch records. For example, clomiphene citrate USP batch CC/005/24-25 had an unreported injection with an out-of-specification (OOS) assay result of (b)(4) % (specification: (b)(4) %); however, the reported injection result of (b)(4) % was documented in the batch record. Additionally, because your firm lacked ","a":false,"b":true,"h":[[414,602]],"id":224},{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"Furthermore, HPLC audit trails revealed the (b)(4) suppositories batch # (b)(4) three-month stability sample was injected on September 25, 2023, but results were neither processed in your HPLC system nor documented in your laboratory notebook. In addition, the (b)(4) suppositories batch # (b)(4) 24-month stability sample was initially injected on April 29, 2025, with no reported results, then re-injected later that same day, with passing results subsequently reported.\n\nAll laboratory records must be complete, accurate and contemporaneously documented to ensure processes are consistently followed and reproducible. Additionally, incomplete laboratory records deprive you of the ability to adequately investigate deviations.\n\nInadequate electronic records controls\n\nYour firm did not have proper controls in place to prevent the deletion or manipulation of your laboratory's electronic data. For","a":true,"b":true,"h":[[257,471]],"id":569},{"y":2025,"k":1,"fac":"RC Outsourcing LLC","fei":"3011967886","date":"2025-08-28","n":7,"cfr":"","url":"https://www.fda.gov/media/188813/download","t":"spoke to, each performed this verification in a manner that was not consistent with Wl-16 Calibration and O12eration of a Precision Balance, version 1.0 effective 2024-10-28. In addition, the verification performed when making the Lidocaine 2% Solution injection is not documented. No other calibration of the balances is performed.","a":true,"b":false,"h":[[253,280]],"id":3467},{"y":2025,"k":1,"fac":"Fujifilm Diosynth Biotechnologies Texas, LLC","fei":"3011948449","date":"2025-03-11","n":6,"cfr":"","url":"https://www.fda.gov/media/192222/download","t":"~..§.tern audit trails to identify and address any aberrant trends associated with user-aborted L Cb><j sequences/injections/sample-sets events. Specifically, your firm's dataset auaiftrai1•-r-e-v,-e-w..s. failed to include in-process tIe sting_r~sults and \"Trial Injections\" datasets. 41 rS ystem audit trail reviews are only performed Cb>< In addition, user privilege settings in Cb>14'allow your QC analysts to pertmm-oarcn processing or manual processing 'tor unsaved,~data that they are working with in the Review window before the peak integration is completed and finalized .","a":true,"b":false,"h":[[258,274]],"id":5733},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"reprocessed sample integration, aborted runs, single injection data, and electronic audit trails (when available). Accordingly, your QU failed to review this data. Further, manual integration is performed without a governing procedure.\n\nAdditionally, analysts routinely perform (b)(4) system suitability injections of samples which does not comply with existing analytical method standard operating procedures (SOPs). Further, HPLC test method TE3-020-01 for (b)(4) drug product does not define system suitability acceptance criteria for repeatability, peak tailing, and resolution.\n\nLaboratories must establish and implement procedures to ensure the robustness and consistency of testing and data review.","a":true,"b":false,"h":[[251,416]],"id":1760},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records did not include all testing data to support the drug product analysis performed.\n\nOut-of-Specification (OOS) Results Not Reviewed\n\nYour quality unit (QU) only reviews printed analytical results. During the inspection, our investigator found unprocessed and unreported high-performance liquid chromatography (HPLC) sample injections for several batches of (b)(4) drug product, which is marketed in the United States. When your firm subsequently processed the drug product sample injections after their discovery by the investigator, the injections were determined to be OOS for ingredient (b)(4) assay. The printed data for these batches, reviewed by your QU, failed to include the","a":false,"b":true,"h":[[455,571]],"id":1759},{"y":2023,"k":1,"fac":"Alvotech Hf","fei":"3013702557","date":"2023-03-17","n":1,"cfr":"","url":"https://www.fda.gov/media/167493/download","t":"review of such cases, the interrupted sample injections were not adequately documented to be performed in your invalid assay reports and/or master laboratory records (data packages), and evaluations were not performed to determine whether the interrupted test injections were within specification or out of specification, where applicable. Additionally, your firm has not demonstrated to understand the different types of communication errors and circumstances which may lead to a \"Data incomplete\" or \"Bad Checksum\" chromatography. This discrepancy in your firm's ability to review, document, and investigate all electronic data is a gap in your firm's Data Integrity Program.\n2. Once logging to the computer's Windows operation system, every analyst can access all the original electronic test data generated from standalone laboratory equipment systems, including those generated by other analysts","a":true,"b":true,"h":[[255,270]],"id":4624}],"CS-ACC-002":[{"y":2026,"k":0,"fac":"Curia New York, Inc.","fei":"1310298","date":"2026-09-18","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/curia-new-york-inc-728790-09182026","t":"and TotalChrom software for chromatographic data processing and analysis. Your laboratory analysts performed thousands of unexplained injections using Empower over the last 30 months, and over 70 trial injections using TotalChrom in October 2025 alone. The injections that utilized the Empower software used the \"Developer\" role rather than the \"Operator\" role without appropriate documentation. For example: A. Our investigators found chromatograms for testing that was performed on January 14, 2026, on chromatography equipment HPLC 49, which showed four unexplained trial injections that were injected under the \"Developer\" role. Your analyst confirmed these trial injections could not be traced to any product, sample, or analysis. In your response you attributed the injections to the testing of (b)(4) swab samples. Pages from the associated laboratory notebook 830-7 contained no reference to ","a":true,"b":true,"h":[[253,394]],"id":114},{"y":2026,"k":0,"fac":"Ava Inc.","fei":"3008736380","date":"2026-04-14","n":1,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ava-inc-721180-04142026","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour firm lacked adequate system security and access controls over your laboratory equipment used to test drug products prior to release. For example, your firm utilized a common username and password to access high performance liquid chromatography (HPLC) equipment used for impurity testing of drug products. Additionally, analysts had administrator privileges to modify and delete data. Our investigators also found multiple deleted gas chromatography (GC) analytical sequences in the recycle bin, including sequences used for system suitability and stability analysis.\n\nIn your response, you state your employee violated your procedure and training by deleting sequence file","a":false,"b":true,"h":[[547,610]],"id":367},{"y":2025,"k":1,"fac":"F.H. Investments Inc dba Asteria Health","fei":"3038253438","date":"2025-12-19","n":9,"cfr":"","url":"https://www.fda.gov/media/191003/download","t":"Appropriate conti·ols are not exercised over computers or related systems to assure that changes in master production and conti·ol records or other records are instituted only by authorized personnel. Specifically, During this inspection, FDA investigators observed multiple data governance and document conti·ol deficiencies affecting the reliability and integrity of data used for batch release decisions: A. Unrestricted analytical system access where your lab manager logged into the b) (4 ) I chromatography system on December 4, 2025, without user login credentials and operated under \"Admin\" user profile with unrestricted access to audit ti·ails, methods, and sequences deletions. Sequence repoits since May 2025 show all potency testing for batch release was performed under \"admin\" accounts, compromising data integrity for critical quality decisions. B. Inadequate batch record and documen","a":false,"b":true,"h":[[599,636]],"id":3252},{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"records deprive you of the ability to adequately investigate deviations.\n\nInadequate electronic records controls\n\nYour firm did not have proper controls in place to prevent the deletion or manipulation of your laboratory's electronic data. For example, your analysts had administrative rights on your chromatographic systems that allowed them to alter and delete data, files, and folders, including your spreadsheet used for assay calculations. In addition, during a review of system audit trails, our investigator observed multiple \"deleted system\" and \"deleted project\" errors with no assessment report completed as required by your procedure. Deficiencies in your electronic data security controls were identified and discussed during previous FDA inspections, yet your firm has failed to implement adequate corrective measures. The lack of proper electronic records controls undermines the reliab","a":true,"b":true,"h":[[253,387]],"id":569},{"y":2025,"k":0,"fac":"CDL Services, Inc. DBA Technichem","fei":"3012112742","date":"2025-11-24","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/cdl-services-inc-dba-technichem-713877-11242025","t":"ensure the following:\n\nEstablishment of adequate procedures describing the roles and responsibilities of the QU, including review of complaints, supplier qualification, change control and periodic product quality review (21 CFR 211.22(a) and 211.22(d)).\n\nEstablishment of appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records or other records (21 CFR 211.68(b)).\n\nEstablishment of adequate production procedures and process control to assure your drug products have the identity, strength, quality, and purity they purport or are represented to possess (21 CFR 211.100(a)).\n\nDrug products bear expiration dates that are supported by appropriate stability testing (21 CFR 211.137(a)).\n\nEstablishment of adequate batch production and control records that contain the accomplishment of each significant ","a":true,"b":true,"h":[[255,461]],"id":603},{"y":2024,"k":0,"fac":"Unexo Lifesciences, Private Limited","fei":"3013514280","date":"2024-11-06","n":1,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unexo-lifesciences-private-limited-688163-11062024","t":"integrity principles. C. Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)). For example, your QC analyst had the ability to manipulate results, dates, and images of in-house and vendor stamp approvals on component certificate of analyses (COAs) from third-party contract laboratories, including the means to duplicate the stamp approval across multiple COAs for components, such as (b)(4) , lot (b)(4) , lot (b)(4) .\n\nIn your response, you explain the analyst involved with access to unauthorized test data was removed from regular duties, however, your response is inadequate because it does not explain in detail how appropriate controls will be implemented for maintaining data integrity and defining user privileges for comput","a":true,"b":true,"h":[[259,414]],"id":1404},{"y":2024,"k":0,"fac":"Outin Futures Corp.","fei":"3011572099","date":"2024-09-25","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/outin-futures-corp-684688-09252024","t":"Specifically, electronic raw data used for release testing of batches (e.g., (b)(4) ) currently in the U.S. market was deleted and not accessible. Your firm did not adequately maintain backups of data generated by your laboratory equipment. In addition, your analysts had administrative rights for the chromatography data system capable of changing and deleting files and disabled audit trails for some of your chromatographic systems.\n\nIn your response, you state that you removed administrative rights for your analysts, enabled audit trails feature on for your chromatographic system, implemented a data backup schedule, and retested drug product batches that had missing electronic data.\n\nYour response is inadequate. You failed to include a comprehensive review of all laboratory instruments.\n\nIn response to this letter, provide:\n\nA comprehensive, independent assessment of computer system perf","a":true,"b":true,"h":[[254,367]],"id":1474},{"y":2024,"k":0,"fac":"MMC Healthcare Ltd.","fei":"3014773352","date":"2024-09-24","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mmc-healthcare-ltd-684644-09242024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour ultraviolet-visible (UV-Vis) spectrophotometer computer system lacked appropriate controls to assure the integrity of electronic test data, such as an audit trail and defined user access levels. This UV-Vis system was used for release testing of drug product batches.\n\nIn your response, you state that you \"would like to update the UV/Vis [sic] software\" to be compliant and provide a quote for new software.\n\nYour response is inadequate because it does not provide sufficient details describing:\n\n• Timeframe for your corrective action. • Security features of your updated UV-Vis computer system. • User access levels, access privileges, or authorized users to perform the","a":false,"b":true,"h":[[290,420]],"id":1485},{"y":2023,"k":0,"fac":"Lex Inc.","fei":"1031041","date":"2023-08-17","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/lex-inc-656056-08172023","t":"completion, and a risk assessment for the drug products you produced using unqualified equipment.\n\nLaboratory equipment used to generate analytical data for finished drug product release lacked restricted access and sufficient controls. For example, some laboratory staff had administrator rights allowing uncontrolled access to delete or modify high performance liquid chromatography (HPLC) files. You had no mechanism to facilitate traceability of individuals who deleted or modified data generated by computerized systems. Furthermore, your firm did not adequately maintain backups of data generated by your laboratory equipment.\n\nIn your response, you acknowledge your lack of knowledge regarding the use of the HPLC software.\n\nYour response is inadequate. Your response does not provide adequate details of required improvements and expertise (e.g., management oversight, competencies) to assure","a":true,"b":true,"h":[[250,397]],"id":2093},{"y":2022,"k":0,"fac":"Nortec Quimica SA","fei":"3007616930","date":"2022-12-08","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/nortec-quimica-sa-639894-12082022","t":"all equipment, both standalone and network, in your laboratory. o Identification of vulnerabilities in hardware, software, and non-networked systems (e.g., PLC). o A list of all software configurations (both equipment software and LIMS), details of all user privileges up to an including administrator rights, and oversight roles for each of your laboratory systems. Regarding user privileges, specify user roles and associated user privileges (including the specific permissions allowed for those with administrative privileges) for all staff levels who have access to the laboratory computer systems, and their organizational affiliation and title. o System security provisions, including but not limited to, whether unique usernames/passwords are always used, and their confidentiality safeguarded. o A detailed summary of your procedural updates and associated training for user role assignment a","a":true,"b":true,"h":[[253,308]],"id":2458},{"y":2021,"k":0,"fac":"Adamson Analytical Laboratories, Inc.","fei":"3000204955","date":"2021-08-17","n":1,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/adamson-analytical-laboratories-inc-614644-08172021","t":"privileges which you state have been corrected for all analysts and applicable operating software for electronic laboratory equipment.\n\n• A list of all software configurations (both equipment software and laboratory information system (LIMS)), details of all user privileges up to and including administrator rights, and oversight roles for each of your laboratory systems. Regarding user privileges, specify user roles and associated user privileges for all staff levels who have access to the laboratory computer systems and their organizational affiliation and title. Describe in detail how you will ensure that administrative privileges are fully segregated and completely independent of QU laboratory personnel.\n\n• Your action plan, with timelines, describing your interim controls and when audit trails will be enabled for all applicable laboratory instruments and electronic data systems, as w","a":true,"b":true,"h":[[259,315]],"id":2822}],"CS-EDC-006":[{"y":2026,"k":0,"fac":"SCA Pharmaceuticals, LLC","fei":null,"date":"2026-09-14","n":6,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/sca-pharmaceuticals-llc-724202-09142026","t":"critical area during the production of Ketamine HCl 10 mg/mL lot 1125035065, your Quality Unit evaluated the production video recording as part of excursion investigation EXC-2025-0045 to examine aseptic practices for potential root causes. However, instead of retaining the video recording as a quality related document, you only retained still images. Your Chief Quality Officer stated that video recordings are kept for approximately (b)(4) before being overwritten.\n\nOutsourcing facilities must comply with CGMP requirements under section 501(a)(2)(B) of the FDCA. FDA's regulations regarding CGMP requirements for the preparation of drug products have been established in 21 CFR parts 210 and 211. FDA intends to promulgate more specific CGMP regulations for outsourcing facilities. FDA has issued a revised draft guidance, Current Good Manufacturing Practice - Guidance for Human Drug Compoundi","a":true,"b":true,"h":[[250,468]],"id":83},{"y":2026,"k":0,"fac":"Shimoga Chemicals","fei":"3033881432","date":"2026-07-13","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/shimoga-chemicals-727904-07132026","t":"do not provide a commitment to conduct any formal OOS investigation for batch CC/005/24-25.\n\nStability Program Deficiencies\n\nYour QU failed to ensure that stability data adequately supports the assigned (b)(4) expiry date for clomiphene citrate USP. Your firm lacked raw test data, electronic or hardcopy, to support the results of your long-term stability study. In addition, while your stability management procedure requires that at least one commercial batch be placed on stability annually, your firm only placed batches on stability in 2021, 2022, and 2023. Your firm failed to place any U.S. batches manufactured in 2025 and 2026 on stability. Further, stability samples were stored in packaging that differed from the commercial container-closure system. This packaging has not been evaluated for equivalence.\n\nWithout complete stability data, there is no assurance that the API will maintain","a":true,"b":true,"h":[[250,362]],"id":226},{"y":2025,"k":0,"fac":"Somerset Therapeutics Private Limited","fei":"3003821988","date":"2025-09-04","n":1,"cfr":"21 CFR 211.192","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/somerset-therapeutics-private-limited-711340-09042025","t":"environmental monitoring and ensure a timely and appropriate investigation of numerous aborted air sampler events. During the inspection, we identified at least 16 aborted air samples collected over (b)(4) in February 2025, within the (b)(4) areas and corridors. The review of aborted air sampler data was limited by its unacceptable data retention capability of only 115 entries.\n\nYour response is inadequate. You state that the \" (b)(4) \" of the (b)(4) organisms used to validate your (b)(4) sterilization cycle is greater than the \" (b)(4) \" of the B. cereus organisms identified in the contaminated media. Although B. cereus is typically known to exhibit less (b)(4) than (b)(4) , B. cereus is also known to have a relatively wide range of (b)(4) , with some strains exhibiting significant (b)(4) . 1 Your response did not indicate plans to evaluate the susceptibility of specific contaminating o","a":true,"b":true,"h":[[263,379]],"id":793},{"y":2025,"k":0,"fac":"International Laboratories Corp","fei":"3006403166","date":"2025-03-10","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/international-laboratories-corp-698522-03102025","t":"numerous examples of deleted electronic raw data files. Additionally, your analysts had administrative rights capable of altering and deleting data, files, and folders on your chromatographic systems, including the date and time of tests.\n\nWe also note that you did not ensure retention of complete electronic raw data for all laboratory instrumentation and equipment. For example, our investigators documented several electronic data results that were not available for review.\n\nIn your response, you acknowledge the lack of document control and state that you have initiated change controls to reduce DI gaps identified during the inspection. Your response is inadequate because you failed to include a comprehensive review of each piece of equipment and the impact of the significant adverse pattern of data that has been discarded or lost. Your impact assessment commitment is also limited to mis","a":true,"b":true,"h":[[258,477]],"id":1202},{"y":2025,"k":0,"fac":"Center for Instrumental Analysis of China Pharmaceutical University","fei":"3005037448","date":"2025-01-23","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/center-instrumental-analysis-china-pharmaceutical-university-696906-01232025","t":"laboratory records were readily available during the inspection. You informed our investigators that your (b)(4) 1 H NMR testing data before November 2023 were stored on external hard drives. However, when our investigators requested to review this data, you stated that it might be difficult to locate the data because there were many archived hard drives and only the archiving personnel could retrieve the data. As a result, you did not provide any CGMP data stored on the external hard drives for review during the inspection. We acknowledge that you provided limited data after the inspection.\n\nAdditionally, your firm failed to ensure that your computerized systems, such as the computers used to control to the NMR equipment, and to store raw data files or process data, have adequate controls in place to prevent unauthorized access or changes to data. The NMR equipment was also used for aca","a":true,"b":true,"h":[[255,413]],"id":1258},{"y":2024,"k":0,"fac":"Bell International Laboratories, Inc.","fei":"3005574978","date":"2024-02-15","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/bell-international-laboratories-inc-669736-02152024","t":"Your firm failed to establish an adequate quality unit and the responsibilities and procedures applicable to the quality control unit are not in writing and fully followed (21 CFR 211.22(a) and (d)). Your quality unit (QU) lacked adequate control over your over-the-counter (OTC) drug manufacturing operations and failed to ensure that you had adequate procedures. For example, your QU failed to ensure:\n\nAdequate investigations into non-conformances (21 CFR 211.192).\n\nAdequate investigations into complaints (21 CFR 211.198(a)).\n\nAdequate system for document control and retention (e.g., missing, or incomplete batch records, missing testing records and out-of-specification (OOS) investigations) (21 CFR 211.188).\n\nIn your response, you acknowledge that you did not follow your investigation procedures and that many of your investigations were incomplete. You note that you revised your procedure","a":false,"b":true,"h":[[532,698]],"id":1880},{"y":2024,"k":0,"fac":"Sichuan Deebio Pharmaceutical Co. Ltd.","fei":"3011139911","date":"2024-02-05","n":2,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/sichuan-deebio-pharmaceutical-co-ltd-669808-02052024","t":"Failure of your quality unit to exercise its responsibility to ensure the API and intermediates manufactured at your facility are in compliance with CGMP.\n\nYour firm's quality unit (QU) failed to perform routine QU functions to ensure (b)(4) , USP API manufacturing operations were adequate. For example, your QU failed to:\n\nConfirm deviations in testing methods were investigated and resolved.\n\nEnsure adequate document control and retention of printouts and electronic records for all (b)(4) , USP API testing.\n\nExtend product quality complaint investigations to other batches or APIs potentially associated with the root cause, failure, or deviation.\n\nIn your response, you acknowledge deficiencies in your investigations and document control. You commit to process improvements, retraining personnel, and adding third-party oversight.\n\nYour response is inadequate as you fail to perform a suffici","a":false,"b":true,"h":[[396,511]],"id":1904},{"y":2023,"k":0,"fac":"Medgel Private Limited","fei":"3010165392","date":"2023-07-20","n":1,"cfr":"21 CFR 211.192","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/medgel-private-limited-654085-07202023","t":"comprehensive scope.\n\nInadequate investigation of humidity excursions\n\nYou did not adequately investigate several humidity excursions beyond your specification limits during the production of your drug products as well as in your stability chambers. Furthermore, our investigators could not review portions of humidity data between December 2022, and January 2023, because the raw data is not backed up and deleted every month. High levels of humidity can impact the properties of (b)(4) capsules and make them vulnerable to undesirable microbiological contamination.\n\nIn your response, you attribute the humidity excursions to a defective dehumidifier but do not provide information on the steps taken to ensure that your dehumidifier and the overall conditions at your facility are maintained optimally. You also state that you reviewed your humidity monitoring data from January to December 2022, ","a":true,"b":true,"h":[[263,426]],"id":2156}],"CS-LAB-003":[{"y":2026,"k":0,"
