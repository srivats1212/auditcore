O WHOM J1E","a":false,"b":true,"h":[[31,57]],"id":5368}],"CS-P11-004":[{"y":2026,"k":0,"fac":"Fareva Morton Grove","fei":"1410794","date":"2026-03-03","n":3,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/fareva-morton-grove-719408-03032026","t":"laboratory revealed a plate that had been counted and found to contain 20 CFUs. However, your firm had discarded the plate without recording the microbial levels.\n\nYou were also unable to provide complete (b)(4) microbial sampling results from the (b)(4) . Results existed in mixed formats (for example, paper-based and electronic entries), with some data missing.\n\nCollectively, these deficiencies indicate a significant risk of systematic underreporting of microbial findings.\n\nReliability of data is fundamentally compromised when there is a failure to record data or to maintain complete and accurate records of test results. Furthermore, the lack of reliable data compromises the ability of your quality unit (QU) to exercise its function of ensuring compliance to applicable standards.\n\nIn your response, you commit to retraining your microbiology staff to require microorganism identification,","a":true,"b":true,"h":[[257,363]],"id":461},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records did not include all testing data to support the drug product analysis performed.\n\nOut-of-Specification (OOS) Results Not Reviewed\n\nYour quality unit (QU) only reviews printed analytical results. During the inspection, our investigator found unprocessed and unreported high-performance liquid chromatography (HPLC) sample injections for several batches of (b)(4) drug product, which is marketed in the United States. When your firm subsequently processed the drug product sample injections after their discovery by the investigator, the injections were determined to be OOS for ingredient (b)(4) assay. The printed data for these batches, reviewed by your QU, failed to include the","a":false,"b":true,"h":[[351,413]],"id":1759},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"ensure integrity of all data related to manufacturing and quality. B. Laboratory raw data was missing and could not be provided during the inspection. For example, analysts did not consistently include (b)(4) printout raw data in laboratory records. Paper printouts for the (b)(4) determinations and pH printouts could not be reconciled for (b)(4) injection, (b)(4) mg, process validation batch (b)(4) .\n\nBecause the (b)(4) instrument lacked audit trail capabilities, unreported raw data could not be detected during the QA review process.\n\nFailing to maintain complete records of the data and testing conditions associated with all tests significantly compromises the reliability of data and your QA's ability to perform its obligation to assure quality through conformance with CGMP.\n\nIn your response, you acknowledge EM samples are not counted accurately and that \"laboratory practice was to coun","a":true,"b":true,"h":[[250,401]],"id":2145}],"CS-EDC-002":[{"y":2026,"k":0,"fac":"A. Nelson & Co. Ltd.","fei":"1000568184","date":"2026-02-12","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/nelson-co-ltd-720283-02122026","t":"Notably, a handwritten sticky note indicating an \"out-of-trend\" result with a quality determination was discovered among the discarded materials, yet this deviation was neither properly documented at the time of performance nor adequately investigated.\n\nYou printed duplicate copies of records without an adequate procedure for the QU to track the issuance and reconciliation of CGMP documents. Furthermore, numerous analytical forms with unacceptable results were discarded that should have triggered investigations. These deficiencies raise significant data integrity concerns as critical quality records were improperly discarded.\n\nIn your response, you state that you completed the data integrity investigation with appropriate corrective action and preventive action (CAPA). You also state that following implementation of your CAPA, you will engage an external quality consultant to perform a s","a":true,"b":true,"h":[[254,393]],"id":474},{"y":2026,"k":1,"fac":"US Specialty Formulations LLC","fei":"3010680515","date":"2026-01-14","n":1,"cfr":"","url":"https://www.fda.gov/media/190899/download","t":"approximately b) (4 vials were relabeled for Sarracenia Purpurea 0.17 g/mL for Injection (Lot# 02RT1501A; Exp. 2/28/2026). However, there is no QA approval for the relabeling activity, no documented relabeling procedure, no reconciliation of removed labels, and no reconciliation of new labels printed and applied with the correct expiration date. This represents a repeat observation from previous inspections, indicating that USSF has not implemented adequate corrective actions to address fundamental quality control deficiencies.","a":true,"b":false,"h":[[262,301]],"id":3238},{"y":2025,"k":0,"fac":"Chemspec Chemicals Private Limited","fei":"3004947391","date":"2025-12-23","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/chemspec-chemicals-private-limited-718403-12232025","t":"procedures requiring an investigation when you replaced these documents. You stated your procedures will be updated to require original document retention and documented deviation investigations for all replacements.\n\nYour response is inadequate. You do not sufficiently address and reconcile all missing batch records. You do not provide results of any comprehensive retrospective evaluation, nor do you provide any testing data and release documentation.\n\nYou do not provide a plan or procedures to holistically improve your document lifecycle controls, issuance traceability, and quality unit release processes. You do not provide results from comprehensively investigating past incidents of non-contemporaneous documentation, nor have you reconciled existing batch manufacturing records for completeness and release by the quality unit.\n\nYou do not perform a comprehensive retrospective review of","a":true,"b":true,"h":[[254,318]],"id":5601},{"y":2025,"k":1,"fac":"Simtra BioPharma Solutions","fei":"3002806419","date":"2025-09-26","n":10,"cfr":"","url":"https://www.fda.gov/media/190881/download","t":"for the Cb><4 integrity testing device in pharma production suite~~ dming the production of <bX4 > batch noJ <bX4 > !. was observed discarded into the destmction box. A copy was reprinted, dated: August 04, 2025, by the quality unit representative and no reconciliation of the original document was performed.\n3. Original copies ofcleaning qualification protocol ofj (b) (4) Iin l (b)<4> lroomCb><4 enclosure 02 and enclosure 03, with data completed and was observed discarded in the destmction box with no quality review or reconciliation.\n4. Partially completed microbiological analysis form, performed on September 04, 2025, for recovering of objectionable organisms and personnel monitoring with results were observed 1ipped and discarded in the document destmction box-r --ct>x4> Istored in room r<bX4>1 . Toe document was reprinted, and the data was t:ransfened with no reconciliation of the 01","a":true,"b":true,"h":[[252,306]],"id":3365},{"y":2025,"k":0,"fac":"Chromatography Institute of America dba Compounder’s International Analytical Laboratory","fei":"3012069146","date":"2025-08-20","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/chromatography-institute-america-dba-compounders-international-analytical-laboratory-708944-08202025","t":"Lack of adequate Quality Unit oversight\n\nYour Quality Unit (QU) failed to exercise adequate oversight over your contract testing operations. For example, your QU failed to ensure:\n\nEstablishment of restricted access and appropriate controls on computerized systems to prevent any potential alteration or deletion of laboratory data.\n\nImplementation of an effective document control system for issuance, tracking, and reconciliation of CGMP documents used for laboratory testing and analysis.\n\nReview and approval of an uncontrolled document, \"Sample Prep Tips and Tricks,\" used by laboratory staff for preparation of analytical samples.\n\nIn your response you state that moving forward, you will create individual logins on your computers, and you are looking into installing technology with audit trail capability. Further, you state that you will create templates for your forms and bind them into a","a":false,"b":true,"h":[[334,490]],"id":803},{"y":2024,"k":0,"fac":"Analytical Food Laboratories, Inc.","fei":"3005057567","date":"2024-10-10","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/analytical-food-laboratories-inc-687513-10102024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) lacked adequate oversight of your contract testing operations. For example, your QU failed to adequately:\n\ncontrol the issuance and reconciliation of uncontrolled loose forms used for documenting laboratory testing, equipment uses, and calibrations.\n\nreview laboratory records to ensure completeness, including documentation of blank, sample, and mobile phase preparations.\n\nFurthermore, while your quality manual, \"Manual of Quality Policies for Analytical Food Laboratories\" and SOP PRO42-1, \"Quality Department Responsibilities\" referenced 21 CFR 58.35, your procedures did not detail how your operations would meet 21 CFR parts 210 and 21","a":false,"b":true,"h":[[365,506]],"id":1450},{"y":2024,"k":0,"fac":"Aqualex Co., Ltd.","fei":"3010683345","date":"2024-06-12","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/aqualex-co-ltd-672292-06122024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) failed to ensure adequate control over CGMP records. For example, your QU failed to ensure there are adequate controls in place to assure that changes to CGMP records can be made only by authorized personnel, as employees were able to freely print out and discard documents without adequate QU or reconciliation. Our investigator also observed multiple original records (e.g., checklists associated with temperature and differential pressure monitoring) in a container marked for shredding.\n\nAdditionally, your QU does not adequately ensure the accuracy and integrity of data to support the quality of the drugs you manufacture. Notably, your","a":false,"b":true,"h":[[470,569]],"id":1692},{"y":2024,"k":0,"fac":"Fancystage Unipessoal, LDA","fei":"3015282935","date":"2024-06-04","n":4,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/fancystage-unipessoal-lda-678453-06042024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) failed to ensure adequate control over CGMP records. For example, employees were able to print out and discard documents (e.g., batch records) without adequate QU approval or reconciliation. Additionally, your QU did not adequately review the accuracy and integrity of data to assure the quality of the drugs you manufactured and released. Furthermore, essential original data is not maintained, in that results are transcribed and the original record is discarded.\n\nYour firm's quality systems are inadequate. See FDA's guidance document, Quality Systems Approach to Pharmaceutical CGMP Regulations , for help implementing quality systems an","a":false,"b":true,"h":[[324,447]],"id":1703},{"y":2023,"k":1,"fac":"Baxter Healthcare Corporation","fei":"3004610460","date":"2023-01-27","n":7,"cfr":"","url":"https://www.fda.gov/media/175813/download","t":"2023, stacks of form GQF-03-01-05 \"Course to Employee Training Roster\" and Exhibit EX/CF/CQA/024.03 \"Worker Training Questionnaire\" were observed in a cabinet in the room used to qualify visual inspectors. They were identified as GMP records. There is no process to reconcile how many are printed, used, and submitted as GMP records. There are approximately 69 exhibits from site procedures that are used for recording GMP data that can be printed by any employee or filled out in Team Center Unified using a Microsoft word format. An additional 28 global quality forms used for recording GMP data are maintained on a computer system available to all employees for printing.","a":true,"b":false,"h":[[252,296]],"id":4687},{"y":2021,"k":1,"fac":"Eli Lilly and Company","fei":"1819470","date":"2021-03-16","n":7,"cfr":"","url":"https://www.fda.gov/media/151142/download","t":"The establishment of laboratory control mechanisms including any changes thereto, are not drafted by the appropriate organizational unit and reviewed and approved by the quality control unit. Specificarly, The PR&D Development laboratory located in B314, used for lot release of clinical batches, stability testing and method validation do not perform reconciliation of injections performed in the laboratory. Only the sequences turned in for review, are evaluated. ~ /, ~ ' ~~1-~f. SEE REVERSE Robert Ham , Investigator ·3/ 16/2021 OF THIS PAGE Sandra Boyd, I nvestigator ~~,y - 2. h Muna Algharibeh, Investigator Rafeeq Habeeb, Investigator FORM l'D\" C&J (o,/01) PlUlVIO\\JS EDlTION OBSOILTE INSPECTIONAL OBSERVAT lONS PAGE 13 OF 13 PAGES Section 704{b) of the Federal Food, Drug, and Cosmetic Act {21 USC 374{b)) provides: \"Upon completion of any such inspection of a factory, warehouse, consulting","a":false,"b":true,"h":[[340,388]],"id":5478}],"CS-EDC-001":[{"y":2025,"k":1,"fac":"F.H. Investments Inc dba Asteria Health","fei":"3038253438","date":"2025-12-19","n":9,"cfr":"","url":"https://www.fda.gov/media/191003/download","t":"compromising data integrity for critical quality decisions. B. Inadequate batch record and document control where environmental monitoring, personnel monitoring, sampling, and visual inspection forms that support batch release decisions are accessible for unlimited printing by non-QC personnel without reconciliation controls such as date/time stamps, page number, issuance tracking. C. Uncontrolled equipment documentation where equipment maintenance, cleaning, and use logbooks are not bound or controlled, including HPLC maintenance logs, calibration records, and cleaning documentation, allowing potential alteration or loss of critical data supporting product quality decisions. These data integrity deficiencies compromise the reliability of analytical and manufacturing data generated since facility operations began in May 2025, affecting the assurance that products meet specifications and ","a":true,"b":true,"h":[[256,274]],"id":3252},{"y":2025,"k":1,"fac":"Park Avenue Compounding","fei":"1972829","date":"2025-09-23","n":8,"cfr":"","url":"https://www.fda.gov/media/190024/download","t":"electronic audit trails to track the creation, modification, or deletion ofsuch data to date. C. Your firm' s control documents, such as environmental and personnel AMENDMENTl monitoring result forms, visual inspection result forms are accessible for unlimited printing, without any means of reconciliation (i.e. no date/time-stamp) by non-QC personnel. In addition, your firm's managment stated your employee has reprinted at least one form instead of adhering to Good Documentation Practices. *DATES OF INSPECTION 9/l 1/2025(Thu), 9/12/2025(Fri), 9/l 5/2025(Mon), 9/16/2025(Tue ), 9/l 7/ 2025(Wed), 9/l 8/2025(Thu), 9/19/2025(Fri), 9/22/2025(Mon), 9/23/2025(Tue) Saral\\M Ga!S'la X M~Ul'aclu\"1~Compou1~~0te/tyExp!!lt Signed By: 200403374.J Dale 51§,TI:ed: 09-23-21125 19:.36:47 AMENDMENTl Section 704(b) of the Federal Food, Drug, and Cosmetic Act (21 USC 374(b)) provides: \"Upon completion of any s","a":true,"b":true,"h":[[251,269]],"id":3375},{"y":2024,"k":0,"fac":"Jiangsu Hengrui Pharmaceuticals Co., Ltd.","fei":"3007373503","date":"2024-07-11","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/jiangsu-hengrui-pharmaceuticals-co-ltd-679790-07112024","t":"over the adequacy and reliability of all CGMP data at your facility. In addition, your QA department is responsible for ensuring your employees understand and adhere to batch issuance procedures and data integrity principles.\n\nYour production manager repeatedly accessed and printed uncontrolled blank copies of production records, media fill records, visual inspection records, process validation batch records, and cleaning validation records saved on his computer or through your document management system. When production employees reported an \"error\" in a record, your production manager printed a blank copy and had the employee transcribe the information on the new record and discarded the old record. There is no assurance that archived data is original or accurate.\n\nIn your response, you indicate you will perform a risk re-assessment on your document management software for better contr","a":true,"b":true,"h":[[251,509]],"id":1647},{"y":2023,"k":0,"fac":"Safecor Health, LLC","fei":"1218914","date":"2023-09-05","n":4,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/safecor-health-llc-657886-09052023","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) failed to ensure adequate document control over paper records. For example, our investigators observed partially completed and torn-up manufacturing records for a lot of children's acetaminophen and stacks of loose printed forms on a desk next to the repackaging area. Manufacturing records are not adequately controlled as they can be accessed and printed by employees with access to your firm's (b)(4) site. The use of correction fluid was also observed to make corrections on the daily cleaning log for solid oral dose packaging equipment. Your documentation practices raise concerns about the integrity, authenticity, and reliability of a","a":false,"b":true,"h":[[527,666]],"id":2080}],"CS-AUD-004":[{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"administrative rights on your chromatographic systems that allowed them to alter and delete data, files, and folders, including your spreadsheet used for assay calculations. In addition, during a review of system audit trails, our investigator observed multiple \"deleted system\" and \"deleted project\" errors with no assessment report completed as required by your procedure. Deficiencies in your electronic data security controls were identified and discussed during previous FDA inspections, yet your firm has failed to implement adequate corrective measures. The lack of proper electronic records controls undermines the reliability and integrity of your laboratory data.\n\nManual Integration\n\nYour analysts conducted manual integration of HPLC assay peaks without scientific justification or procedural controls. For example, our review of chromatograms for (b)(4) suppositories stability batch # (","a":true,"b":true,"h":[[253,373]],"id":569},{"y":2025,"k":0,"fac":"Shiva Analyticals Private Limited","fei":"3006192929","date":"2025-07-23","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/shiva-analyticals-private-limited-707857-07232025","t":"different from those weights documented in testing of raw materials and finished products (including those intended for the U.S. market).\n\nAdditionally, during the evaluation of audit trail review for your MassLynx software, our investigator documented that your laboratory analysts performed hundreds of entries related to \"Add/Modify/Delete peaks,\" and \"Alter existing file on disk\" user privileges between January 16, 2022, and January 23, 2025.\n\nData integrity is critical throughout the CGMP data lifecycle, including in the creation, modification, processing, maintenance, archival, retrieval, and transmission of data. Customers rely on the integrity of the laboratory data that you generate to make decisions regarding drug quality.\n\nIt is important to maintain strict control over electronic data to ensure that any additions, deletions, or modifications of information in your electronic re","a":true,"b":true,"h":[[258,447]],"id":900},{"y":2025,"k":0,"fac":"Aspen Pharmacare Holdings Limited","fei":"3007490529","date":"2025-02-24","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/aspen-pharmacare-holdings-limited-701671-02242025","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour Production and QU did not review electronic raw data and audit trails to ensure data integrity prior to batch release. Your operators obtained and printed a passing result after multiple production filter integrity tests failed. Your operators did not record or print the failing results. For example:\n\nOn August 8, 2024, two operators performed four post-use sterilizing filter integrity tests for (b)(4) batch (b)(4) . The four tests included three failing results and the final passing result. Your operators only reported the passing result.\n\nOn July 25, 2024, two operators performed nine filter integrity tests associated with (b)(4) , bulk batch (b)(4) . The nine te","a":false,"b":true,"h":[[648,771]],"id":1206}],"CS-LAB-002":[{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"identified and discussed during previous FDA inspections, yet your firm has failed to implement adequate corrective measures. The lack of proper electronic records controls undermines the reliability and integrity of your laboratory data.\n\nManual Integration\n\nYour analysts conducted manual integration of HPLC assay peaks without scientific justification or procedural controls. For example, our review of chromatograms for (b)(4) suppositories stability batch # (b)(4) revealed the use of inconsistent integration for the main peak of interest for HPLC assay testing. This inconsistent integration of HPLC peaks is not suitable for quantitative analysis.\n\nAll data must be complete, accurate, and retained to enable appropriate assessments and decisions by the QU. The lack of control over the integrity of your data raises questions about the authenticity and reliability of your analytical data a","a":true,"b":true,"h":[[260,378]],"id":569},{"y":2025,"k":0,"fac":"Unipack LLC","fei":"3008275696","date":"2025-12-19","n":1,"cfr":"21 CFR 211.192","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/unipack-llc-716621-12192025","t":"Your firm failed to thoroughly investigate any unexplained discrepancy or failure of a batch or any of its components to meet any of its specifications, whether or not the batch has already been distributed (21 CFR 211.192).\n\nYour firm failed to conduct adequate investigations into out-of-specification (OOS) results and unknown peaks in chromatograms. For example: C. Unknown peaks were not integrated or properly investigated in HPLC chromatograms of multiple drug products, including, but not limited to, (b)(4) suppository batch # (b)(4) . You also inhibited peak retention time between (b)(4) and (b)(4) for the same drug product. Inhibiting peak integration and restricting integration parameters must be scientifically justified and documented in the validated method to prevent data manipulation.\n\nInadequate investigations can result in unsupported root causes, ineffective corrective actio","a":false,"b":true,"h":[[370,476]],"id":568},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"your procedures did not require evaluation of electronic data which included reprocessed sample integration, aborted runs, single injection data, and electronic audit trails (when available). Accordingly, your QU failed to review this data. Further, manual integration is performed without a governing procedure.\n\nAdditionally, analysts routinely perform (b)(4) system suitability injections of samples which does not comply with existing analytical method standard operating procedures (SOPs). Further, HPLC test method TE3-020-01 for (b)(4) drug product does not define system suitability acceptance criteria for repeatability, peak tailing, and resolution.\n\nLaboratories must establish and implement procedures to ensure the robustness and consistency of testing and data review.","a":true,"b":false,"h":[[250,311]],"id":1760},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"your QU, failed to include these OOS results or indicate that additional sample analysis had been conducted. The final analytical results reported to your client were passing and did not include the OOS data.\n\nManual Sample Integration Not Indicated\n\nYour firm performed manual integration of sample assay peaks. The printed data reviewed by your QU did not indicate that manual integration was performed. Manual integration should be reviewed by your QU to ensure it is performed adequately.\n\nAll data must be complete, accurate, and retained to enable appropriate assessments and decisions by the QU and customers. The lack of control over the integrity of your data raises questions about the authenticity and reliability of your analytical data and the quality of your drug products.","a":true,"b":false,"h":[[251,404]],"id":1759},{"y":2024,"k":0,"fac":"Amman Pharmaceutical Industries","fei":"3013501887","date":"2024-02-14","n":3,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/amman-pharmaceutical-industries-668867-02142024","t":"that your microbiology analysts failed to document those results in lab records.\n\nSampling locations, microbial plate incubation receipt and start times, and counting of colonies on microbial settling and air plates were not accurate and/or documented.\n\nYour analytical chemists were able to manipulate chromatographic integration parameters to erroneously obtain results meeting the established specifications for (b)(4) Lot (b)(4) . It was only when our investigator requested that you follow your established integration procedures and recalculate the potency for the active ingredient, that you documented an out-of-specification test result, and subsequently opened an investigation.\n\nYour firm did not retain original source data (metadata) from the HPLC equipment to ensure audit trails could be properly reviewed. During our inspection, you confirmed that original data had been overwritten, ","a":true,"b":true,"h":[[254,410]],"id":1901},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"employee manually alter the reported time that an operation was performed. QA did not review audit trails as part of their batch record review to identify discrepancies and compare the reported date and time against that which was originally logged.\n\n2. Analysts manually reprocessed chromatograms by adding integration events that were not approved by QC management. In addition, you lacked appropriate procedures describing when the analyst can manually input integration events, how these events should be used, or how they should be reviewed.\n\n3. Destroyed KF raw data paper printouts associated with drug products were discovered by our inspection team in a trash bag. The KF instrument used for water content testing and assay testing is capable of storing electronic data; however, this capacity was not utilized, and you did not save this data electronically.","a":true,"b":false,"h":[[254,366]],"id":2142}],"CS-SPR-005":[{"y":2025,"k":0,"fac":"Taizhou Kangping Medical Science and Technology Co., Ltd.","fei":"3013321339","date":"2025-10-09","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-kangping-medical-science-and-technology-co-ltd-711081-10092025","t":"Failure to establish appropriate product specifications and scientifically sound testing procedures (21 CFR 211.160(b)). B. Your firm lacked sufficient controls over GC and HPLC data acquisition systems that are used to test assay label claims for drug products before release. Specifically, Excel worksheets used to perform chromatogram calculations were not retained, and access accounts to the GC and HPLC workstations were shared by job title and were not attributable to the individual analyst. The inspection documented the deletion of several recent Excel spreadsheets that were used to perform suitability and assay calculations. Your QC Supervisor/Manager confirmed that the Excel spreadsheets that were relied upon to generate the finished product quality standards, had not been validated, controlled, retained, or quality verified for data integrity before they were used for product rele","a":false,"b":true,"h":[[292,368]],"id":658},{"y":2022,"k":1,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2022-12-02","n":10,"cfr":"","url":"https://www.fda.gov/media/164602/download","t":"b.The lb) <) Machine (PS0 15) allows the operator to make changes to operation settings. The machine is not configured to allow saving or printing of the operating parameters or alarms. The 2018 assessment identified the audit trail was available in an excel format that was not saved, but no con ective actions have been taken to ensure it is maintained or part of the batch record review. 2.No similai· assessment for data integrity controls has been conducted for laboratory equipment. The titrator instruments are standalone systems used for ~bll4l and assay testing. The instruments have the ability to electronically store results data, but this function is not utilized. Rather, the process relies on the paper printouts without having any second check , that can ensure all print outs ru.·e maintained and report ed. On November 22, 2022, original b) < 4 } fbl < 4)I printouts were founded di","a":true,"b":true,"h":[[253,284]],"id":4743},{"y":2022,"k":0,"fac":"Specialty Process Labs LLC","fei":"3017888878","date":"2022-05-03","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/specialty-process-labs-llc-624281-05032022","t":"This equipment was never qualified according to your quality unit personnel.\n\nA non-validated Excel spreadsheet was utilized to calculate finished thyroid, USP API assay results for all validation lot assay calculations. The formulas and outputs of the spreadsheet were printed at the time of the calculation and not saved. You were unable to provide an electronic copy of the original spreadsheet or master spreadsheet during the inspection.\n\nManufacturing master batch records held in electronic form on your company's shared drive do not have restrictions on user access. Your quality unit personnel stated that there are no restrictions for any personnel with login credentials to access new and obsolete master records. Our investigator observed during the inspection multiple versions of batch records were utilized for API lot production.\n\nIn your response, you committed to performing a retro","a":true,"b":true,"h":[[253,322]],"id":2660}],"CS-SPR-001":[{"y":2025,"k":0,"fac":"Taizhou Kangping Medical Science and Technology Co., Ltd.","fei":"3013321339","date":"2025-10-09","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-kangping-medical-science-and-technology-co-ltd-711081-10092025","t":"Failure to establish appropriate product specifications and scientifically sound testing procedures (21 CFR 211.160(b)). B. Your firm lacked sufficient controls over GC and HPLC data acquisition systems that are used to test assay label claims for drug products before release. Specifically, Excel worksheets used to perform chromatogram calculations were not retained, and access accounts to the GC and HPLC workstations were shared by job title and were not attributable to the individual analyst. The inspection documented the deletion of several recent Excel spreadsheets that were used to perform suitability and assay calculations. Your QC Supervisor/Manager confirmed that the Excel spreadsheets that were relied upon to generate the finished product quality standards, had not been validated, controlled, retained, or quality verified for data integrity before they were used for product rele","a":false,"b":true,"h":[[690,797]],"id":658},{"y":2024,"k":0,"fac":"Beckman Coulter Inc.","fei":null,"date":"2024-03-15","n":2,"cfr":"21 CFR 820.100","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/beckman-coulter-inc-678042-03152024","t":"severity of these nonconformance trends is not adequately described.\n\nii. Your procedure \"Complaint Trending,\" GLB-QS-WI-0009, Revision 11.0, does not provide a process to determine whether a CAPA Request should be opened for a noted complaint trend. a. (b)(4) on the \" (b)(4) Trend\" sheet of the \"Trending Workbook v1.3\" incorrectly calculates (b)(4) , or (b)(4) , for the subsequent occurrence analysis. b. (b)(4) chart limits are recalculated for each category (b)(4) . You have not adequately documented justification on why this is a valid statistical technique. c. Each \" (b)(4) \" complaint line item is assigned a (b)(4) for each of the last (b)(4) , depending on if it exceeded (b)(4) calculated values. However, there is no documentation on how these (b)(4) were originally established.\n\niii. Your procedure \"Complaint Handling and Investigation,\" GLB-QS-PCD-0018, Revision 19.1, the only re","a":true,"b":true,"h":[[254,404]],"id":1838},{"y":2023,"k":0,"fac":"Fischer Analysen Instrumente Gmbh","fei":null,"date":"2023-02-03","n":4,"cfr":"21 CFR 820.70","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/fischer-analysen-instrumente-gmbh-650388-02032023","t":"conducting a systematic and retrospective review of previously documented complaint and CAPA to identify potential gaps between the existing Excel spreadsheet records and any physical records. In addition, your firm has not completed the evaluation of other unvalidated Excel spreadsheets used in their Quality Management Systems to determine if there are other systems impacted or additional corrective action(s) needed.","a":true,"b":false,"h":[[258,275]],"id":2381}],"CS-SPR-003":[{"y":2025,"k":0,"fac":"Taizhou Kangping Medical Science and Technology Co., Ltd.","fei":"3013321339","date":"2025-10-09","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-kangping-medical-science-and-technology-co-ltd-711081-10092025","t":"the deletion of several recent Excel spreadsheets that were used to perform suitability and assay calculations. Your QC Supervisor/Manager confirmed that the Excel spreadsheets that were relied upon to generate the finished product quality standards, had not been validated, controlled, retained, or quality verified for data integrity before they were used for product release. Further, this individual was the only analyst who performed testing, yet maintained administrative privileges within the system. When further questioned on this practice, the QC Supervisor/Manager identified that the administrative role was the only primary access point to the Gas Chromatography data acquisition software for OTC (b)(4) product release and stability testing.\n\nYour quality system does not adequately ensure the accuracy and integrity of data to support the safety, effectiveness, and quality of the drug","a":true,"b":true,"h":[[251,335]],"id":658},{"y":2025,"k":1,"fac":"Park Avenue Compounding","fei":"1972829","date":"2025-09-23","n":8,"cfr":"","url":"https://www.fda.gov/media/190024/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in master production and control records or other records are instituted only by authorized personnel. Specifically, A. Your firm utilizes a shared network that is accessible to all employees (operations, production, and quality) to access your firm' s Quality Control Documents. For example, but not limited to:\n1. Environmental and Personnel Monitoring, Deviations, Complaints, Change Controls, Validation Protocols. Your non-quality personnel has unrestricted to access make changes to the following:\n1. Uncontrolled excel spreadsheet used to track and trend your firm's environmental monitoring for classified areas.\n11. Modify, delete, add data to complaint files. B. Your computerized software used for batch record release includes quality events associated with each batch record release ( compla","a":false,"b":true,"h":[[603,621]],"id":3375},{"y":2024,"k":1,"fac":"Mixlab TX LLC","fei":"3008790859","date":"2024-08-02","n":8,"cfr":"","url":"https://www.fda.gov/media/181933/download","t":"Batch production and control records do not include complete information relating to th e production and control of each batch. Specifically, your firm's batch records do not include documentation and/or complete documentation of each significant step in the production of drug products. For example, a) Your firm is not documenting in the batch record the actual number of biological r indicators (Bl) used and incubated used when (b)(4) certain drug products. b) Your firm is not documenting in the batch record sampling performed of finished drug products. c) Visual inspection of finished sterile drug products is documented on an uncontrolled Excel spreadsheet that is not part of the batch record for each drug product. Your firm is not documenting in the spreadsheet if any vials are rejected or the reason for rejection. *DATES OF INSPECTION 7/ 23/2024(Tue ), 7 /24/2024(Wed), 7 /25/2024(Thu)","a":false,"b":true,"h":[[635,653]],"id":3971}],"CS-ACC-005":[{"y":2025,"k":0,"fac":"Taizhou Kangping Medical Science and Technology Co., Ltd.","fei":"3013321339","date":"2025-10-09","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-kangping-medical-science-and-technology-co-ltd-711081-10092025","t":"Supervisor/Manager confirmed that the Excel spreadsheets that were relied upon to generate the finished product quality standards, had not been validated, controlled, retained, or quality verified for data integrity before they were used for product release. Further, this individual was the only analyst who performed testing, yet maintained administrative privileges within the system. When further questioned on this practice, the QC Supervisor/Manager identified that the administrative role was the only primary access point to the Gas Chromatography data acquisition software for OTC (b)(4) product release and stability testing.\n\nYour quality system does not adequately ensure the accuracy and integrity of data to support the safety, effectiveness, and quality of the drugs you manufacture. See FDA's guidance document Data Integrity and Compliance With Drug CGMP for guidance on establishing","a":true,"b":true,"h":[[268,386]],"id":658}],"CS-VAL-003":[{"y":2025,"k":0,"fac":"Guangxi Yulin Pharmaceutical Group Co. Ltd.","fei":"1000589993","date":"2025-09-30","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/guangxi-yulin-pharmaceutical-group-co-ltd-710422-09302025","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour laboratory equipment lacked sufficient controls to prevent and detect deletion or manipulation of your laboratory's electronic raw data. For example, your ultraviolet-visible (UV-vis) and infrared (IR) spectroscopy equipment was found to lack audit trail functionality, and your analysts were able to alter and delete data, files, and folders. This is a repeat observation from your 2016 inspection.\n\nIn your response, you commit to performing audit trail reviews for active ingredient assays before batch release. However, your response is inadequate because your commitment does not include the review of other electronic laboratory data associated with component and fin","a":false,"b":true,"h":[[377,495]],"id":756},{"y":2024,"k":0,"fac":"Xoran Technologies, LLC","fei":null,"date":"2024-12-09","n":2,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/xoran-technologies-llc-694229-12092024","t":"release v5.17.3, dated February 19, 2024, introduced features (e.g., supporting the detector panels) and fixed anomalies (e.g., 64-bit Region of Interest (ROI) tool, which \"[did] not work properly\"). However, the test cases and results indicate that the software was validated at the software system level, utilizing only functional testing (i.e., black-box) techniques. The validation documentation does not include component testing and integration testing. Since January 2020, your firm has logged approximately 460 complaints which include \"Software Issue > XoranCAT\" in the complaint categorization code. These complaints allege problems such as freezing/crashing software, image reconstruction issues, and corrupted files.\n\nWe reviewed your firm's responses dated July 29, 2024, August 30, 2024, and September 30, 2024, and conclude that they are not adequate. Your firm's responses state (b)(4","a":true,"b":true,"h":[[250,369]],"id":1303}],"CS-SPR-006":[{"y":2025,"k":0,"fac":"Exela Pharma Sciences, LLC","fei":"3008563008","date":"2025-07-02","n":7,"cfr":"21 CFR 211.165","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/exela-pharma-sciences-llc-709859-07022025","t":"any improper techniques utilized by analyst(s) during the testing.\n\n2. You failed to perform contemporaneous two-person checks during the reading of environmental (b)(4) plates and subsequent data entry of the results in your (b)(4) software system. A single analyst reads environmental plate counts, takes pictures only of the positive counts, and then enters results in the (b)(4) software system. The Quality Control (QC) personnel later review and verify the results in the (b)(4) software system. There is no assurance the analyst read plate counts accurately or entered data in the software system accurately. On November 6, 2024, an FDA investigator observed miscounted plates with discrepancies when compared to the analyst's count which were later corrected by the analyst.\n\nIn your responses, you state that section 6.8.7.5 of your SOP-000189 \"Use, Preparation, and Storage of QC - Microbio","a":true,"b":true,"h":[[250,398]],"id":966}],"CS-VAL-004":[{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"Your 2018 Process Equipment Assessment Report identified numerous gaps and deficiencies for electronic manufacturing equipment needing upgrades in access controls, audit trails, saving electronic data and preventing clock alterations. You had not documented closures of these corrective action and preventive action (CAPA) measures to support data integrity in your computerized systems. Your QA department had not performed a similar assessment in your QC laboratories.\n\nIn your response, you acknowledge the inspection findings and you reference your standard operating procedure titled, \"Data Integrity,\" which stipulates the individuals permitted to make changes in an electronic record and requires audit trails to capture those actions. You also commit to obtaining expertise from a qualified consultant to systematically address the deviations, as part of the baseline assessment.\n\nYour respon","a":false,"b":true,"h":[[388,469]],"id":2143}],"CS-P11-006":[{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"failure of laboratory, operations, and quality assurance management to conduct proper oversight over documentation and prevent data integrity lapses. B. Your department failed to exercise appropriate controls over computerized systems. For example:\n\n1. Your electronic batch records allowed changes to be made to manual entries prior to saving. Our inspector observed a production employee manually alter the reported time that an operation was performed. QA did not review audit trails as part of their batch record review to identify discrepancies and compare the reported date and time against that which was originally logged.\n\n2. Analysts manually reprocessed chromatograms by adding integration events that were not approved by QC management. In addition, you lacked appropriate procedures describing when the analyst can manually input integration events, how these events should be used, or h","a":true,"b":true,"h":[[253,343]],"id":2142}],"CS-LAB-004":[{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"describing when the analyst can manually input integration events, how these events should be used, or how they should be reviewed.\n\n3. Destroyed KF raw data paper printouts associated with drug products were discovered by our inspection team in a trash bag. The KF instrument used for water content testing and assay testing is capable of storing electronic data; however, this capacity was not utilized, and you did not save this data electronically.","a":true,"b":false,"h":[[259,451]],"id":2142}]},"excluded":0,"csv":"citations.csv","csvRows":5792,"taxonomy":"1.1"}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("report-data").textContent);
  var KIND = ["Warning letters", "Form 483s"];
  var state = { year: null, kind: null, measure: "count", showAll: false };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs || {}) n.setAttribute(k, attrs[k]);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function fmt(v) { return v.toLocaleString("en-US"); }
  function kindOk(k) { return state.kind === null || state.kind === k; }
  function yearOk(y) { return state.year === null || state.year === y; }
  function docsIn(y) { var d = D.docs[y] || [0, 0]; return state.kind === null ? d[0] + d[1] : d[state.kind]; }
  function obsIn(y) { var d = D.obs[y] || [0, 0]; return state.kind === null ? d[0] + d[1] : d[state.kind]; }
  function docsSel() { return D.years.filter(yearOk).reduce(function (a, y) { return a + docsIn(y); }, 0); }
  function value(count, y) {
    if (state.measure === "count") return count;
    var d = y === null ? docsSel() : docsIn(y);
    return d ? 100 * count / d : 0;
  }
  function show(v) { return state.measure === "count" ? fmt(v) : v.toFixed(1); }
  function rows() { return D.f.filter(function (f) { return kindOk(f[2]); }); }
  var lastYear = D.years[D.years.length-1];
  var partial = D.asOf && D.asOf.slice(5) !== "12-31";
  function yearLabel(y) { return partial && y === lastYear ? y + "*" : String(y); }

  // ---- header
  var y0 = D.years[0], y1 = lastYear;
  document.getElementById("lede").textContent = "What FDA cited about computerized systems and electronic records in " +
    "published warning letters and Form 483s for drugs, biologics and devices, " + (y0 === y1 ? String(y0) : y0 + " to " + y1) +
    (partial ? " (" + y1 + " through " + D.asOf + ")" : "") + ".";
  document.getElementById("basis").textContent = D.accepted
    ? "Counts use findings accepted by a human reviewer."
    : "Counts use machine-proposed tags (rules and Claude) that a person has not yet reviewed. Treat them as a draft: " +
      "they show where enforcement concentrates, not verified totals.";

  // ---- LLM coverage
  function coverage() {
    var box = document.getElementById("coverage"), gaps = [];
    D.years.forEach(function (y) {
      [0, 1].forEach(function (k) {
        var c = D.coverage[y][k];
        if (c[1] && c[0] < c[1] * 0.98) gaps.push(yearLabel(y) + " " + (k ? "483s" : "letters") + " " + Math.round(100 * c[0] / c[1]) + "%");
      });
    });
    var seen = 0, all = 0;
    D.years.forEach(function (y) { [0, 1].forEach(function (k) { seen += D.coverage[y][k][0]; all += D.coverage[y][k][1]; }); });
    if (!gaps.length || D.accepted) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = "Incomplete: the Claude tagging stage has read " + Math.round(100 * seen / Math.max(all, 1)) +
      "% of citations so far, so years and document types it has not reached are undercounted and the trends are not yet comparable. " +
      "Coverage below 98%: " + gaps.join(", ") + ".";
  }

  // ---- controls
  function seg(id, items, key) {
    var box = clear(document.getElementById(id));
    items.forEach(function (it) {
      box.appendChild(el("button", { type: "button", "aria-pressed": String(state[key] === it[0]), text: it[1],
        onclick: function () { state[key] = it[0]; state.showAll = false; render(); } }));
    });
  }

  // ---- tiles
  function tiles() {
    var fs = rows().filter(function (f) { return yearOk(f[1]); });
    var docsWith = {}, modes = {};
    fs.forEach(function (f) { docsWith[f[3]] = 1; modes[f[0]] = 1; });
    var nd = docsSel(), nw = Object.keys(docsWith).length;
    var obs = D.years.filter(yearOk).reduce(function (a, y) { return a + obsIn(y); }, 0);
    var items = [
      [fmt(nd), state.kind === null ? "documents (warning letters and 483s)" : KIND[state.kind].toLowerCase()],
      [fmt(obs), "violations and observations"],
      [fmt(fs.length), "computerized-systems findings"],
      [nd ? Math.round(100 * nw / nd) + "%" : "n/a", "of documents with at least one finding"],
      [fmt(Object.keys(modes).length), "failure modes cited"]];
    var box = clear(document.getElementById("tiles"));
    items.forEach(function (t) { box.appendChild(el("div", { cls: "tile" }, [el("div", { cls: "v", text: t[0] }), el("div", { cls: "l", text: t[1] })])); });
  }

  // ---- charts
  function barChart(series, opts) {
    // series: [{y, a, b}] stacked a (series 1) + b (series 2)
    var W = opts.w || 640, H = opts.h || 200, pl = 36, pr = 8, pt = 12, pb = 28;
    var max = Math.max.apply(null, series.map(function (s) { return s.a + s.b; }).concat([0]));
    var nice = max <= 0 ? 1 : Math.pow(10, Math.floor(Math.log10(max)));
    var top = Math.ceil(max / nice) * nice || 1;
    var root = svg("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": opts.label });
    var iw = W-pl-pr, ih = H-pt-pb;
    for (var i = 0; i <= 4; i++) {
      var gy = pt + ih * (1-i / 4);
      root.appendChild(svg("line", { x1: pl, x2: W-pr, y1: gy, y2: gy, "class": "grid" }));
      var t = svg("text", { x: pl-6, y: gy + 4, "text-anchor": "end" });
      t.textContent = opts.fmt(top * i / 4); root.appendChild(t);
    }
    var bw = iw / series.length, gap = Math.min(18, bw * 0.3), w = Math.min(bw-gap, opts.maxBar || 90);
    series.forEach(function (s, j) {
      var x = pl + j * bw + (bw-w) / 2;
      var g = svg("g", state.year !== null && state.year !== s.y ? { "class": "dim" } : {});
      var ha = ih * s.a / top, hb = ih * s.b / top;
      var r1 = svg("rect", { x: x, y: pt + ih-ha, width: w, height: Math.max(ha, 0), fill: "var(--s1)", rx: 2 });
      var r2 = svg("rect", { x: x, y: pt + ih-ha-hb, width: w, height: Math.max(hb, 0), fill: "var(--s2)", rx: 2 });
      var tip = svg("title", {}); tip.textContent = opts.tip(s); g.appendChild(tip);
      g.appendChild(r1); if (s.b) g.appendChild(r2);
      var lab = svg("text", { x: x + w / 2, y: pt + ih-ha-hb-4, "text-anchor": "middle", "class": "lbl" });
      lab.textContent = s.a + s.b ? opts.fmt(s.a + s.b) : ""; g.appendChild(lab);
      var yl = svg("text", { x: x + w / 2, y: H-10, "text-anchor": "middle" });
      yl.textContent = yearLabel(s.y); g.appendChild(yl);
      g.style.cursor = "pointer";
      g.addEventListener("click", function () { state.year = state.year === s.y ? null : s.y; render(); });
      root.appendChild(g);
    });
    return root;
  }

  function trend() {
    var by = {};
    D.years.forEach(function (y) { by[y] = [0, 0]; });
    rows().forEach(function (f) { by[f[1]][f[2]]++; });
    var series = D.years.map(function (y) {
      var a = state.kind === 1 ? 0 : by[y][0], b = state.kind === 0 ? 0 : by[y][1];
      if (state.measure !== "count") { var d = docsIn(y); a = d ? 100 * a / d : 0; b = d ? 100 * b / d : 0; }
      return { y: y, a: a, b: b };
    });
    var box = clear(document.getElementById("trend"));
    box.appendChild(barChart(series, { label: "Findings per year", fmt: function (v) { return state.measure === "count" ? fmt(Math.round(v)) : v.toFixed(0); },
      tip: function (s) { return yearLabel(s.y) + ": " + show(s.a) + " in warning letters, " + show(s.b) + " in Form 483s"; } }));
    var lg = clear(document.getElementById("trend-legend"));
    if (state.kind !== 1) lg.appendChild(el("span", {}, [el("span", { cls: "sw", style: "background:var(--s1)" }), "Warning letters"]));
    if (state.kind !== 0) lg.appendChild(el("span", {}, [el("span", { cls: "sw", style: "background:var(--s2)" }), "Form 483s"]));
    document.getElementById("trend-note").textContent = (state.measure === "count"
      ? "Number of findings (violation x failure mode) by issue year."
      : "Findings per 100 documents issued that year, so years with more letters do not look worse by volume alone.") +
      " Documents per year: " + D.years.map(function (y) { return yearLabel(y) + " " + docsIn(y); }).join(", ") +
      ". Click a bar to filter by year." + (partial ? " *" + lastYear + " is a partial year." : "");
  }

  function spark(vals) {
    var W = 84, H = 22, max = Math.max.apply(null, vals.concat([0])) || 1, bw = W / vals.length;
    var root = svg("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" });
    vals.forEach(function (v, i) {
      var h = Math.max(v ? 2 : 0, (H-2) * v / max);
      root.appendChild(svg("rect", { x: i * bw + 1, y: H-h, width: bw-2, height: h, rx: 1,
        fill: state.year === D.years[i] ? "var(--s2)" : "var(--s1)" }));
    });
    return root;
  }

  // ---- mode table
  function modeCounts() {
    var c = {};
    rows().forEach(function (f) {
      var m = c[f[0]] || (c[f[0]] = { years: {}, total: 0, docs: {}, wl: 0, f483: 0, cfr: {} });
      m.years[f[1]] = (m.years[f[1]] || 0) + 1;
      if (yearOk(f[1])) {
        m.total++; m.docs[f[3]] = 1; if (f[2] === 0) m.wl++; else m.f483++;
        f[4].forEach(function (s) { m.cfr[s] = (m.cfr[s] || 0) + 1; });
      }
    });
    return c;
  }
  function sortedModes(c) {
    return Object.keys(c).filter(function (m) { return c[m].total > 0; })
      .sort(function (a, b) { return c[b].total-c[a].total || a.localeCompare(b); });
  }

  function modeTable(c, order) {
    var t = clear(document.getElementById("mode-table"));
    var head = el("tr", {}, [el("th", { text: "Failure mode" })]);
    D.years.forEach(function (y) { head.appendChild(el("th", { cls: "n" + (state.year === y ? " sel" : ""), text: yearLabel(y) })); });
    head.appendChild(el("th", { cls: "n", text: state.year === null ? "Total" : "Total " + state.year }));
    head.appendChild(el("th", { text: "Trend" }));
    t.appendChild(el("thead", {}, [head]));
    var body = el("tbody");
    var max = 0;
    order.forEach(function (m) { D.years.forEach(function (y) { max = Math.max(max, value(c[m].years[y] || 0, y)); }); });
    order.forEach(function (m) {
      var info = D.modes[m];
      var tr = el("tr", { cls: "moderow", title: "Show details", onclick: function () {
        var card = document.getElementById("mode-" + m);
        if (!card) { state.showAll = true; render(); card = document.getElementById("mode-" + m); }
        if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
      } }, [el("td", {}, [el("div", { cls: "mname", text: info[0] }), el("div", { cls: "mid", text: m + " · " + info[1] })])]);
      var vals = [];
      D.years.forEach(function (y) {
        var v = value(c[m].years[y] || 0, y); vals.push(v);
        var a = max ? 0.08 + 0.55 * v / max : 0;
        tr.appendChild(el("td", { cls: "n heat" + (state.year === y ? " sel" : ""), style: v ? "background:rgba(var(--heat)," + a.toFixed(3) + ")" : "",
          text: v ? show(v) : "·" }));
      });
      tr.appendChild(el("td", { cls: "n" }, [el("b", { text: show(value(c[m].total, state.year)) })]));
      tr.appendChild(el("td", {}, [spark(vals)]));
      body.appendChild(tr);
    });
    t.appendChild(body);
    document.getElementById("table-note").textContent = (state.measure === "count"
      ? "Findings by failure mode and issue year; each violation counts once per mode."
      : "Findings per 100 documents issued that year.") + " Click a row for definitions, CFR sections and sample citations.";
  }

  function catTable(c, order) {
    var cats = {};
    order.forEach(function (m) {
      var k = D.modes[m][1] || "Other", x = cats[k] || (cats[k] = { total: 0, modes: 0, years: {} });
      x.total += c[m].total; x.modes++;
      D.years.forEach(function (y) { x.years[y] = (x.years[y] || 0) + (c[m].years[y] || 0); });
    });
    var names = Object.keys(cats).sort(function (a, b) { return cats[b].total-cats[a].total; });
    var max = Math.max.apply(null, names.map(function (k) { return cats[k].total; }).concat([1]));
    var t = clear(document.getElementById("cat-table"));
    t.appendChild(el("thead", {}, [el("tr", {}, [el("th", { text: "Category" }), el("th", { text: "" }),
      el("th", { cls: "n", text: "Findings" }), el("th", { cls: "n", text: "Modes" }), el("th", { text: "Trend" })])]));
    var body = el("tbody");
    names.forEach(function (k) {
      var x = cats[k], w = 100 * x.total / max;
      body.appendChild(el("tr", {}, [el("td", { cls: "mname", text: k }),
        el("td", { style: "width:38%" }, [el("div", { style: "height:10px;border-radius:0 4px 4px 0;background:var(--s1);width:" + w.toFixed(1) + "%" })]),
        el("td", { cls: "n", text: fmt(x.total) }), el("td", { cls: "n", text: x.modes }),
        el("td", {}, [spark(D.years.map(function (y) { return value(x.years[y] || 0, y); }))])]));
    });
    t.appendChild(body);
  }

  // ---- cards
  function sampleNode(s) {
    var text = s.t, parts = [], pos = 0;
    s.h.forEach(function (r) {
      if (r[0] < pos) return;
      parts.push(text.slice(pos, r[0])); parts.push(el("mark", { text: text.slice(r[0], r[1]) })); pos = r[1];
    });
    parts.push(text.slice(pos));
    if (s.a) parts.unshift("…");
    if (s.b) parts.push("…");
    var meta = el("div", { cls: "smeta" }, [el("strong", { text: s.fac }), s.fei ? " · FEI " + s.fei : "",
      " · " + (s.k === 0 ? "Warning letter, violation " : "Form 483, observation ") + s.n,
      " · " + s.date, s.cfr ? " · " + s.cfr : "", " · ",
      s.url ? el("a", { href: s.url, target: "_blank", rel: "noopener", text: "source" }) : "no source link"]);
    return el("div", { cls: "sample" }, [meta, el("div", { cls: "excerpt" }, parts)]);
  }

  function cards(c, order) {
    var box = clear(document.getElementById("cards"));
    var limit = state.showAll ? order.length : Math.min(order.length, 10);
    order.slice(0, limit).forEach(function (m) {
      var info = D.modes[m], x = c[m];
      var chart = barChart(D.years.map(function (y) {
        var v = value(x.years[y] || 0, y); return { y: y, a: v, b: 0 };
      }), { w: 300, h: 150, label: info[0] + " by year", fmt: function (v) { return state.measure === "count" ? String(Math.round(v)) : v.toFixed(1); },
        tip: function (s) { return yearLabel(s.y) + ": " + show(s.a); } });
      var cfr = Object.keys(x.cfr).sort(function (a, b) { return x.cfr[b] - x.cfr[a]; }).slice(0, 4);
      var samples = (D.samples[m] || []).filter(function (s) { return yearOk(s.y) && kindOk(s.k); }).slice(0, 3);
      var stats = el("div", { cls: "stats" }, [
        el("div", {}, [el("b", { text: fmt(x.total) }), " findings in ", el("b", { text: fmt(Object.keys(x.docs).length) }), " documents"]),
        el("div", {}, [el("b", { text: fmt(x.wl) }), " in warning letters, ", el("b", { text: fmt(x.f483) }), " in Form 483s"]),
        el("div", { style: "margin-top:6px" }, cfr.length ? cfr.map(function (s) { return el("span", { cls: "pill", text: "21 CFR " + s + " (" + x.cfr[s] + ")" }); })
          : [el("span", { cls: "tiny muted", text: "No CFR section cited (typical for 483s)" })])]);
      box.appendChild(el("article", { cls: "card", id: "mode-" + m }, [
        el("div", { cls: "card-head" }, [el("h3", { text: info[0] }), el("span", { cls: "mid", text: m + " · " + info[1] })]),
        el("p", { cls: "def", text: info[2] }),
        el("div", { cls: "card-body" }, [el("div", {}, [chart, stats]),
          el("div", {}, samples.length ? samples.map(sampleNode) : [el("p", { cls: "small muted", text: "No sample citation for this filter." })])])]));
    });
    var more = clear(document.getElementById("more"));
    if (order.length > limit) more.appendChild(el("button", { type: "button", text: "Show all " + order.length + " failure modes",
      onclick: function () { state.showAll = true; render(); } }));
    document.getElementById("cards-note").textContent = "Top failure modes for the current filter, with up to three recent citations each. " +
      "Highlighted text is the evidence the tag rests on.";
  }

  function cfrTable(c, order) {
    var tot = {};
    order.forEach(function (m) { for (var s in c[m].cfr) tot[s] = (tot[s] || 0) + c[m].cfr[s]; });
    var secs = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; }).slice(0, 15);
    var max = Math.max.apply(null, secs.map(function (s) { return tot[s]; }).concat([1]));
    var t = clear(document.getElementById("cfr-table"));
    t.appendChild(el("thead", {}, [el("tr", {}, [el("th", { text: "Section" }), el("th", { text: "" }), el("th", { cls: "n", text: "Findings" })])]));
    var body = el("tbody");
    if (!secs.length) body.appendChild(el("tr", {}, [el("td", { colspan: 3, cls: "muted", text: "No CFR sections for this filter." })]));
    secs.forEach(function (s) {
      body.appendChild(el("tr", {}, [el("td", { text: "21 CFR " + s }),
        el("td", { style: "width:50%" }, [el("div", { style: "height:10px;border-radius:0 4px 4px 0;background:var(--s2);width:" + (100 * tot[s] / max).toFixed(1) + "%" })]),
        el("td", { cls: "n", text: fmt(tot[s]) })]));
    });
    t.appendChild(body);
  }

  function method() {
    var items = [
      "Sources: warning letters posted on fda.gov and Form 483s in FDA's OII FOIA electronic reading room. Most 483s are never published, so 483 counts are a small, non-random slice of inspections.",
      "Scope: drug, biologic and device letters (CDER, CBER, CDRH and the field divisions that inspect for them). " + D.excluded + " food and veterinary letters in the database are excluded.",
      "Unit: a finding is one numbered warning-letter violation or 483 observation tagged with one failure mode. A violation citing several CFR sections counts once per mode.",
      "Year is the calendar year of the warning-letter or 483 issue date." + (partial ? " " + lastYear + " runs through " + D.asOf + "." : ""),
      "Failure modes come from taxonomy " + D.taxonomy + ". " + (D.accepted ? "Only findings a reviewer accepted are counted."
        : "Tags are proposals from keyword rules and Claude, each backed by a verbatim evidence quote; none has been reviewed by a person yet."),
      "Per 100 documents divides by all in-scope documents issued that year, including ones with no computerized-systems finding."];
    var ul = clear(document.getElementById("method"));
    items.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
    var p = Object.keys(D.paper), n = 0;
    p.forEach(function (m) { for (var y in D.paper[m]) n += D.paper[m][y]; });
    document.getElementById("paper-note").textContent = n
      ? n + " data-integrity findings that involve only paper records (handwritten forms, logbooks, simple printouts, or no record type stated) are excluded from every count: " +
        p.sort(function (a, b) { return sum(D.paper[b]) - sum(D.paper[a]); }).map(function (m) { return D.modes[m][0] + " (" + sum(D.paper[m]) + ")"; }).join(", ") + "."
      : "No paper-only data-integrity findings were excluded.";
    var f = clear(document.getElementById("footer"));
    f.appendChild(document.createTextNode("Generated " + D.generated + " by auditcore. Every citation, including excluded ones, is in "));
    f.appendChild(el("a", { href: D.csv, text: D.csv }));
    f.appendChild(document.createTextNode(" (" + fmt(D.csvRows) + " rows)."));
  }
  function sum(o) { var s = 0; for (var k in o) s += o[k]; return s; }

  function render() {
    seg("years", [[null, "All years"]].concat(D.years.map(function (y) { return [y, yearLabel(y)]; })), "year");
    seg("kinds", [[null, "All"], [0, "Warning letters"], [1, "Form 483s"]], "kind");
    seg("measures", [["count", "Count"], ["rate", "Per 100 documents"]], "measure");
    var c = modeCounts(), order = sortedModes(c);
    coverage(); tiles(); trend(); modeTable(c, order); catTable(c, order); cards(c, order); cfrTable(c, order); method();
  }
  render();
})();
</script>
</body></html>
