istrative rights capable of altering and deleting data, files, and folders on your chromatographic systems, including the date and time of tests.\n\nWe also note that you did not ensure retention of complete electronic raw data for all laboratory instrumentation and equipment. For example, our investigators documented several electronic data results that were not available for review.\n\nIn your response, you acknowledge the lack of document control and state that you have initiated change controls to reduce DI gaps identified during the inspection. Your response is inadequate because you failed to include a comprehensive review of each piece of equipment and the impact of the significant adverse pattern of data that has been discarded or lost. Your ","a":true,"b":true,"h":[[252,288]],"id":1202},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"Your 2018 Process Equipment Assessment Report identified numerous gaps and deficiencies for electronic manufacturing equipment needing upgrades in access controls, audit trails, saving electronic data and preventing clock alterations. You had not documented closures of these corrective action and preventive action (CAPA) measures to support data integrity in your computerized systems. Your QA department had not performed a similar assessment in your QC laboratories.\n\nIn your response, you acknowledge the inspection findings and you reference your standard operating procedure titled, \"Data Integrity,\" which stipulates the individuals permitted to make changes in an electronic record and requires audit trails to capture those actions. You also commit to obtaining expertise from a qualified consultant to systematically address the deviations, as part of the baseline assessment.\n\nYour respon","a":false,"b":true, not in","a":true,"b":true,"h":[[252,261]],"id":3306},{"y":2025,"k":0,"fac":"Leltek Inc.","fei":null,"date":"2025-07-17","n":4,"cfr":"21 CFR 820.80","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/leltek-inc-710787-07172025","t":"Failure to adequately establish and maintain procedures for acceptance activities, as required by 21 CFR 820.80(a). For example: a. Electronic DHR testing forms for the Leltek Ultrasound Imaging Systems were pre-filled with the test results (i.e., \"PASS\"), the signature of the operator, the personnel, and the person \"Approved for release.\"","a":false,"b":false,"h":[[132,339]],"id":931},{"y":2025,"k":0,"fac":"International Laboratories Corp","fei":"3006403166","date":"2025-03-10","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/international-laboratories-corp-698522-03102025","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records lacked complete and reliable original data to support the chromatographic analyses performed on over-the-counter (OTC) drug products and components. For example, our investigators documented multiple examples of fabricated laboratory records. During the inspection, your Laboratory Manager stated that your firm fabricated several laboratory investigations that were not performed. A senior Quality Assurance Manger also confirmed that laboratory investigations were fabricated in preparation for the FDA inspection. Further, you did not maintain the original data from the analytical testing of raw materials and finished products.\n\nIn your response, you acknowledge that your la","a":false,"b":true,"h":[[382,461]],"id":1201},{"y":2023,"k":1,"fac":"Sun Pharmaceutical Industries Limited","fei":"3004561553","da been established. - For example, but not limited to, your firm's Supervising Chemist, stated Rocuronium is c","a":false,"b":true,"h":[[646,657]],"id":4479},{"y":2022,"k":0,"fac":"Miami University Department of Chemistry and Biochemistry","fei":"3009095423","date":"2022-04-20","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/miami-university-department-chemistry-and-biochemistry-623494-04202022","t":"initiation of the FDA's inspection, your firm, and the representatives from your heparin sodium, USP, customer, performed an audit. After reviewing the raw (b)(4) test data, your customer's risk assessment determined that one of your student analysts had \"falsified\" data. Representatives from your firm, and from your customer, informed FDA investigators that this was the first time the (b)(4) and (b)(4) raw data was reviewed since you initiated CGMP testing at your firm. The falsification of (b)(4) data occurred from approximately 2018 to 2021 and consisted of an analyst entering arbitrary values for sample, spike, and correlation.\n\nFurthermore, in addition to concerns about data falsification, additional data integrity concerns were identified, which include the following:\n\nAll (b)(4) sample results were stored in an uncontrolled folder that could be manipulated by any user.\n\nThe (b)(4)","a":true,"b":true,"h":[[256,265]],"id":2667}],"CS-DI-001":[{"y":2026,"k":0,"fac":"Pharmathen International S.A.","fei":"3009961173","date":"2026-05-27","n":3,"cfr":"21 CFR 211.42","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/pharmathen-international-sa-723680-05272026","t":"migrating from lower-classified areas into the higher-classified areas where critical manufacturing operations occur.\n\nFurthermore, you failed to routinely record basic facility monitoring data, including differential pressure, temperature, and humidity. Your monitoring devices displayed real-time data only and lack data storage capability. As a result, parameter excursions that occur when operators are not actively monitoring pressures went undocumented. You also had no alarm history or recorded data.\n\nReliable aseptic processes are designed to minimize exposure of sterile articles to potential contamination hazards including, but not limited to, variation in environmental conditions. A suitable facility monitoring system, with appropriate alarms and data retention, is critical to maintain appropriate environmental control throughout all your cleanrooms. You should appropriately investi","a":true,"b":true,"h":[[255,341]],"id":297},{"y":2026,"k":0,"fac":"Tentamus India Private Limited","fei":"3010960741","date":"2026-03-03","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/tentamus-india-private-limited-720463-03032026","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) failed to ensure that all CGMP records were retained and available for review. Our investigator discovered two garbage bags containing torn analytical records, including chromatographic results, unidentified number lists, and impurity method validation spreadsheets with handwritten notes. For the method validation study, official records contained only handwritten values, while the original data was discarded in the garbage bags. This practice violated your lab documentation standard operating procedure (SOP) which prohibits destroying records or instrument printouts due to errors and requires filing such documents with original data ","a":false,"b":true,"h":[[643,670]],"id":456},{"y":2025,"k":1,"fac":"Simtra BioPharma Solutions","fei":"3002806419","date":"2025-09-26","n":10,"c  of your laboratory's electronic raw data. During the inspection, our investigators documented several chromatograph data files that could not be located in the storage folders on your GC computer. Your firm confirmed that you did not ba","a":false,"b":true,"h":[[431,493]],"id":330},{"y":2024,"k":0,"fac":"Outin Futures Corp.","fei":"3011572099","date":"2024-09-25","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/outin-futures-corp-684688-09252024","t":"deleted and not accessible. Your firm did not adequately maintain backups of data generated by your laboratory equipment. In addition, your analysts had administrative rights for the chromatography data system capable of changing and deleting files and disabled audit trails for some of your chromatographic systems.\n\nIn your response, you state that you removed administrative rights for your analysts, enabled audit trails feature on for your chromatographic system, implemented a data backup schedule, and retested drug product batches that had missing electronic data.\n\nYour response is inadequate. You failed to include a comprehensive review of all laboratory instruments.\n\nIn response to this letter, provide:\n\nA comprehensive, independent assessment of computer system performance and security. Provide a report that identifies vulnerabilities in the design and controls, and a thorough CAPA ","a":true,"b":true,"h":[[253,315]],"id":1474},{"y":2024,"k":0,"fac":"MMC Healthcare Ltd.","fei":"3014773352","date":"2024-09-24","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mmc-healthcare-ltd-684644-09242024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour ultraviolet-visible (UV-Vis) spectrophotometer computer system lacked appropriate controls to assure the integrity of electronic test data, such as an audit trail and defined user access levels. This UV-Vis system was used for release testing of drug product batches.\n\nIn your response, you state that you \"would like to update the UV/Vis [sic] software\" to be compliant and provide a quote for new software.\n\nYour response is inadequate because it does not provide sufficient details describing:\n\n• Timeframe for your corrective action. • Security features of your updated UV-Vis computer system. • User access levels, access privileges, or authorized users to perform the","a":false,"b":true,"h":[[290,420]],"id":1485},{"y":2024,"k":0,"fac":"GFA Production Xiamen Co., Ltd.","fei":"3008384335","date":"2024-06-13","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gfa-production-xiamen-co-ltd-678364-06132024","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour firm performed chemical testing of drug products using high performance liquid chromatography (HPLC) but did not include complete data to support the analysis performed. In addition to chemical testing performed by a contract testing laboratory, our investigators determined that your firm performed in-house HPLC testing of bulk drug products and finished drug products for internal use for your own assurance. This in-house chemical testing was performed without audit trails. You could also not provide validation reports for these HPLC test methods, nor adequately explain the purpose of this testing.\n\nIn your response, you commit to implementing controls, such as using audit trails and electr","a":false,"b":true,"h":[[613,678]],"id":1697},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"example, analysts did not consistently include (b)(4) printout raw data in laboratory records. Paper printouts for the (b)(4) determinations and pH printouts could not be reconciled for (b)(4) injection, (b)(4) mg, process validation batch (b)(4) .\n\nBecause the (b)(4) instrument lacked audit trail capabilities, unreported raw data could not be detected during the QA review process.\n\nFailing to maintain complete records of the data and testing conditions associated with all tests significantly compromises the reliability of data and your QA's ability to perform its obligation to assure quality through conformance with CGMP.\n\nIn your response, you acknowledge EM samples are not counted accurately and that \"laboratory practice was to count colonies that merge together with similar morphology, as one colony.\" You opened EM investigations for action and alert samples and commit to working wit","a":true,"b":true,"h":[[250,383]],"id":2145},{"y":2022,"k":0,"fac":"System Kosmetik Produktionsgesellschaft fur kosmetische Gmbh","fei":"3011408975","date":"2022-09-09","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/system-kosmetik-produktionsgesellschaft-fur-kosmetische-gmbh-632727-09092022","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYou failed to have adequate controls in place for your Fourier Transform Infrared Spectrometer (FTIR) system. For example, you did not establish unique usernames and passwords for each analyst. In addition, the audit trail function was disabled even though this Fourier Transform Infrared Spectrometer is routinely used for raw material and finished product testing.\n\nYour quality system does not adequately ensure the accuracy and integrity of data to support the safety, effectiveness, and quality of the drugs you manufacture. See FDA's guidance document Data Integrity and Compliance With Drug CGMP for guidance on establishing and following CGMP compliant data integrity pr","a":false,"b":true,"h":[[433,466]],"id":2545},{"y":2021,"k":0,"fac":"BBC Group Limited","fei":"3010165327","date":"2021-08-04","n":1,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/bbc-group-limited-614659-08042021","t":"lacked restricted access. For example, your laboratory employees who used the GC to perform analyses of drug products all logged in as \"System Administrator,\" which does not require a password, and had full system administration rights. In addition, audit trails on your GC were not enabled.\n\nFurthermore, you did not retain all original, dynamic records, obtained during the course of testing on other laboratory equipment. Your viscometer and UV-Vis spectrophotometer had the capability to save data from product/material testing. Despite having this capability, your analysts failed to save the complete, dynamic testing data, and therefore the data was not available for review by the FDA investigator. The viscometer is used to measure the viscosity of finished drug products during release testing and the UV-Vis spectrophotometer is used to measure ethanol content during raw material testing.","a":true,"b":true,"h":[[250,290]],"id":2873}],"CS-BKP-001":[{"y":2026,"k":0,"fac":"Laboratorios Jaloma S.A. de C.V.","fei":"3002600322","date":"2026-05-22","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorios-jaloma-sa-de-cv-725939-05222026","t":"the deletion or manipulation of your laboratory's electronic raw data. During the inspection, our investigators documented several chromatograph data files that could not be located in the storage folders on your GC computer. Your firm confirmed that you did not back up the electronic data located on the GC computer.\n\nIn your response, you state that you purchased a GC software package and will validate the GC system. You also commit to strengthening data controls for computer systems and software, enabling audit trails, and routinely backing up electronic data.\n\nYour response is inadequate because it fails to include a comprehensive impact assessment of the chromatography data that was discarded or lost from your GC computer. Your response does not explain how you ensure traceability of your CGMP electronic data files that have inaccurate time stamps and lack audit trail data. Furthermo","a":true,"b":true,"h":[[251,317]],"id":330},{"y":2025,"k":0,"fac":"Mentha & Allied Products Private Ltd.","fei":"3004293613","date":"2025-04-16","n":2,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mentha-allied-products-private-ltd-700242-04162025","t":"documentation practices and records.\n\nInadequate Electronic Data Controls\n\nYou failed to follow adequate controls for your computerized systems. For example, your computerized data backup procedure states that data is (b)(4) archived to a cloud server; however, data from the Agilent OpenLab Chromatographic Data System (CDS) was instead being archived (b)(4) to a second hard drive on the same computer. During the inspection, our investigators documented that the second hard drive was corrupted, and chromatographic data, obtained from February to September 2024, may have been affected.\n\nYou provided a document stating that the hard drive was sent to an external contractor for data recovery; however, you did not conduct a thorough investigation into this incident. Additionally, you failed to identify the specific data that may have been affected, including an evaluation of the potential imp","a":true,"b":true,"h":[[262,403]],"id":1122},{"y":2025,"k":0,"fac":"Taizhou Jingshang Cosmetics Technology Co., Ltd.","fei":"3014244255","date":"2025-04-02","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-jingshang-cosmetics-technology-co-ltd-701945-04022025","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records did not include complete data to support the analysis performed. For example, the electronic data generated by the gas chromatography system was not appropriately backed up to a separate storage location and appeared to have been deleted from the system. In addition, the paper records provided were illegible and lacked traceability to specific batches.\n\nReliability of data is compromised when there is a failure to maintain complete records of the conditions and data associated with all tests. Furthermore, the lack of complete data compromises the quality unit's (QU) ability to exercise its function of ensuring compliance to applicable standards.","a":false,"b":false,"h":[[298,423]],"id":1114},{"y":2025,"k":0,"fac":"NWL Netherlands Services B.V.","fei":"3003696942","date":"2025-04-01","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/nwl-netherlands-services-bv-701206-04012025","t":"and passwords, and laboratory staff had administrator rights allowing uncontrolled access to delete or modify high performance liquid chromatography (HPLC), gas chromatography (GC), and fourier transform infrared spectroscopy (FTIR) files. Furthermore, your firm did not adequately maintain backups of data generated by your laboratory equipment.\n\nIt is important to maintain strict control over CGMP electronic data to ensure that all additions, deletions, or modifications of information in your electronic records are authorized and appropriately documented. Without complete and accurate records, you cannot ensure your firm makes appropriate batch release, stability, and other decisions that are fundamental to ongoing assurance of drug product quality.\n\nIn your response, you state that your firm's quality lead will perform a (b)(4) review of software systems and data to confirm there have b","a":true,"b":true,"h":[[253,345]],"id":1071},{"y":2024,"k":0,"fac":"Outin Futures Corp.","fei":"3011572099","date":"2024-09-25","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/outin-futures-corp-684688-09252024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour laboratory equipment used to generate analytical data for finished drug product release lacked restricted access and sufficient controls. There is no assurance that your systems have the appropriate controls to prevent data deletion and record modifications. Specifically, electronic raw data used for release testing of batches (e.g., (b)(4) ) currently in the U.S. market was deleted and not accessible. Your firm did not adequately maintain backups of data generated by your laboratory equipment. In addition, your analysts had administrative rights for the chromatography data system capable of changing and deleting files and disabled audit trails for some of your chr","a":false,"b":true,"h":[[633,725]],"id":1474},{"y":2024,"k":1,"fac":"Biocon Biologics Limited","fei":"3003981475","date":"2024-07-26","n":4,"cfr":"","url":"https://www.fda.gov/media/181554/download","t":"(Grade A) on June 18, 2024,1 r -CbTC4 j l The ~ T(4k. 1cron count had a count of CbT particle compared to a um of Cb1141when the I (b)'{4Ytest was stopped after 2 minutes and 58 seconds. Review ofdata older than April 25, 2024, was not possible because data is not being backed up and had been c_:jNvPc overwritten. Similar NVPC tests that were stopped before completion were observed on F2- APC-0l. A risk assessment dated June 28, 2024, was performed by the data governance group and identified the potential for not reporting data in these systems. However, the assessment resulted in no action to review the source electronic data, rather it allowed the reliance on print outs. The assessment did not evaluate the need to back-up the electronic data. 4\n2. CE-SDS testing for[ ~s performed for release testing and occasional stability testing on instruments (b)'{ QC-Q8-Al-877 and QC-Q8:xf-\"876 th","a":true,"b":true,"h":[[253,280]],"id":5748},{"y":2024,"k":0,"fac":"Laboratorio Magnachem International","fei":"3003320065","date":"2024-06-18","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorio-magnachem-international-673796-06182024","t":"chromatography (HPLC) files. You had no mechanism to facilitate traceability of individuals who deleted or modified data generated by computerized systems. Your HPLC systems are used to test finished products at release and throughout stability. Furthermore, your firm did not adequately maintain backups of data generated by your laboratory equipment.\n\nIn your response, you claim you have identified a supplier for managing equipment data, and your HPLC management system is undergoing a (b)(4) evaluation by the supplier. You indicate you have a procedure to address data integrity concerns.\n\nYour response is inadequate. You fail to have interim measures describing the actions you have taken or will take to protect patients and to ensure the quality of your drugs, such a ke them vulnerable to undesirable microbiological contamination.\n\nIn your response, you attribute the humidity excursions to a defective dehumidifier but do not provide information on the steps taken to ensure that your dehumidifier and the overall conditions at your facility are maintained optimally. You also state that you reviewed your humidity monitoring data from January to December 2022, and concluded that there was no impact to the product because the (b)(4) and assay results for the affected batches were wi","a":true,"b":true,"h":[[258,279]],"id":2156},{"y":2022,"k":0,"fac":"Miami University Department of Chemistry and Biochemistry","fei":"3009095423","date":"2022-04-20","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/miami-university-department-chemistry-and-biochemistry-623494-04202022","t":"any user.\n\nThe (b)(4) and (b)(4) equipment were used by numerous people at the University, including faculty members and graduate students. All users shared one master login for the (b)(4) which allowed for full administrative access.\n\nThe (b)(4) raw data was not backed-up since CGMP testing began.\n\nThe software that runs the (b)(4) did not have an audit trail.\n\nThe Excel spreadsheet used to calculate spike recovery and final results for the (b)(4) analysis was uncontrolled.\n\nThe software that runs the (b)(4) and (b)(4) equipment was not validated.\n\nSample reprocessing was not formally documented, although your firm stated reprocessing did occur.\n\nIn (b)(4) analyses, peaks of interest in the spectrum were chosen (b)(4) and were not covered by an established procedure.\n\nIn your response, you stated that the \"data manipulation\" was associated with a single analyst whose \"motivation was exc","a":true,"b":true,"h":[[251,273]],"id":2667}],"CS-BKP-005":[{"y":2026,"k":0,"fac":"Laboratorios Jaloma S.A. de C.V.","fei":"3002600322","date":"2026-05-22","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorios-jaloma-sa-de-cv-725939-05222026","t":"the deletion or manipulation of your laboratory's electronic raw data. During the inspection, our investigators documented several chromatograph data files that could not be located in the storage folders on your GC computer. Your firm confirmed that you did not back up the electronic data located on the GC computer.\n\nIn your response, you state that you purchased a GC software package and will validate the GC system. You also commit to strengthening data controls for computer systems and software, enabling audit trails, and routinely backing up electronic data.\n\nYour response is inadequate because it fails to include a comprehensive impact assessment of the chromatography data that was discarded or lost from your GC computer. Your response does not explain how you ensure traceability of your CGMP electronic data files that have inaccurate time stamps and lack audit trail data. Furthermo","a":true,"b":true,"h":[[251,317]],"id":330},{"y":2025,"k":0,"fac":"Mentha & Allied Products Private Ltd.","fei":"3004293613","date":"2025-04-16","n":2,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mentha-allied-products-private-ltd-700242-04162025","t":"follow adequate controls for your computerized systems. For example, your computerized data backup procedure states that data is (b)(4) archived to a cloud server; however, data from the Agilent OpenLab Chromatographic Data System (CDS) was instead being archived (b)(4) to a second hard drive on the same computer. During the inspection, our investigators documented that the second hard drive was corrupted, and chromatographic data, obtained from February to September 2024, may have been affected.\n\nYou provided a document stating that the hard drive was sent to an external contractor for data recovery; however, you did not conduct a thorough investigation into this incident. Additionally, you failed to identify the specific data that may have been affected, including an evaluation of the potential impact on product quality.\n\nYour quality system does not adequately ensure the accuracy and ","a":true,"b":true,"h":[[255,500]],"id":1122}],"CS-CHG-003":[{"y":2026,"k":0,"fac":"ZIIP, Inc.","fei":null,"date":"2026-05-22","n":4,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ziip-inc-725870-05222026","t":"Failure to adequately establish and maintain procedures for design change as required by 21 CFR 820.30(i). Specifically,\n\nSOP-13, Design Controls, v. 2.0 and C, and SOP-14, Design Verification and Validation, v. 1.0, require design changes to be thoroughly reviewed for the need to repeat design verification and/or validation testing. However, your firm failed to properly document and evaluate design changes. For example: i. Eleven firmware revisions were made since May 2023, with inadequate documentation or supporting verifications or validations. ii. Build 28 (1.0.27), dated 9/13/2023: \"updated DAC Offset checks during programming\" regarding correct electrical current output, does not have evidence of being processed through DCN process and no evidence of evaluation for verification or validation. iii. Multiple builds entries state \"bug fixes\" with insufficient documentation to determin","a":false,"b":true,"h":[[428,552]],"id":248}],"CS-CHG-001":[{"y":2026,"k":0,"fac":"ZIIP, Inc.","fei":null,"date":"2026-05-22","n":4,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ziip-inc-725870-05222026","t":"Failure to adequately establish and maintain procedures for design change as required by 21 CFR 820.30(i). Specifically,\n\nSOP-13, Design Controls, v. 2.0 and C, and SOP-14, Design Verification and Validation, v. 1.0, require design changes to be thoroughly reviewed for the need to repeat design verification and/or validation testing. However, your firm failed to properly document and evaluate design changes. For example: i. Your App Revision History lists versions 2.0.1 through 3.6.2 with minimal detail, such as \"bug fixes,\" and provides no evidence that functional changes were processed through design change control, and no evidence of evaluation for verification or validation.\n\nii. The HALO Treatment Summary documents treatment protocol changes made in October 2025 with eight (8) treatments having name/artwork/video changes but these were not documented through change control or evalua","a":false,"b":true,"h":[[535,686]],"id":246},{"y":2026,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3005890633","date":"2026-03-30","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-721151-03302026","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour firm lacks controls to assure the integrity of electronic batch record data. Your quality assurance employee instructed your software vendor to make changes to your electronic batch record which were not captured in the audit trail or managed through your quality system.\n\nDuring the inspection, you provided written communication from a quality assurance employee to the software vendor that discussed multiple changes and modifications made to the electronic batch record. One of the changes included the replacement of an employee identification number with another employee number for \"Dispensed by\" in (b)(4) tablets USP (b)(4) mcg batch record (b)(4) . Th","a":false,"b":true,"h":[[388,509]],"id":390},{"y":2025,"k":0,"fac":"Contec Medical Systems Co., Ltd.","fei":"3006979678","date":"2025-10-02","n":2,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/contec-medical-systems-co-ltd-717941-10022025","t":"Failure to adequately establish and maintain procedures for validating the device design, as required by 21 CFR 820.30(g). For example: i. Two security risks were found in the B-Ultrasound Diagnostic testing and your firm failed to document the patch created to shut down the function of the ports as a deviation from the test plan.\n\nii. The Security Test Report for the Color Doppler Ultrasound Diagnostic System did not include Network Segmentation, Zone Boundary Protection, and General Purpose, person-to-person communication restriction testing as identified as required in the Test Plan.","a":false,"b":false,"h":[[212,331]],"id":718},{"y":2025,"k":0,"fac":"NeuroSync, Inc.","fei":null,"date":"2025-05-09","n":1,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/neurosync-inc-705489-05092025","t":"Failure to establish and maintain procedures to control the design of the device in order to ensure that specified design requirements are met, as required by 21 CFR 820.30(a). Specifically: b. You failed to identify, document, validate or where appropriate verify, review, and approve of design changes before their implementation, as required by 21 CFR 820.30(i). You did not implement your Design Controls, Software Design, Development and Maintenance Procedure, Section 6.7.iii, which requires that \"Changes are identified, documented, validated or where appropriate verified, reviewed, and approved prior to the implementation of the change.\" For example:","a":false,"b":false,"h":[[194,331]],"id":1083}],"CS-AUD-003":[{"y":2026,"k":0,"fac":"GC America, Inc.","fei":"1410097","date":"2026-05-14","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gc-america-inc-727602-05142026","t":"Your firm failed to establish adequate written responsibilities and procedures applicable to the quality control unit (21 CFR 211.22(d)).\n\nYour quality unit (QU) did not adequately oversee your drug manufacturing operations. For example, your QU failed to ensure adequate control of your analytical data. Our investigator documented an uncontrolled password for the (b)(4) meter affixed to a laptop by a sticker used for processing (b)(4) meter test results. In addition, the data from the (b)(4) meter is automatically deleted when the laptop is shutdown, so no records were available to show that your QU reviewed this data. Furthermore, you were unable to provide audit trails or an SOP describing oversight and retention requirements of electronic records. The lack of proper electronic record controls undermines the reliability and integrity of your laboratory data (21 CFR 211.68(b)).\n\nYour QU","a":false,"b":true,"h":[[640,759]],"id":339},{"y":2026,"k":0,"fac":"Ava Inc.","fei":"3008736380","date":"2026-04-14","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ava-inc-721180-04142026","t":"Your firm failed to establish an adequate quality control unit with the responsibility and authority to approve or reject all components, drug product containers, closures, in-process materials, packaging materials, labeling, and drug products (21 CFR 211.22(a)).\n\nYour quality unit (QU) did not provide adequate oversight for the manufacture, testing, and release of your drug products. For example:\n\nAnalysts frequently conducted trial injections. This practice is not scientifically sound. (21 CFR 211.160(b)).\n\nYour QU failed to perform investigations into OOS results obtained during trial injections. (21 CFR 211.192)\n\nYour QU failed to establish a written procedure to review audit trails and raw analytical data captured by analytical instruments to ensure data reliability for batch release (21 CFR 211.160(a)).\n\nWe also noted your procedure requires quality assurance personnel to have \"unb","a":false,"b":true,"h":[[625,799]],"id":369},{"y":2026,"k":1,"fac":"Staska Pharmaceuticals, Inc","fei":"3017473850","date":"2026-02-20","n":2,"cfr":"","url":"https://www.fda.gov/media/192261/download","t":"INDIV IDUAL TO WHOM REPORT ISSUED Lyndon R. Leitner, CEO\nFIRM NAME STREET ADDRESS Staska Pharmaceuticals, Inc . 742 Evergreen Dr CITY. STATE, ZIP CODE. COUNTRY TYPE ESTABLISHMENT lNSPECTEO Bennet, NE 68317 -2365 Outsourcing Facility A. Your firm does not have a written procedure requiring review of electronic raw data, audit trails, and system-generated records from HPLC analyses prior to batch release. Your Quality Control (QC) phannacist reviews only printed reports and manually verifies calculations, but does not review: • Electronic raw chromatograms • Integration events and manual integrations • Injection sequences and any deleted or repeated injections • Audit trails showing user activities, including data modifications or deletions • Metadata (e.g., user IDs, system configuration changes) Your firm's current practice of reviewing only printed summaries and recalculating results do","a":true,"b":true,"h":[[251,333]],"id":3185},{"y":2025,"k":0,"fac":"Wisconsin Pharmacal Company, LLC","fei":"2124143","date":"2025-08-22","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/wisconsin-pharmacal-company-llc-710329-08222025","t":"data system.\n\nDuring the review of analytical system audit trails for final release testing of finished OTC drug products, our inspection found that your firm does not review audit trails and raw analytical data captured by these analytical instruments. You do not have written procedures to review electronic data or integration to ensure data reliability for batch release.\n\nYour quality system does not adequately ensure the adequacy and integrity of data to support the safety, effectiveness, and quality of the drugs you manufacture. Without complete and accurate records, you cannot assure appropriate decisions regarding batch release, drug product stability, and other matters that are fundamental to ongoing assurance of quality.\n\nYour response acknowledges that your firm failed to appropriately set up the instrumentation software used for data collection and analysis of OTC drug products","a":true,"b":true,"h":[[254,374]],"id":800},{"y":2024,"k":0,"fac":"Indoco Remedies Limited","fei":"3005124189","date":"2024-12-16","n":5,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/indoco-remedies-limited-691594-12162024","t":"Your firm failed to establish an adequate quality unit and the responsibilities and procedures applicable to the quality control unit are not in writing and fully followed (21 CFR 211.22(a) and 211.22(d)).\n\nWarning and error messages in the Empower Message Center included in your chromatography data software are not reviewed. For example, during the 20-day period between December 26, 2023, and January 15, 2024, the following error messages were registered in the Empower Message Center: C. Approximately 18 instances of \"Stop Flow key was pressed\"\n\nThe procedures governing chromatography analyses do not require the review of all audit trail data. Your personnel were unaware of the requirement to review the Empower Message Center data in Plant (b)(4) analyses during the inspection. The error and warning messages in the Empower Message Center can be an indicator of problems with equipment an","a":false,"b":true,"h":[[553,651]],"id":1337},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":2,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"Your firm failed to establish laboratory controls that include scientifically sound and appropriate specifications, standards, sampling plans, and test procedures designed to assure that components, drug product containers, closures, in-process materials, labeling, and drug products conform to appropriate standards of identity, strength, quality, and purity (21 CFR 211.160(b)).\n\nYour firm did not have adequate procedures governing the collection, review, and integration of data generated through electronic systems. For example, your procedures did not require evaluation of electronic data which included reprocessed sample integration, aborted runs, single injection data, and electronic audit trails (when available). Accordingly, your QU failed to review this data. Further, manual integration is performed without a governing procedure.\n\nAdditionally, analysts routinely perform (b)(4) syst","a":false,"b":true,"h":[[534,724]],"id":1760},{"y":2023,"k":1,"fac":"Daizo Corporation","fei":"3008470621","date":"2023-11-06","n":2,"cfr":"","url":"https://www.fda.gov/media/185522/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in master production and control records or other records are instituted only by authorized personnel. Specifically, there are no written procedures to describe the review of audit trails associated with your (b) (4) gas chromatography software used to analyze products manufactured, including for the US market, to ensure this data has not been changed or deleted. According to interviews with the Quality Control personnel, audit trails are not reviewed.","a":false,"b":false,"h":[[223,283]],"id":4312},{"y":2023,"k":1,"fac":"Oishi Koseido Co., Ltd.","fei":"3010166685","date":"2023-09-01","n":2,"cfr":"","url":"https://www.fda.gov/media/185549/download","t":"there we remarks as to the reason why they were deleted. The QC Supervisor noted that when the sequences are deletedprior to the acquisition of data no remark orjustification is required, however these instmctions are not specified in an SOP. I also noted SOP DM4710I used for review of audit trails is not comprehensive and does not include instmctions on how to perform audit trail reviews for the different electronic systems such as Empower, Lab Solutions, and TrapeziumX. e) On 8/29/23, during the walkthrough of your QC laboratory, I observed that the analyst who 4 performed the identity test for raw materialE ) control numberr> (4 ) :repeated the test three times without justification ana approval. I asked the QC Manager Y.T. if she performed reviewed ofaudit trails for the FTIR data and the answer was no. 6 4 f) SOP PZTL9021 , effective 12/24/21 used for the operation off >< > IGPD700 ","a":true,"b":true,"h":[[250,299]],"id":4449},{"y":2023,"k":0,"fac":"Medgel Private Limited","fei":"3010165392","date":"2023-07-20","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/medgel-private-limited-654085-07202023","t":"support batch release (e.g., you had destroyed microbiological plates before recording the data).\n\nAppropriate data integrity controls (e.g., your QU failed to adequately restrict access to analytical instruments; you used shared usernames and passwords).\n\nProcedures for review of raw data and audit trails.\n\nIn your response, you state that you revised your procedures with additional instructions for issuing and disposing CGMP documents. You attribute the root cause of the non-contemporaneous documentation to human error and instituted a second person check for microbiological testing and data recording. You also commit to reviewing audit trails and retraining your analysts.\n\nYour response was inadequate because it lacked details on how your QU would oversee the implementation of the CAPAs and check their effectiveness. Furthermore, the CAPAs were specific to the examples FDA noted durin","a":true,"b":true,"h":[[257,307]],"id":2157},{"y":2022,"k":1,"fac":"Catalent Belgium SA","fei":"3007647000","date":"2022-08-19","n":5,"cfr":"","url":"https://www.fda.gov/media/162470/download","t":"Input to and output from the computer are not checked for accuracy. __ Specifically, you are not performing electronic data review on raw electronic data generated by the computerized system. For example, HPLC, UPLC, IR and UV-Vis are used in the QC laboratory for analysis of the raw materials and finisheddmgproducts samples. Your do not have a procedure for electronic data review and reviewofaudit trails and your QC reviewer stated that she never visits the QC instruments to review analytical data or audit trails on the instrnment. She confnmedthat she only performs paper review of the printed test data which are provided to her by QC analysts.","a":false,"b":false,"h":[[336,408]],"id":4856},{"y":2022,"k":0,"fac":"Jost Chemical Co.","fei":"3001239108","date":"2022-07-18","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/jost-chemical-co-626894-07182022","t":"Failure to exercise sufficient controls over computerized systems to prevent unauthorized access or changes to data, and failure to establish and follow written procedures for the operation and maintenance of your computerized systems.\n\nYou have insufficient controls over CGMP data. For example:\n\n• You lacked unique passwords for laboratory instruments used to generate analytical data for finished API products.\n\n• Your analytical systems lacked controls to prevent users from deleting electronic data.\n\n• You lacked procedures governing the review of audit trails of both production and laboratory equipment by your QU.\n\n• You lacked procedures or controls for critical alarms for your production process.\n\nYour response is inadequate. You propose to issue unique passwords and establish an audit trail and review procedure. Your response does not include interim control measures and procedural ","a":false,"b":true,"h":[[513,567]],"id":2630}],"CS-CLD-004":[{"y":2026,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3005890633","date":"2026-03-30","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-721151-03302026","t":"not initiate a deviation upon finding discrepancies or why the batch record contained no comments or remarks about the employee identification change. Additionally, your retrospective review of email requests to software vendors for data changes did not include an assessment of communications with other software vendors such as (b)(4) .\n\nIn response to this letter, provide the following:\n\nA retrospective review of all software related communications and correlated audit trail between your Intas Dehradun facility and software support vendors. Provide any updated deviations and related CAPA reports.\n\nA product impact assessment for identified communications related to changes in batch record data and process parameters.\n\nEffectiveness checks for the CAPAs implemented in your \"Data Integrity Risk Assessment\" of software applications, conducted by third party consultants in 2024.\n\nPerformanc","a":true,"b":true,"h":[[250,321]],"id":390},{"y":2025,"k":0,"fac":"Exactech, Inc. dba Advita Ortho","fei":null,"date":"2025-12-19","n":4,"cfr":"21 CFR 820.70","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/exactech-inc-dba-advita-ortho-720250-12192025","t":"product, and services conform to specified requirements, as required by 21 CFR 820.50. For example, your firm failed to follow the procedures for Supplier Quality Management, 701-103-077, Rev AH, dated 10/31/2023. The FDA investigators noted that (b)(4) ., the sole supplier of critical (b)(4) powder, has not received a required on-site audit per Supplier Quality Management Procedure Section 5, Step F, Item 2.C. The last supplier evaluation was conducted in September 2020, with no reevaluation when current procedures were implemented in October 2023. Additionally, there is no signed quality agreement as required per the procedure Section V, Step C, item 4.\n\nYour firm's pFMEAs for the (b)(4) molded products document considers the raw (b)(4) powder, a critical component of the processing and quality of the finished devices. In the Process FMEA Process Failure Mode and Effects Analysis (b)(4","a":true,"b":true,"h":[[257,413]],"id":469},{"y":2025,"k":0,"fac":"Avertix Medical, Inc.","fei":null,"date":"2025-09-03","n":6,"cfr":"21 CFR 820.50","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/avertix-medical-inc-711080-09032025","t":"7.1.12 of Supplier Management Procedure, Rev K, states that \"Quality Assurance is responsible for revising the Approved Supplier List with changes made based on acceptance/rejection of potential suppliers/re-evaluated suppliers/deactivated suppliers...\" A software supplier used by your firm since 2023 to meet the requirements of the Medical Device Tracking regulation was not listed on your Approved Supplier List (Rev L, dated June 15, 2023).\n\nWe reviewed your firm's responses and conclude that they are not adequate. In the responses, your firm promises and provided revisions to your Supplier Management Procedure (Document 1703-003) removing the requirement for (b)(4) for your contract manufacturer and to evidence of a new supplier evaluation for the software supplier utilized for medical device tracking by July 1, 2025. The responses do not indicate if other supplier evaluations will be ","a":true,"b":true,"h":[[254,444]],"id":453},{"y":2025,"k":0,"fac":"NeuroSync, Inc.","fei":null,"date":"2025-05-09","n":3,"cfr":"21 CFR 820.50","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/neurosync-inc-705489-05092025","t":"Failure to establish and maintain procedures to ensure that all purchased or otherwise received product and services conform to specified requirements, as required by 21 CFR 820.50. You have not implemented your Supplier Management Procedure, SOP-10025, Rev 004. Specifically: b. Your software vendor who supplies the sensor which is placed in the Eye Tracker is not listed on your firm's Approved Supplier List and has not been approved or evaluated as per your procedure.\n\nWe reviewed your firm response dated February 27, 2025, and concluded that it is not adequate. You have not provided documentation that the above vendors have successfully completed evaluations as per your procedures.","a":false,"b":false,"h":[[280,472]],"id":1091}],"CS-AUD-005":[{"y":2026,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3005890633","date":"2026-03-30","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-721151-03302026","t":"multiple changes and modifications made to the electronic batch record. One of the changes included the replacement of an employee identification number with another employee number for \"Dispensed by\" in (b)(4) tablets USP (b)(4) mcg batch record (b)(4) . The change was not recorded in the audit trail, nor was it noted in the electronic batch record. Additionally, your firm lacked detailed procedural controls to assure the integrity of electronic batch record data when modifications are made after completion of the batch record.\n\nIn your response, you indicate that the changes the software vendor made in the electronic batch record corrected inaccuracies only. You state your requests to software vendors to modify data have been terminated. You commit to conducting formal interviews with employees who contacted the vendors to request the data changes and to initiating deviation investigat","a":true,"b":true,"h":[[256,351]],"id":390},{"y":2024,"k":0,"fac":"MMC Healthcare Ltd.","fei":"3014773352","date":"2024-09-24","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mmc-healthcare-ltd-684644-09242024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour ultraviolet-visible (UV-Vis) spectrophotometer computer system lacked appropriate controls to assure the integrity of electronic test data, such as an audit trail and defined user access levels. This UV-Vis system was used for release testing of drug product batches.\n\nIn your response, you state that you \"would like to update the UV/Vis [sic] software\" to be compliant and provide a quote for new software.\n\nYour response is inadequate because it does not provide sufficient details describing:\n\n• Timeframe for your corrective action. • Security features of your updated UV-Vis computer system. • User access levels, access privileges, or authorized users to perform the","a":false,"b":true,"h":[[290,389]],"id":1485},{"y":2024,"k":0,"fac":"Laboratorio Magnachem International","fei":"3003320065","date":"2024-06-18","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorio-magnachem-international-673796-06182024","t":"data deletion and record modifications. For example, you did not establish unique usernames and passwords and laboratory staff had administrator rights allowing uncontrolled access to delete or modify high performance liquid chromatography (HPLC) files. You had no mechanism to facilitate traceability of individuals who deleted or modified data generated by computerized systems. Your HPLC systems are used to test finished products at release and throughout stability. Furthermore, your firm did not adequately maintain backups of data generated by your laboratory equipment.\n\nIn your response, you claim you have identified a supplier for managing equipment data, and your HPLC management system is undergoing a (b)(4) evaluation by the supplier. You indicate you have a procedure to address data integrity concerns.\n\nYour response is inadequate. You fail to have interim measures describing the a","a":true,"b":true,"h":[[254,379]],"id":1670},{"y":2024,"k":0,"fac":"Landy International","fei":"3005698871","date":"2024-06-12","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/landy-international-679066-06122024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour stand-alone gas chromatogram (GC) computer system lacked appropriate controls, such as an audit trail and individual log-in access to prevent the deletion of data. For example, investigators found numerous analysis reports, test methods, raw data calibration, and system directories in the GC computer's recycling bin. Additionally, your laboratory personnel used a shared password, located in an unsecured drawer, to access the GC software.\n\nIn your response, you state \"21 CFR 211.68 was not fully understood,\" that you will conduct training, and conduct a retrospective review of deleted files and records. You will also contact the supplier of the software to upgrade, ","a":false,"b":true,"h":[[277,389]],"id":1689},{"y":2023,"k":1,"fac":"Oishi Koseido Co., Ltd.","fei":"3010166685","date":"2023-09-01","n":2,"cfr":"","url":"https://www.fda.gov/media/185549/download","t":"why they were deleted. The QC Supervisor noted that when the sequences are deletedprior to the acquisition of data no remark orjustification is required, however these instmctions are not specified in an SOP. I also noted SOP DM4710I used for review of audit trails is not comprehensive and does not include instmctions on how to perform audit trail reviews for the different electronic systems such as Empower, Lab Solutions, and TrapeziumX. e) On 8/29/23, during the walkthrough of your QC laboratory, I observed that the analyst who 4 performed the identity test for raw materialE ) control numberr> (4 ) :repeated the test three times without justification ana approval. I asked the QC Manager Y.T. if she performed reviewed ofaudit trails for the FTIR data and the answer was no. 6 4 f) SOP PZTL9021 , effective 12/24/21 used for the operation off >< > IGPD700 does not identify critical alarms ","a":true,"b":true,"h":[[253,307]],"id":4449},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":4,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"Your 2018 Process Equipment Assessment Report identified numerous gaps and deficiencies for electronic manufacturing equipment needing upgrades in access controls, audit trails, saving electronic data and preventing clock alterations. You had not documented closures of these corrective action and preventive action (CAPA) measures to support data integrity in your computerized systems. Your QA department had not performed a similar assessment in your QC laboratories.\n\nIn your response, you acknowledge the inspection findings and you reference your standard operating procedure titled, \"Data Integrity,\" which stipulates the individuals permitted to make changes in an electronic record and requires audit trails to capture those actions. You also commit to obtaining expertise from a qualified consultant to systematically address the deviations, as part of the baseline assessment.\n\nYour respon"
