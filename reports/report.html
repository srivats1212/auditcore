fac":"Reliance Life Sciences Private Limited","fei":"3009510975","date":"2026-08-18","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/reliance-life-sciences-private-limited-730801-08182026","t":"and deprives you of the ability to adequately investigate deviations.\n\nInadequate Electronic Records Controls\n\nYour firm did not have adequate controls to prevent the deletion or overwriting of (b)(4) integrity testing electronic data. Specifically, reports were not saved with unique file names, resulting in data being overwritten after every (b)(4) tests. In addition, (b)(4) integrity testing was not performed for Plant (b)(4) . Therefore, your firm has no means of tracking or retrieving records of failed leak tests. The lack of adequate electronic records controls undermines the reliability and integrity of your laboratory data.\n\n(b)(4) integrity is critical to preventing product contamination. Routine (b)(4) integrity tests should be performed. The monitoring and maintenance program should identify and eliminate any (b)(4) lacking integrity and minimize the possibility of placing a st","a":true,"b":true,"h":[[250,357]],"id":144},{"y":2026,"k":0,"fac":"Zydus Lifesciences Limited","fei":"3005430968","date":"2026-06-02","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/zydus-lifesciences-limited-722576-06022026","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products are manufactured in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) did not effectively exercise its authority to ensure appropriate testing is conducted. Your records submitted for talc identification testing by IR spectroscopy show that an out-of-specification (OOS) wavenumber result was removed from an infrared instrument report and multiple passing wavenumbers were added. These changes allowed a failing identification test to appear as if it met release specifications. Your QU failed in its responsibility to maintain data integrity and provide adequate oversight of testing procedures, demonstrating a lack of authority and control over critical quality decisions. Furthermore, a review of all submit","a":false,"b":true,"h":[[470,488]],"id":318},{"y":2026,"k":0,"fac":"Laboratorios Jaloma S.A. de C.V.","fei":"3002600322","date":"2026-05-22","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorios-jaloma-sa-de-cv-725939-05222026","t":"data file creation and modification dates were not accurate.\n\nAdditionally, you did not have proper controls in place to prevent the deletion or manipulation of your laboratory's electronic raw data. During the inspection, our investigators documented several chromatograph data files that could not be located in the storage folders on your GC computer. Your firm confirmed that you did not back up the electronic data located on the GC computer.\n\nIn your response, you state that you purchased a GC software package and will validate the GC system. You also commit to strengthening data controls for computer systems and software, enabling audit trails, and routinely backing up electronic data.\n\nYour response is inadequate because it fails to include a comprehensive impact assessment of the chromatography data that was discarded or lost from your GC computer. Your response does not explain how","a":true,"b":true,"h":[[252,353]],"id":330},{"y":2025,"k":1,"fac":"Park Avenue Compounding","fei":"1972829","date":"2025-09-23","n":8,"cfr":"","url":"https://www.fda.gov/media/190024/download","t":"with each batch record release ( complaints, deviations, recalls, non-conformances). However, your firm does not have any written procedures for electronic reviews and has not performed any electronic audit trails to track the creation, modification, or deletion ofsuch data to date. C. Your firm' s control documents, such as environmental and personnel AMENDMENTl monitoring result forms, visual inspection result forms are accessible for unlimited printing, without any means of reconciliation (i.e. no date/time-stamp) by non-QC personnel. In addition, your firm's managment stated your employee has reprinted at least one form instead of adhering to Good Documentation Practices. *DATES OF INSPECTION 9/l 1/2025(Thu), 9/12/2025(Fri), 9/l 5/2025(Mon), 9/16/2025(Tue ), 9/l 7/ 2025(Wed), 9/l 8/2025(Thu), 9/19/2025(Fri), 9/22/2025(Mon), 9/23/2025(Tue) Saral\\M Ga!S'la X M~Ul'aclu\"1~Compou1~~0te/ty","a":true,"b":true,"h":[[254,274]],"id":3375},{"y":2025,"k":0,"fac":"Chromatography Institute of America dba Compounder’s International Analytical Laboratory","fei":"3012069146","date":"2025-08-20","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/chromatography-institute-america-dba-compounders-international-analytical-laboratory-708944-08202025","t":"Lack of adequate Quality Unit oversight\n\nYour Quality Unit (QU) failed to exercise adequate oversight over your contract testing operations. For example, your QU failed to ensure:\n\nEstablishment of restricted access and appropriate controls on computerized systems to prevent any potential alteration or deletion of laboratory data.\n\nImplementation of an effective document control system for issuance, tracking, and reconciliation of CGMP documents used for laboratory testing and analysis.\n\nReview and approval of an uncontrolled document, \"Sample Prep Tips and Tricks,\" used by laboratory staff for preparation of analytical samples.\n\nIn your response you state that moving forward, you will create individual logins on your computers, and you are looking into installing technology with audit trail capability. Further, you state that you will create templates for your forms and bind them into a","a":false,"b":true,"h":[[304,331]],"id":803},{"y":2025,"k":0,"fac":"Taizhou Jingshang Cosmetics Technology Co., Ltd.","fei":"3014244255","date":"2025-04-02","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/taizhou-jingshang-cosmetics-technology-co-ltd-701945-04022025","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records did not include complete data to support the analysis performed. For example, the electronic data generated by the gas chromatography system was not appropriately backed up to a separate storage location and appeared to have been deleted from the system. In addition, the paper records provided were illegible and lacked traceability to specific batches.\n\nReliability of data is compromised when there is a failure to maintain complete records of the conditions and data associated with all tests. Furthermore, the lack of complete data compromises the quality unit's (QU) ability to exercise its function of ensuring compliance to applicable standards.","a":false,"b":false,"h":[[428,473]],"id":1114},{"y":2024,"k":0,"fac":"Viatris, Inc.","fei":"3010453141","date":"2024-12-19","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/viatris-inc-690897-12192024","t":"expanded your investigations, which identified that the facility's Site Head of Quality, Head of Quality Control, Head of Quality Assurance, Head of Investigations, and the Manager responsible for the packaging materials laboratory had violated your data integrity policies and were removed from your organization.\n\nYour response is inadequate. It fails to provide sufficient details regarding the extent of the identified data integrity issues, and the thoroughness of your proposed corrective and preventive actions (CAPAs) is unclear.\n\nIn subsequent communications following the inspection, you disclosed that both your site and global quality organization became aware of the data integrity issues related to component testing in January 2024. FDA is concerned that you did not adequately investigate or begin to implement holistic corrective actions until after the subsequent FDA inspection.\n\nI","a":true,"b":true,"h":[[250,290]],"id":1345},{"y":2024,"k":0,"fac":"Outin Futures Corp.","fei":"3011572099","date":"2024-09-25","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/outin-futures-corp-684688-09252024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour laboratory equipment used to generate analytical data for finished drug product release lacked restricted access and sufficient controls. There is no assurance that your systems have the appropriate controls to prevent data deletion and record modifications. Specifically, electronic raw data used for release testing of batches (e.g., (b)(4) ) currently in the U.S. market was deleted and not accessible. Your firm did not adequately maintain backups of data generated by your laboratory equipment. In addition, your analysts had administrative rights for the chromatography data system capable of changing and deleting files and disabled audit trails for some of your chr","a":false,"b":true,"h":[[500,631]],"id":1474},{"y":2024,"k":0,"fac":"Landy International","fei":"3005698871","date":"2024-06-12","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/landy-international-679066-06122024","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour stand-alone gas chromatogram (GC) computer system lacked appropriate controls, such as an audit trail and individual log-in access to prevent the deletion of data. For example, investigators found numerous analysis reports, test methods, raw data calibration, and system directories in the GC computer's recycling bin. Additionally, your laboratory personnel used a shared password, located in an unsecured drawer, to access the GC software.\n\nIn your response, you state \"21 CFR 211.68 was not fully understood,\" that you will conduct training, and conduct a retrospective review of deleted files and records. You will also contact the supplier of the software to upgrade, ","a":false,"b":true,"h":[[373,389]],"id":1689},{"y":2023,"k":1,"fac":"Eugia US Manufacturing LLC","fei":"3015534630","date":"2023-12-22","n":5,"cfr":"","url":"https://www.fda.gov/media/175809/download","t":"Input to and output from the computer and records or data are not checked for accuracy. Specifically, On 12/15/2023. uoon review of the NetSCADA computer application, used to ooerate~b}l.iJ) ~n4 , lcvcle rnns associated to Il>J <41 7 ~bihit_batchLes.i''u' P/ (Ib )(4 ) las well as ~·6 ><4• > associated to I ' ' b ) .iJ) (b) (4) I exhibit batches i<b)<4 > re not available on the NetSCADA 4 sy1;tem uoon auerv. However on 12/19/2023, data for thd bH > l and stopJ)ering cycle rnns for I (b) <4 > exhibit batches ~6 ><4 > ne same location previously reviewed/queried. As of 12/22/2023, it is unclear how this data were acquired in this system and whether or not there are controls in place to avoid the addition or deletion of data.","a":false,"b":false,"h":[[714,730]],"id":4245},{"y":2023,"k":1,"fac":"Suzhou Suncadia Biopharmaceuticals Co., Ltd.","fei":"3015786877","date":"2023-12-14","n":10,"cfr":"","url":"https://www.fda.gov/media/186008/download","t":"Appropriate designs to ensure that complete data derived from all tests necessary to assure compliance with established specifications and standards are not included in the laboratory records. Specifically, 4 A total of[ (bY{ ~icrosoft (MS) excel spreadsheet templates are used to perfonn calculations for your QC release testing, stability testing, and biological potency testing. Observed are the following: A) All templates are kept in one document folder. B) No system security is defined. QC personnel cao open all templates. C) Usemame and password protection and restriction to the templates are not established. D) At:ler data entry and calculation, an electronic copy containing original data entries was deleted. Only paper printout copy is kept and included as part of the laboratory reports. E) No audit trail functions are enabled for the spreadsheet templates. EMPLOi.E{!S ?nJR l• EMPLO","a":false,"b":true,"h":[[688,721]],"id":4264},{"y":2023,"k":1,"fac":"FirstCham Co., Ltd.","fei":"3010970108","date":"2023-10-27","n":3,"cfr":"","url":"https://www.fda.gov/media/182102/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in master production and control records or other records are instituted only by authorized personnel. Specifically, The following discrepancies were identified during a review of your Chrozen HPLC and YL-Clarity version 8.1.0.77 chromatography software: -The computer used to operate the HPLC lacks security controls to prevent modification and deletion of files. For example, there were 11,567 files in the recycle bin on this computer, which included, but were not limited to, CAL chromatography, MET chromatography, PRM chromatography, and SEQ chromatography file types. -The chromatography raw data is saved locally on the computer, which is not backed up. -The computer used for the HPLC does not require user login for the Windows operating system or the YL-Clarity chromatography software. -The Y","a":false,"b":true,"h":[[442,459]],"id":4321},{"y":2022,"k":0,"fac":"Fagron Group B.V.","fei":"1000174332","date":"2022-06-14","n":1,"cfr":"21 CFR Part 11","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/fagron-group-bv-624255-06142022","t":"unit (QU) failed to perform several critical functions to ensure that the API you repackage and distribute meets CGMP requirements. For example, investigators observed computers connected to CGMP-related laboratory equipment that allowed changes to or deletion of data generated to support the release of drugs without restriction.\n\nIn addition, during the inspection you acknowledged that your QU did not qualify the contract laboratories you used to support product release due to resource issues. This is a repeat observation from your 2017 inspection.\n\nIn your response, you stated you will evaluate and implement the necessary actions to ensure that your equipment used in CGMP-related operations is compliant with 21 CFR Part 11. We acknowledge your commitment to qualify your contract laboratories and immediately hire additional QU personnel to support supplier qualification.\n\nYour response ","a":true,"b":true,"h":[[252,268]],"id":5666},{"y":2022,"k":0,"fac":"Vi-Jon, LLC","fei":"1941150","date":"2022-03-31","n":4,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/vi-jon-llc-622087-03312022","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in the master production and control records, or other records (21 CFR 211.68(b)).\n\nYour firm failed to implement adequate controls to support the integrity of your electronic data and to ensure that only appropriate individuals had administrative rights. For example, your (b)(4) microbiological testing instrument used for drug product release testing is controlled by a stand-alone computer which does not have appropriate controls in place to prevent deletion of raw laboratory data. All QU users utilized a shared generic account to access the computer which had administrative privileges capable of changing and deleting files. During the inspection, one of your employees opened the computer's recycle bin and noted that approximately (b)(4) files and","a":false,"b":true,"h":[[597,628]],"id":2698},{"y":2022,"k":0,"fac":"Accu Bio-Chem Laboratories","fei":"3004876794","date":"2022-02-24","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/accu-bio-chem-laboratories-619450-02242022","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nThe electronic data systems that you use to generate drug product results lack appropriate controls. There is no assurance that your systems have the appropriate controls to prevent deletion of data and record all modifications to data. For example, electronic data files generated from your (b)(4) system, used for identity testing of drug products, could be deleted. In addition, the (b)(4) that controls your high-performance liquid chromatography and gas chromatography systems for testing the actives in OTC drug products did not have all appropriate audit trails enabled to record significant changes.\n\nIn your response, you stated that you have contacted the equipment an","a":false,"b":true,"h":[[404,420]],"id":2739},{"y":2021,"k":0,"fac":"Sanitor Corporation","fei":"3005871025","date":"2021-11-29","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/sanitor-corporation-616232-11292021","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour (b)(4) Fourier Transform Infrared (FTIR) Spectroscopy computerized system did not have appropriate controls in place to prevent deletion of raw laboratory data. Specifically, this data is used to create an internal certificate of analysis to release drug components for drug product manufacturing. Further, you did not have appropriate password protection of your software to prevent unauthorized access to data.\n\nIn your response, you stated that you have password-protected the software for the FTIR system and only the chemist has access to the data. You also stated that the FTIR data is backed up (b)(4) to an external hard drive and a copy is printed and included as ","a":false,"b":true,"h":[[355,386]],"id":2804}],"CS-INF-003":[{"y":2026,"k":0,"fac":"Reliance Life Sciences Private Limited","fei":"3009510975","date":"2026-08-18","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/reliance-life-sciences-private-limited-730801-08182026","t":"located in incubators during the inspection. Colony forming unit (cfus) counts had been recorded as if incubation was actively in progress. In interviews conducted by your management, your analysts confirmed these samples were not collected.\n\nIn addition, your Laboratory Information Management System (LIMS) did not include a dilution factor to calculate the number of cfus per gram or milliliter of product for microbial limit test results, as required by your own procedures and applicable compendial methods. By releasing drug products based solely on raw plate count averages entered into your LIMS without applying the required dilution factor, you lack scientific evidence that each batch conforms to predetermined specifications prior to distribution. Appropriate testing is an essential part of ensuring that the drug products you manufacture conform to CGMP.\n\nCollectively, these deficienci","a":true,"b":true,"h":[[256,441]],"id":144}],"CS-VAL-001":[{"y":2026,"k":0,"fac":"Reliance Life Sciences Private Limited","fei":"3009510975","date":"2026-08-18","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/reliance-life-sciences-private-limited-730801-08182026","t":"located in incubators during the inspection. Colony forming unit (cfus) counts had been recorded as if incubation was actively in progress. In interviews conducted by your management, your analysts confirmed these samples were not collected.\n\nIn addition, your Laboratory Information Management System (LIMS) did not include a dilution factor to calculate the number of cfus per gram or milliliter of product for microbial limit test results, as required by your own procedures and applicable compendial methods. By releasing drug products based solely on raw plate count averages entered into your LIMS without applying the required dilution factor, you lack scientific evidence that each batch conforms to predetermined specifications prior to distribution. Appropriate testing is an essential part of ensuring that the drug products you manufacture conform to CGMP.\n\nCollectively, these deficienci","a":true,"b":true,"h":[[256,477]],"id":144},{"y":2026,"k":0,"fac":"Nipro Renal Solutions USA, Corporation","fei":null,"date":"2026-07-24","n":7,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/nipro-renal-solutions-usa-corporation-732874-07242026","t":"Failure to document procedures for validation of processes for production and service provisions, as required by ISO 13485:2016, Clause 7.5.6.\n\nSpecifically, your firm does not have a documented procedure for validation of processes for production equipment. Your work instruction NRSU-WI-0029 'Validated Systems and Equipment Change' (Revision 00, Effective Date 07/12/2021), was provided as the sole document governing validation. This work instruction does not include all the requirements found within sections a) through g) of Clause 7.5.6.\n\nAdditionally, your firm was unable to provide documentation that your (b)(4) (serial number (b)(4) ), which is used for endotoxin monitoring of (b)(4) and final product release was validated as the only document provided was a combined Installation, Operational, and Performance Qualification (IOPQ) test results from December 15 and 18, 2023. This docu","a":false,"b":true,"h":[[561,737]],"id":171},{"y":2026,"k":0,"fac":"Linemaster Switch Corporation","fei":null,"date":"2026-05-27","n":5,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/linemaster-switch-corporation-730215-05272026","t":"Failure to document procedures for the validation of the application of computer software used for the monitoring and measurement of requirements, as required by ISO 13485:2016, Clause 7.6\n\nSpecifically, b. Your firm has not adequately validated the (b)(4) to prevent calibration drift of the (b)(4) , foot pedal accessory. As noted above, your firm identified an issue with (b)(4) in your Request for Engineering Assistance (REA) #20130763, dated September 26, 2013. However, the referenced validation document, TM-83 Rev A \"997-P46 Firmware Validation Product: (b)(4) ,\" did not include:\n\nTesting at multiple temperatures or temperature ranges\n\nCorrelation between temperature and sensor output\n\nDemonstration that (b)(4) maintains calibration accuracy across temperature variations\n\nRaw data showing (b)(4) performance\n\nStatistical analysis of (b)(4) effectiveness\n\nPass/fail criteria specific to ","a":false,"b":true,"h":[[207,322]],"id":223},{"y":2025,"k":0,"fac":"Hong Qiangxing Shenzhen Electronics Limited","fei":null,"date":"2025-10-28","n":1,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/hong-qiangxing-shenzhen-electronics-limited-718112-10282025","t":"Failure to establish and maintain procedures to control the design of the devices to ensure that specified design requirements are met, as required by 21 CFR 820.30(a). Specifically: a) Failure to adequately validate device software, as required by 21 CFR 820.30(g). Your firm failed to adequately verify and validate the operating software for the TENS and PMS Model SM9109A.\n\nThis is a repeat violation from the July 2016 inspection.\n\nWe reviewed your firm's August 21, 2025, September 26, 2025, and October 8, 2025, responses and conclude that they are not adequate. In these responses, your firm provided a corrective and preventive action (CAPA) report. The report identified the root causes as 1) lack of specific inspection and confirmation of the software during the burning process, and 2) lack of establishment of control procedures for the software burning process.\n\nYour firm identified C","a":false,"b":true,"h":[[186,375]],"id":621},{"y":2025,"k":0,"fac":"Contec Medical Systems Co., Ltd.","fei":"3006979678","date":"2025-10-02","n":2,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/contec-medical-systems-co-ltd-717941-10022025","t":"Failure to adequately establish and maintain procedures for validating the device design, as required by 21 CFR 820.30(g). For example: A. Test plans created to validate device software designs do not ensure validation testing is performed under adequately defined operating conditions. For example, test plans do not include established acceptance criteria prior to testing.","a":false,"b":false,"h":[[139,285]],"id":716},{"y":2025,"k":0,"fac":"Uscom Kft","fei":null,"date":"2025-07-30","n":1,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/uscom-kft-708491-07302025","t":"Failure to adequately establish and maintain procedures for validating the device design. Design validation shall be performed under defined operating conditions on initial production units, lots, or batches, or their equivalents. Design validation shall ensure that devices conform to defined user needs and intended uses and shall include testing of production units under actual or simulated use conditions. In addition, design validation shall include software validation and risk analysis, where appropriate, as required by 21 CFR 820.30(g).\n\nSpecifically, your firm failed to validate the current SpiroSonic Mobile Software V1.16 that is intended to be used with SpiroSonic AIR. There is no documented rationale for the decision.\n\nWe reviewed your firm's February 19, 2025 and March 31, 2025 responses and conclude that the adequacy cannot be determined at this time. Your firm developed a proc","a":false,"b":true,"h":[[572,629]],"id":806},{"y":2024,"k":0,"fac":"Rolence Ent. Inc.","fei":null,"date":"2024-10-18","n":5,"cfr":"21 CFR 820.70","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/rolence-ent-inc-695010-10182024","t":"Failure to validate computer software for its intended use according to an established protocol, as required by 21 CFR 820.70(i). For example, your firm has not validated the (b)(4) software (software application for X-ray quality control) used to perform the final tests of Portable X-ray Systems (i.e., tube voltage, exposure time, exposure, exposure rate, etc.) for its intended use according to an established protocol.\n\nWe reviewed your firm's response dated July 12, 2024, and conclude that it is not adequate. Your response stated that you already have a process to conduct, control, and monitor production processes, and this was not provided during inspection. You also stated that you will update your software quality control procedure. However, you did not provide any supporting documentation for our evaluation. Also, your response did not include a retrospective review of production p","a":false,"b":true,"h":[[143,422]],"id":1428},{"y":2024,"k":0,"fac":"Micro-X Ltd.","fei":null,"date":"2024-09-10","n":2,"cfr":"21 CFR 820.30","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/micro-x-ltd-692084-09102024","t":"Failure to establish and maintain procedures for validating the device design, as required by 21 CFR 820.30(g). Specifically, your firm failed to validate the use and integration of the (b)(4) software and (b)(4) panels used in the Micro-X Rover Mobile X-ray System MXU-RV71. Your firm failed to document justification for the decision not to validate.\n\nWe reviewed your firm's response and conclude that it is not adequate. In your response, you plan to update the validation plan for MXU-RV71; however, documentation of validation has yet to be provided. Additionally, your response does not include a retrospective review of other design documentation to ensure all designs have been adequately validated.","a":false,"b":false,"h":[[136,201]],"id":1436},{"y":2024,"k":0,"fac":"Wissner-Bosserhoff GmbH","fei":null,"date":"2024-08-30","n":1,"cfr":"21 CFR 820.72","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/wissner-bosserhoff-gmbh-690242-08302024","t":"Failure to ensure that all inspection, measuring, and test equipment, including mechanical, automated, or electronic inspection and test equipment, is suitable for its intended purposes and is capable of producing valid results, as required by 21 CFR 820.72(a).\n\nFor example: Software validation activities and results for computer or automated data processing systems used as part of the quality system have not been documented.\n\nSpecifically, the (b)(4) Test Station, an electrical-function test, uses software (b)(4) ; however, the software was not affiliated with an equipment qualification report that includes a software validation report to ensure proper function of this quality control test tool. The (b)(4) Test Station is used as part of the final acceptance testing of electrical components for the nursing beds prior to the release for distribution.\n\nYour response dated May 15, 2024, is","a":false,"b":true,"h":[[276,428]],"id":1566},{"y":2023,"k":1,"fac":"UCB Farchim SA","fei":"3005023799","date":"2023-07-04","n":2,"cfr":"","url":"https://www.fda.gov/media/173281/download","t":"Appropriate controls are not exercised over computers or related systems to assure that changes in laboratory control records or other records are instituted only by authorized personnel. GMP related computerized systems and equipment have not been validated/qualified to demonstrate the suitability ofcomputer hardware and software to perform assigned tasks. For example, your firm appears to have performed Performance Verification for Empower 3 software, however the verification docs not evaluate the consistent performance of the software/equipment over a specified period and\nDEPARTMENT OF HEALTH AND HUMAN SERVICES\nFOOD AN D DRUG ADMINISTRATION DISTRICT /IDORESS 1\\110 PHONE N\\H,!BER OATE(S)OF 11\\SPECTION ORA OPQO HQ Room II 2032 06/26/2023-07/04/ 2023 12420 Parklawn, Rockville, MD 20857\nFEINUMSER 3005023799 E-mail: ORAPHARM1nternational483responses@fda.hhs.gov NAME ANO TITI.E OF INOIVlOl/","a":false,"b":true,"h":[[200,258]],"id":4525},{"y":2023,"k":0,"fac":"Vitang Technology LLC","fei":null,"date":"2023-06-12","n":2,"cfr":"21 CFR 820.70","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/vitang-technology-llc-653455-06122023","t":"Failure to validate software used as part of the quality system for its intended use according to an established protocol, as required by 21 CFR 820.70(i).\n\nSpecifically, you failed to validate your complaint handling system software. Your Ruby on Rails server-side web application framework, using the programming language Ruby and found at unismile.us, is used to maintain complaint files. However, your firm has failed to validate the software for its intended use.\n\nWe reviewed your firm's response and concluded that the adequacy of your firm's response cannot be determined at this time. In your response, your firm stated that your complaint handling system has been in use for a few years and has \"proven to be effective.\" However, your firm has not provided evidence of the effectiveness of this complaint handling system. Additionally, your firm stated that you initiated an action plan to ","a":false,"b":true,"h":[[171,467]],"id":2195},{"y":2023,"k":0,"fac":"Ming Fai Industrial Co LTD","fei":null,"date":"2023-06-01","n":1,"cfr":"21 CFR 820.75","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ming-fai-industrial-co-ltd-660075-06012023","t":"Failure to adequately ensure that when the results of a process cannot be fully verified by subsequent inspection and test, the process shall be validated with a high degree of assurance and approved according to established procedure, as required by 21 CFR 820.75(a). For example, your firm did not maintain documentation of validation for the following processes: b. Formulation calculation software for mixing of the ultrasound gel\n\nYour firm did not maintain validation records for the software used to calculate the amounts for the (b)(4) ingredients to be mixed for the ultrasound gel formulation.","a":false,"b":false,"h":[[446,498]],"id":1988},{"y":2022,"k":0,"fac":"Miami University Department of Chemistry and Biochemistry","fei":"3009095423","date":"2022-04-20","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/miami-university-department-chemistry-and-biochemistry-623494-04202022","t":"access.\n\nThe (b)(4) raw data was not backed-up since CGMP testing began.\n\nThe software that runs the (b)(4) did not have an audit trail.\n\nThe Excel spreadsheet used to calculate spike recovery and final results for the (b)(4) analysis was uncontrolled.\n\nThe software that runs the (b)(4) and (b)(4) equipment was not validated.\n\nSample reprocessing was not formally documented, although your firm stated reprocessing did occur.\n\nIn (b)(4) analyses, peaks of interest in the spectrum were chosen (b)(4) and were not covered by an established procedure.\n\nIn your response, you stated that the \"data manipulation\" was associated with a single analyst whose \"motivation was exclusively to avoid the reanalysis of samples that did not pass system suitability requirements.\" You also stated that the \"data manipulation\" was not performed to create results that conform to specification where they otherwise","a":true,"b":true,"h":[[258,326]],"id":2667}],"CS-ACC-007":[{"y":2026,"k":0,"fac":"Specialty Health Products CO, LLC","fei":null,"date":"2026-07-07","n":5,"cfr":"21 CFR 820.40","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/specialty-health-products-co-llc-726564-07072026","t":"Failure to establish and maintain procedures to control all documents that are required by this part, as required by 21 CFR 820.40.\n\nSpecifically, b. Multiple controlled documents, including the Device Master Record for the Hydro-San Plus and the Aqua Cleanse Work Instruction, were provided as editable MS Word files without password protection, electronic signatures, or any controls preventing unauthorized modification. The Aqua Cleanse work instruction was also undated and unsigned.\n\nYour firm's responses are not adequate. Your firm's CAPA-020 addresses individual instances of document control failures but does not demonstrate understanding of the systemic breakdown in your firm's document control system. Your firm has not explained how the body of one procedure was saved under the title of another and has not addressed the need for a comprehensive overhaul of its electronic document ma","a":false,"b":true,"h":[[318,334]],"id":135},{"y":2026,"k":0,"fac":"GC America, Inc.","fei":"1410097","date":"2026-05-14","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gc-america-inc-727602-05142026","t":"Your firm failed to establish adequate written responsibilities and procedures applicable to the quality control unit (21 CFR 211.22(d)).\n\nYour quality unit (QU) did not adequately oversee your drug manufacturing operations. For example, your QU failed to ensure adequate control of your analytical data. Our investigator documented an uncontrolled password for the (b)(4) meter affixed to a laptop by a sticker used for processing (b)(4) meter test results. In addition, the data from the (b)(4) meter is automatically deleted when the laptop is shutdown, so no records were available to show that your QU reviewed this data. Furthermore, you were unable to provide audit trails or an SOP describing oversight and retention requirements of electronic records. The lack of proper electronic record controls undermines the reliability and integrity of your laboratory data (21 CFR 211.68(b)).\n\nYour QU","a":false,"b":true,"h":[[333,411]],"id":339},{"y":2022,"k":0,"fac":"Nortec Quimica SA","fei":"3007616930","date":"2022-12-08","n":1,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/nortec-quimica-sa-639894-12082022","t":"your firm exports to the United States. The investigator also observed that the stand-alone computer systems for your UV-Vis and IR spectrophotometers failed to have usernames attributable to specific individuals, and instead used a common username. No password was required to sign into the Windows operating system, nor did the analytical software require any additional user log in. Further, you did not back up your stand-alone computers used to operate your UV-Vis and IR spectrophotometers.\n\nTo ensure data integrity, actions performed must be attributable to a specific individual in your CGMP computer systems, and equipment should be appropriately controlled to prevent deletion and/or changes except by authorized personnel.\n\nIn your response, you state you restricted access and permissions in the automated data system, implemented back-up practices for stand-alone computerized systems, ","a":true,"b":true,"h":[[250,261]],"id":2458},{"y":2022,"k":1,"fac":"Valisure, LLC","fei":"3012063246","date":"2022-07-06","n":3,"cfr":"","url":"https://www.fda.gov/media/164244/download","t":"Lab The firm has failed to adequately control data access within analytical equipment used for the analysis of pharmaceutical products. For example, The' (b) (1)_J,[(15) (4: (b) (4 )J,I (b) (4) ~, and the.(b)(4 : (b) (4)J have no controlled access(i.e. no passwords required). Furthermore, each analyst has administrative access to these systems. Quality System","a":true,"b":false,"h":[[253,265]],"id":4921}],"CS-EDC-003":[{"y":2026,"k":0,"fac":"Specialty Health Products CO, LLC","fei":null,"date":"2026-07-07","n":5,"cfr":"21 CFR 820.40","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/specialty-health-products-co-llc-726564-07072026","t":"Failure to establish and maintain procedures to control all documents that are required by this part, as required by 21 CFR 820.40.\n\nSpecifically, b. Multiple controlled documents, including the Device Master Record for the Hydro-San Plus and the Aqua Cleanse Work Instruction, were provided as editable MS Word files without password protection, electronic signatures, or any controls preventing unauthorized modification. The Aqua Cleanse work instruction was also undated and unsigned.\n\nYour firm's responses are not adequate. Your firm's CAPA-020 addresses individual instances of document control failures but does not demonstrate understanding of the systemic breakdown in your firm's document control system. Your firm has not explained how the body of one procedure was saved under the title of another and has not addressed the need for a comprehensive overhaul of its electronic document ma","a":false,"b":true,"h":[[150,422]],"id":135},{"y":2025,"k":0,"fac":"Chromatography Institute of America dba Compounder’s International Analytical Laboratory","fei":"3012069146","date":"2025-08-20","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/chromatography-institute-america-dba-compounders-international-analytical-laboratory-708944-08202025","t":"Lack of adequate Quality Unit oversight\n\nYour Quality Unit (QU) failed to exercise adequate oversight over your contract testing operations. For example, your QU failed to ensure:\n\nEstablishment of restricted access and appropriate controls on computerized systems to prevent any potential alteration or deletion of laboratory data.\n\nImplementation of an effective document control system for issuance, tracking, and reconciliation of CGMP documents used for laboratory testing and analysis.\n\nReview and approval of an uncontrolled document, \"Sample Prep Tips and Tricks,\" used by laboratory staff for preparation of analytical samples.\n\nIn your response you state that moving forward, you will create individual logins on your computers, and you are looking into installing technology with audit trail capability. Further, you state that you will create templates for your forms and bind them into a","a":false,"b":true,"h":[[519,577]],"id":803},{"y":2025,"k":0,"fac":"Mectronic Medicale S.R.L.","fei":null,"date":"2025-06-27","n":4,"cfr":"21 CFR 820.80","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/mectronic-medicale-srl-707997-06272025","t":"Failure to establish and maintain procedures acceptance activities, as required by 21 CFR 820.80.\n\nFor example: During the inspection your firm was unable to provide procedures for receiving inspection and stated that receiving inspection procedures have not been established. For example, your firm stated that they performed a 100% verification of laser diode power output and identified these as critical components used in your firm's therapeutic devices. However, the laser diode acceptance activities were recorded on an uncontrolled document without identifying the test equipment used (e.g., laser power meter), nor its operator performing the test. These were not recorded in your firm's Device History Record.","a":false,"b":false,"h":[[527,592]],"id":887},{"y":2024,"k":0,"fac":"S & J International Enterprises Public Company Limited","fei":"3005979923","date":"2024-01-26","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/s-j-international-enterprises-public-company-limited-668482-01262024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) did not provide adequate oversight and control over your drug manufacturing operations. Specifically, your QU did not implement adequate controls to prevent the alteration of production records, to ensure the complete documentation of laboratory preparation, and to ensure the review of raw analytical data. For example, production staff are able to alter master batch records, including modifying batch formulations and other parameters or formulations before printing. Laboratory sample preparation is not documented, and weight print-outs are not retained. Lastly, your QU only reviews analytical results entered into your enterprise syste","a":false,"b":true,"h":[[579,727]],"id":1913}],"CS-P11-001":[{"y":2026,"k":0,"fac":"Specialty Health Products CO, LLC","fei":null,"date":"2026-07-07","n":5,"cfr":"21 CFR 820.40","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/specialty-health-products-co-llc-726564-07072026","t":"Failure to establish and maintain procedures to control all documents that are required by this part, as required by 21 CFR 820.40.\n\nSpecifically, b. Multiple controlled documents, including the Device Master Record for the Hydro-San Plus and the Aqua Cleanse Work Instruction, were provided as editable MS Word files without password protection, electronic signatures, or any controls preventing unauthorized modification. The Aqua Cleanse work instruction was also undated and unsigned.\n\nYour firm's responses are not adequate. Your firm's CAPA-020 addresses individual instances of document control failures but does not demonstrate understanding of the systemic breakdown in your firm's document control system. Your firm has not explained how the body of one procedure was saved under the title of another and has not addressed the need for a comprehensive overhaul of its electronic document ma","a":false,"b":true,"h":[[278,422]],"id":135},{"y":2026,"k":1,"fac":"BayCare Integrated Service Center LLC","fei":"3013023419","date":"2026-03-12","n":6,"cfr":"","url":"https://www.fda.gov/media/192067/download","t":"until 11/26/25 - after the partial release of the drug product had ah-eady occuned. The lot was distributed on 12/2/25. • The identification of the microorganism (Cory nebacterium afermentans ss lipophilum) was not returned until 12/11/25, and the final review and approval of this investigation were not signed until 12/29/25 and approved by the Director of Pharmacy on 1/26/26. This practice demonstrates a lack of thorough review of an unexplained discrepancy prior to product distribution, as a significant portion of the batch was released before conclusive evidence regarding the nature, root cause, and potential impact of the microbial recovery was fully established and documented in a completed investigation.","a":true,"b":false,"h":[[254,311]],"id":3169},{"y":2022,"k":0,"fac":"Bi-Coastal Pharma International","fei":"3013263547","date":"2022-06-30","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/bi-coastal-pharma-international-628196-06302022","t":"procedure requires signatures for the \"Reviewed by\" space and the \"Reviewed and Released by\" space in your Certificate of Release. However, our inspection found that Hydroquinone Gel 4% bulk lot number (b)(4) was released for distribution though the \"Reviewed by\" space was not signed. • Your training procedure states a QU representative will counter sign and date employee training forms, confirming that the employee is appropriately trained on the procedures. However, QU representative signatures were missing on 2020 and 2021 employee training records for various individuals, including QU staff who continued to perform quality duties.\n\nEstablishing and following adequate written procedures is essential for the proper functioning of your manufacturing operations.\n\nYour response is inadequate. You failed to provide an investigation into the impact of inadequate batch review and release pra","a":true,"b":true,"h":[[251,284]],"id":2640},{"y":2022,"k":1,"fac":"OPS International Inc dba Olympia Pharmaceuticals","fei":"3009724085","date":"2022-03-02","n":5,"cfr":"","url":"https://www.fda.gov/media/160667/download","t":"target fill volume {~lJ I )J. was [ (6) and your firm produced (6) {4 A note on the batch record states, \"some low fills\". No deviation was initiated. This batch was released and distributed without Quality review (QC Approved sticker a~plied to the batch record but not signed) despite the OOS for yield and assay, 89% (spec,T(6) -(4 1]). d. On 8/18/21, your firm-initiated Deviation #2021-021 for Lipo Mino Mix Lot #.(6) 1!.)J, due to high assay for l. (6) (4) _j, 115.2% (spec.: j(6) (4)]). Your firm attributed the root cause as a techmcian en or during mixing operations. The technician added an unknown amount of 1 ( b) ( 4 !. The batch req~ {b) (4 ) .J of 1 ( b) ( 4J which according to the technician would take (b) (4 ~ beakers, (1:5) (4 ~ at a time and due to not adequately recording in the batch record the technician lost track. Your firm's assessment was to reject the batch and instruc","a":true,"b":true,"h":[[256,277]],"id":5137}],"CS-DI-003":[{"y":2026,"k":0,"fac":"Genzyme Ireland Limited","fei":null,"date":"2026-06-22","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/genzyme-ireland-limited-728681-06222026","t":"Your firm's quality control unit failed to exercise its responsibility to ensure that drug products are manufactured in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity, as required by 21 CFR 211.22.\n\nSpecifically, your quality unit failed to exercise its responsibility to ensure compliance with the following CGMP requirements: i. Multiple non-viable particulate excursions and repeated (b)(4) test failures across multiple batches present in instrument histories were not documented in laboratory records for review and investigation. (b)(4) testing was repeated up to 11 times without documentation.\n\nii. On multiple occasions, the number of active air monitoring samples documented in environmental monitoring records was not directly traceable to the instrument histories of the specific air samplers identified on those records. Additionall","a":false,"b":true,"h":[[591,655]],"id":275},{"y":2026,"k":0,"fac":"Ava Inc.","fei":"3008736380","date":"2026-04-14","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ava-inc-721180-04142026","t":"performed a trial injection of a sample of (b)(4) % (b)(4) topical solution (b)(4) impurity content at HPLC vial location (b)(4) . The (b)(4) content result was (b)(4) parts per million (ppm) which met your specification of equal to or less than (b)(4) ppm. Your analyst then repeated the injection at vial location (b)(4) and obtained a result of less than (b)(4) ppm. Both results were within your acceptable specification range. However, the more favorable result was reported. Furthermore, your laboratory notebook contained no details of the sample preparation for the initial injection at location (b)(4) .\n\nOur investigators found chromatograms for testing performed at GC location (b)(4) , which your analyst stated was used for trial injections. For example, your analyst performed a trial injection of an in-process sample of (b)(4) % (b)(4) topical solution (b)(4) content determination at","a":true,"b":true,"h":[[258,479]],"id":368},{"y":2025,"k":0,"fac":"Persōn & Covey, Inc.","fei":"2011222","date":"2025-09-23","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/person-covey-inc-711191-09232025","t":"Chloride Hexahydrate) test four times prior to release for further processing, using the (b)(4) Spectrophotometer. You released the material after the (b)(4) sample obtained a passing result, which was the only test result attributed to bulk lot (b)(4) . The initial (b)(4) test results were disregarded and not investigated by your QU.\n\nThe inspection documented that \"System Administrator\" was the only user type attributable in the (b)(4) Software and laboratory personnel shared a common password for the Windows and (b)(4) software systems. Also, audit trails are not independently reviewed after analysis or at an established frequency; and there is no review of the electronic raw data or printed hard copy data.\n\nIn your response, you indicate that \" There was never a formal procedure for Data Integrity \" and you commit to developing one. Your response is inadequate. Your response did not ","a":true,"b":true,"h":[[255,335]],"id":773},{"y":2025,"k":1,"fac":"Central Admixture Pharmacy Services Inc","fei":"3014307835","date":"2025-09-05","n":4,"cfr":"","url":"https://www.fda.gov/media/189889/download","t":"and others. The firm uses a process of initial 100% product visual inspection, followed by 1st AQL visual inspection, a 2nd 100% visual inspection, and a 2nd AQL inspection to remove defects from the batch. This process of repeat inspections indicates testing into compliance. The firm has not established strict alert or action AQL limit controls for when to reject a batch. A failed 1st AQL or low batch yield only requires a nonconformance investigation, but scientific evidence is lacking in the investigations to support batch release. The firm has not explored additional product inspection methods such as filtration / microscopic examination of the solution or liquid particle analysis to determine if there are difficult to see particles that are missed after 100% and AQL visual inspections.","a":true,"b":false,"h":[[252,275]],"id":3427},{"y":2025,"k":0,"fac":"Aspen Pharmacare Holdings Limited","fei":"3007490529","date":"2025-02-24","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/aspen-pharmacare-holdings-limited-701671-02242025","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour Production and QU did not review electronic raw data and audit trails to ensure data integrity prior to batch release. Your operators obtained and printed a passing result after multiple production filter integrity tests failed. Your operators did not record or print the failing results. For example:\n\nOn August 8, 2024, two operators performed four post-use sterilizing filter integrity tests for (b)(4) batch (b)(4) . The four tests included three failing results and the final passing result. Your operators only reported the passing result.\n\nOn July 25, 2024, two operators performed nine filter integrity tests associated with (b)(4) , bulk batch (b)(4) . The nine te","a":false,"b":true,"h":[[346,454]],"id":1206},{"y":2024,"k":0,"fac":"Viatris, Inc.","fei":"3010453141","date":"2024-12-19","n":2,"cfr":"21 CFR 211.192","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/viatris-inc-690897-12192024","t":"stability timepoints, respectively. The analyst, after consulting their supervisor, aborted the HPLC sample set sequence without providing adequate justification. You also lacked evidence to substantiate the root cause of improper (b)(4) of (b)(4) . B. You invalidated OOT assay results and during retest subsequently dismissed an anomalous content uniformity result for (b)(4) mg Capsules, batch (b)(4) , attributing the original issue to HPLC column leakage. However, the equipment's audit trail did not document such an error, and you conducted retesting using different samples and equipment.\n\nIn your response, you acknowledge your inadequate laboratory investigations and data handling practices. Additionally, you commit to perform an extended evaluation across the rest of the laboratory to evaluate your laboratory practices and controls.\n\nYour response is inadequate. The conclusions of you","a":true,"b":true,"h":[[253,366]],"id":1346},{"y":2024,"k":1,"fac":"Viatris, Inc.","fei":"3010453141","date":"2024-06-26","n":2,"cfr":"","url":"https://www.fda.gov/media/184861/download","t":"repori~ Uni tests results in the initial nm and its con elation to OOS results obtained for Uniljs in re-mject10n and re-fill. Fmi hermore, the chromatographic data of retest was not verified and signed by analytical QA.\n4. Your Quality Unit conducted testing into compliance by retesting for the second time using new samples and changed HPLC equipment from HPLC ID: QCD571 to HPLC ID: QCD496. This retest analysis gave favorable (passing) results for CU and confnmed OOT result for Assay based on which your firm released the batch into the market. C. Laboratory Investigation PR ID~ 2970698, Date Opened: 19-Nov-2022, Product:.J \"-\" w;] (b)1-41 Tablets mPMBatch No-l Type of Analyses: Dissolution by HPLC, Issue: L....:,<4~bmepomt (b)C, 11 for Unit ~was ~ % against tlie acceptance criteria o~tb ] % to I]%. Result: Uni ~ not complying to ~ stage criteria. Stage: Finished Product. This OOS invest","a":true,"b":true,"h":[[252,275]],"id":4026},{"y":2024,"k":0,"fac":"Amman Pharmaceutical Industries","fei":"3013501887","date":"2024-02-14","n":3,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/amman-pharmaceutical-industries-668867-02142024","t":"microbial settling and air plates were not accurate and/or documented.\n\nYour analytical chemists were able to manipulate chromatographic integration parameters to erroneously obtain results meeting the established specifications for (b)(4) Lot (b)(4) . It was only when our investigator requested that you follow your established integration procedures and recalculate the potency for the active ingredient, that you documented an out-of-specification test result, and subsequently opened an investigation.\n\nYour firm did not retain original source data (metadata) from the HPLC equipment to ensure audit trails could be properly reviewed. During our inspection, you confirmed that original data had been overwritten, and therefore could not be accessed.\n\nYour response includes conducting a holistic review of data management, including a root cause investigation, appropriate employee training, and","a":true,"b":true,"h":[[253,505]],"id":1901},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"An analyst weighed out the same samples of amitriptyline hydrochloride tablets USP 100 mg batches multiple times for (b)(4) by (b)(4) test. The analyst stated to our investigator that he did not report all the test results, further stating that in some instances balance printouts were discarded in the trash. In addition, the time stamp on each of the analytical balance and (b)(4) printouts did not match your Laboratory Information Management System (LIMS) records.\n\nIn your response, you commit to working with a qualified consultant to perform an overall baseline assessment of data integrity and governance controls, and to establish a remediation plan.\n\nYour response is inadequate in that it did not fully evaluate the scope of this deficiency and the impact to product quality. You did not adequately address the major failure of laboratory, operations, and quality assurance management to c","a":false,"b":true,"h":[[0,222]],"id":2142}],"CS-DI-004":[{"y":2026,"k":0,"fac":"Genzyme Ireland Limited","fei":null,"date":"2026-06-22","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/genzyme-ireland-limited-728681-06222026","t":"repeated (b)(4) test failures across multiple batches present in instrument histories were not documented in laboratory records for review and investigation. (b)(4) testing was repeated up to 11 times without documentation.\n\nii. On multiple occasions, the number of active air monitoring samples documented in environmental monitoring records was not directly traceable to the instrument histories of the specific air samplers identified on those records. Additionally, logbooks documenting when environmental monitoring was performed were not always consistent with cleanroom entry and exit times for personnel performing the sampling. Consequently, these records could not be relied upon to accurately document environmental monitoring activities, as accurate records are critical to providing reliable evidence of environmental control.\n\niii. Your laboratory records were incomplete because qualit","a":true,"b":true,"h":[[252,454]],"id":275},{"y":2026,"k":0,"fac":"Gopaldas Visram & Co., Ltd.","fei":"3009565091","date":"2026-06-02","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gopaldas-visram-co-ltd-721755-06022026","t":"spectroscopy was (b)(4) cm- 1 to (b)(4) cm- 1 and did not include any scale expansions. Your spectra does not evaluate for the presence of serpentines in the range of (b)(4) cm- 1 and (b)(4) cm- 1 . Additionally, in the identification testing records provided, the IR spectral data shows wavenumber values identical to three decimal places across two independently collected talc samples, which is statistically unlikely and raises concerns regarding the authenticity of the reported results.\n\nFurthermore, our review indicates that your QU failed to investigate data discrepancies associated with identification testing for talc. IR data for talc lot (b)(4) identified no maximas, on a scale of approximately (b)(4) cm−1 to (b)(4) cm−1 scan. The USP identification by IR Absorption has a specification of maxima at (b)(4) cm−1, (b)(4) cm−1, and (b)(4) cm−1. From the scale of the scan, the second pe","a":true,"b":true,"h":[[261,491]],"id":321},{"y":2026,"k":0,"fac":"Ava Inc.","fei":"3008736380","date":"2026-04-14","n":2,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/ava-inc-721180-04142026","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records did not include complete and accurate data to support the analyses performed. For example:\n\nThe audit trail for the Fourier Transform Infrared (FTIR) spectroscopy equipment showed no activity from September 23 to 30, 2025. However, your testing records, including the FTIR daily usage log, showed drug testing was performed with this equipment during this time frame. Furthermore, your analyst stated your FTIR system frequently crashes.\n\nOur investigators found chromatograms for testing performed at HPLC location 61, which your analyst stated was used for trial injections, although your HPLC procedure had been updated in 2022 to remove the requirement to perform trial inject","a":false,"b":true,"h":[[312,586]],"id":368},{"y":2025,"k":1,"fac":"Micro Labs Limited","fei":"3004495158","date":"2025-02-07","n":1,"cfr":"","url":"https://www.fda.gov/media/191689/download","t":"b h 141 Th T1me: (bT~ was rm•s sm• g m• your ate pac agmg recor or ate ,__\"\"\"\"\"' (b) e entiy periainmg to this missing printout was found in your standalone Lealc Tester ID: PR707 data storage. Your Packaging Operator I C6Tc1 mislead us by providing conflicting information as follows: On 31-Jan-2025, demonstrated Leak Test Apparatus performance check that he performed (bTC6l I °''1 on 30/01/2025 by usm{J:!filled bottles from rejected bottles crate Upon askint th~ reason for using rejected bottles for conducting Leak Test Apparatus performance check. (b)liil apologized for using rejected bottles and stated he should not have used rejected bottles. (b>C6l stated that the Leak Test printout was disposed in the scrap due to inconect number of sample entiy in the printout. Later, on the same dayc::J stated that he conducted leak performance test without any bottle and simply took printout dep","a":true,"b":true,"h":[[250,273]],"id":3765},{"y":2024,"k":0,"fac":"Grupo Quimico SRL","fei":"3012281081","date":"2024-04-30","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/grupo-quimico-srl-674010-04302024","t":"of (b)(4) drug product, which is marketed in the United States. When your firm subsequently processed the drug product sample injections after their discovery by the investigator, the injections were determined to be OOS for ingredient (b)(4) assay. The printed data for these batches, reviewed by your QU, failed to include these OOS results or indicate that additional sample analysis had been conducted. The final analytical results reported to your client were passing and did not include the OOS data.\n\nManual Sample Integration Not Indicated\n\nYour firm performed manual integration of sample assay peaks. The printed data reviewed by your QU did not indicate that manual integration was performed. Manual integration should be reviewed by your QU to ensure it is performed adequately.\n\nAll data must be complete, accurate, and retained to enable appropriate assessments and decisions by the QU ","a":true,"b":true,"h":[[250,405]],"id":1759},{"y":2023,"k":0,"fac":"Intas Pharmaceuticals Limited","fei":"3004011473","date":"2023-07-28","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/intas-pharmaceuticals-limited-652067-07282023","t":"An analyst weighed out the same samples of amitriptyline hydrochloride tablets USP 100 mg batches multiple times for (b)(4) by (b)(4) test. The analyst stated to our investigator that he did not report all the test results, further stating that in some instances balance printouts were discarded in the trash. In addition, the time stamp on each of the analytical balance and (b)(4) printouts did not match your Laboratory Information Management System (LIMS) records.\n\nIn your response, you commit to working with a qualified consultant to perform an overall baseline assessment of data integrity and governance controls, and to establish a remediation plan.\n\nYour response is inadequate in that it did not fully evaluate the scope of this deficiency and the impact to product quality. You did not adequately address the major failure of laboratory, operations, and quality assurance management to c","a":false,"b":true,"h":[[323,467]],"id":2142}],"CS-EDC-005":[{"y":2026,"k":0,"fac":"Huons Co., Ltd.","fei":"3007163376","date":"2026-06-15","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/huons-co-ltd-724650-06152026","t":"Your firm failed to ensure that laboratory records included complete data derived from all tests necessary to ensure compliance with established specifications and standards (21 CFR 211.194(a)).\n\nYour laboratory records lacked complete and original data to support the analyses performed. For example: B. During the walkthrough of your microbiology laboratories, we found 1,897 blank uncontrolled CGMP-related forms.","a":false,"b":false,"h":[[363,415]],"id":281},{"y":2026,"k":0,"fac":"Pharmathen International S.A.","fei":"3009961173","date":"2026-05-27","n":4,"cfr":"21 CFR 211.160","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/pharmathen-international-sa-723680-05272026","t":"For example, you did not have raw data and information related to sample preparation and the batch/sample identification number available for review. You also did not document the associated data and information contemporaneously.\n\nWe also noticed that critical CGMP documentation forms used to document test results printed from your IQVIA software (e.g., sterility test report) are not adequately controlled.\n\nProper document control and data management is foundational to CGMP to ensure the availability and integrity of data. Data should be attributable, legible, contemporaneously recorded, original or a true copy, and accurate (ALCOA) to ensure complete and accurate records.\n\nIn your response, you acknowledge that raw data was not documented contemporaneously and the need to improve your documentation practices based on a thorough root cause analysis and CAPA plan. You indicate that you r","a":true,"b":true,"h":[[253,409]],"id":298},{"y":2025,"k":1,"fac":"Simtra BioPharma Solutions","fei":"3002806419","date":"2025-09-26","n":11,"cfr":"","url":"https://www.fda.gov/media/190881/download","t":"The quality control unit lacks authority to review production records to assure that no errnrs have occuned. The odginal batch recordr(bw>7 was revised on several occasions without Quality Unit knowledge or approval, by the Production department to fix errors, such as missing times and missing signatures. This batch record was observed to have serval ai·eas flagged for conections or addition of missing information, located in the Production Supervisors Office. These conections are recorded on uncontrolled forms, and similar flags, and uncontrolled forms were observed in the discard bins.","a":false,"b":false,"h":[[498,553]],"id":3366},{"y":2025,"k":0,"fac":"Chromatography Institute of America dba Compounder’s International Analytical Laboratory","fei":"3012069146","date":"2025-08-20","n":3,"cfr":"","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/chromatography-institute-america-dba-compounders-international-analytical-laboratory-708944-08202025","t":"Lack of adequate Quality Unit oversight\n\nYour Quality Unit (QU) failed to exercise adequate oversight over your contract testing operations. For example, your QU failed to ensure:\n\nEstablishment of restricted access and appropriate controls on computerized systems to prevent any potential alteration or deletion of laboratory data.\n\nImplementation of an effective document control system for issuance, tracking, and reconciliation of CGMP documents used for laboratory testing and analysis.\n\nReview and approval of an uncontrolled document, \"Sample Prep Tips and Tricks,\" used by laboratory staff for preparation of analytical samples.\n\nIn your response you state that moving forward, you will create individual logins on your computers, and you are looking into installing technology with audit trail capability. Further, you state that you will create templates for your forms and bind them into a","a":false,"b":true,"h":[[334,490]],"id":803},{"y":2024,"k":0,"fac":"Analytical Food Laboratories, Inc.","fei":"3005057567","date":"2024-10-10","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/analytical-food-laboratories-inc-687513-10102024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) lacked adequate oversight of your contract testing operations. For example, your QU failed to adequately:\n\ncontrol the issuance and reconciliation of uncontrolled loose forms used for documenting laboratory testing, equipment uses, and calibrations.\n\nreview laboratory records to ensure completeness, including documentation of blank, sample, and mobile phase preparations.\n\nFurthermore, while your quality manual, \"Manual of Quality Policies for Analytical Food Laboratories\" and SOP PRO42-1, \"Quality Department Responsibilities\" referenced 21 CFR 58.35, your procedures did not detail how your operations would meet 21 CFR parts 210 and 21","a":false,"b":true,"h":[[365,506]],"id":1450},{"y":2024,"k":0,"fac":"Jiangsu Hengrui Pharmaceuticals Co., Ltd.","fei":"3007373503","date":"2024-07-11","n":1,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/jiangsu-hengrui-pharmaceuticals-co-ltd-679790-07112024","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour firm failed to provide adequate oversight and ensure the reliability of data related to the quality of finished drug products manufactured at your facility. For example, our inspection documented serious quality assurance (QA) deficiencies, such as discarded original CGMP records found stacked in a bag underneath a vehicle and in a nearby trash can, as well as your production manager's unrestricted access to blank production batch records and other CGMP documents without QA issuance. Your QA department was not exercising its basic responsibilities for the oversight and control over the adequacy and reliability of all CGMP data at your facility. In addi","a":false,"b":true,"h":[[603,727]],"id":1647},{"y":2023,"k":0,"fac":"Safecor Health, LLC","fei":"1218914","date":"2023-09-05","n":4,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/safecor-health-llc-657886-09052023","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour quality unit (QU) failed to ensure adequate document control over paper records. For example, our investigators observed partially completed and torn-up manufacturing records for a lot of children's acetaminophen and stacks of loose printed forms on a desk next to the repackaging area. Manufacturing records are not adequately controlled as they can be accessed and printed by employees with access to your firm's (b)(4) site. The use of correction fluid was also observed to make corrections on the daily cleaning log for solid oral dose packaging equipment. Your documentation practices raise concerns about the integrity, authenticity, and reliability of a","a":false,"b":true,"h":[[457,525]],"id":2080},{"y":2023,"k":0,"fac":"Gadal Laboratories Inc.","fei":"3008611487","date":"2023-08-15","n":3,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/gadal-laboratories-inc-655929-08152023","t":"Your firm failed to establish adequate written responsibilities and procedures applicable to the quality control unit and to follow such written procedure (21 CFR 211.22(d)).\n\nYour quality unit (QU) did not provide adequate oversight for the manufacture of your OTC drug products. For example, B. Analysts documented original laboratory data on uncontrolled sheets of paper. Analysts also recorded raw data in pencil and changed written data using correction fluid to obscure the original result.\n\nYour response to the use of uncontrolled sheets, correction fluid, and pencil in the Quality Control (QC) laboratory is inadequate. You do not specify the changes in your procedures you intend to implement to address these deficiencies. Additionally, there is no commitment to perform a retrospective review and risk assessment for potentially impacted data obtained for finished drug products manufact","a":false,"b":true,"h":[[297,373]],"id":2111},{"y":2023,"k":0,"fac":"Medgel Private Limited","fei":"3010165392","date":"2023-07-20","n":2,"cfr":"21 CFR 211.22","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/medgel-private-limited-654085-07202023","t":"Your firm's quality control unit failed to exercise its responsibility to ensure drug products manufactured are in compliance with CGMP, and meet established specifications for identity, strength, quality, and purity (21 CFR 211.22).\n\nYour QU did not provide adequate oversight and control over your drug manufacturing operations. For example, your QU failed to ensure the following:\n\nControlled access to master batch records and issuance of batch records.\n\nControlled correction and disposal of CGMP documentation.\n\nContemporaneous documentation of laboratory data that would support batch release (e.g., you had destroyed microbiological plates before recording the data).\n\nAppropriate data integrity controls (e.g., your QU failed to adequately restrict access to analytical instruments; you used shared usernames and passwords).\n\nProcedures for review of raw data and audit trails.\n\nIn your resp","a":false,"b":true,"h":[[385,456]],"id":2157}],"CS-AUD-007":[{"y":2026,"k":0,"fac":"Huons Co., Ltd.","fei":"3007163376","date":"2026-06-15","n":1,"cfr":"21 CFR 211.194","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/huons-co-ltd-724650-06152026","t":"critical breaches in data integrity. The first (b)(4) run failed endotoxin limits, and the second (b)(4) run revealed significant bioburden levels. However, your team leader had instructed staff to discard the bioburden plates with significant growth and had manipulated camera timestamps to create backdated documentation. In addition, the endotoxin failure had not been documented or investigated.","a":true,"b":false,"h":[[255,288]],"id":280},{"y":2026,"k":0,"fac":"Laboratorios Jaloma S.A. de C.V.","fei":"3002600322","date":"2026-05-22","n":3,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/laboratorios-jaloma-sa-de-cv-725939-05222026","t":"Your firm failed to exercise appropriate controls over computer or related systems to assure that only authorized personnel institute changes in master production and control records, or other records (21 CFR 211.68(b)).\n\nYour firm lacked sufficient controls over your gas chromatography (GC) instrument used to test components in your finished drug products. Your GC laboratory instrument was not adequately qualified because you failed to validate the control software or enable audit trails, and the GC data file creation and modification dates were not accurate.\n\nAdditionally, you did not have proper controls in place to prevent the deletion or manipulation of your laboratory's electronic raw data. During the inspection, our investigators documented several chromatograph data files that could not be located in the storage folders on your GC computer. Your firm confirmed that you did not ba","a":false,"b":true,"h":[[499,565]],"id":330},{"y":2025,"k":1,"fac":"Shilpa Medicare Limited","fei":"3009876430","date":"2025-11-21","n":3,"cfr":"","url":"https://www.fda.gov/media/190616/download","t":"difficult to clean all equipment surfaces. ---- K. During the walk-through inspection of 4 on 10 Nov. 2025, the spray gun hoses, used to clean lbR > the (b)(4 > were observed to be discolored. Management could not provide any documentation for when the last time the hoses were changed. The tt>X 4 > cleaning procedure states, \"Spray gun, spray gun tube found damaged/leakage, color change, same shall be rep laced with new on.e \". This procedure is not being followed. While watching cleaning of tt>X 4 > on 14 Nov. 20205, lbH4 > of the hoses leaked, one due to cracking in several places due to brittleness. L. Missing screws on the SOP states to remove the screws to clean (bH4 > the (bH4> ---- Not all the screw are replaced.","a":true,"b":false,"h":[[258,285]],"id":3304},{"y":2025,"k":0,"fac":"International Laboratories Corp","fei":"3006403166","date":"2025-03-10","n":2,"cfr":"21 CFR 211.68","url":"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/international-laboratories-corp-698522-03102025","t":"raw data. For example, our investigator documented numerous examples of deleted electronic raw data files. Additionally, your analysts had admin
